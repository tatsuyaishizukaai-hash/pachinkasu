<style>
/* Layout: the whole screen is the hall floor (landscape). Small sticker chips sit in the corners; commands appear at the bottom only while preparing. One bright look by design. */
:root{
  --sun:#ffd23f; --sun-2:#ffc21a; --ink:#16121f; --paper:#ffffff; --paper-2:#f2efff; --paper-3:#fff4cc;
  --red:#ff2d55; --blue:#2f6bff; --green:#14a35a; --purple:#7c3aed; --muted:#6b6880; --night:#2d2459;
  --c1:#8b8fa8; --c2:#3b82f6; --c3:#22c55e; --c4:#eab308; --c5:#f97316; --c6:#ff2d55;
  --f-display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Noto Sans JP",sans-serif;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --sl:0px; --sr:0px; --st:0px; --sb:0px;
  color-scheme:light;
}
html{height:100%;background:var(--night)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--f-body);font-weight:500;font-size:13px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
#probe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#root{position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:hidden;transform-origin:0 0;background:var(--night)}
#cv{position:absolute;left:0;top:0;display:block;touch-action:none;image-rendering:pixelated;image-rendering:crisp-edges}
.ui{position:absolute;inset:0;pointer-events:none;z-index:5}
.ui>*{pointer-events:auto}
#root.busy .ui>*{pointer-events:none}
.chipc{background:var(--paper);border:2.5px solid var(--ink);border-radius:12px;box-shadow:2px 3px 0 var(--ink)}

/* 上の端 */
.tl{position:absolute;top:calc(6px + var(--st));left:calc(6px + var(--sl));display:flex;flex-direction:column;gap:5px;max-width:42%}
.money-chip{padding:4px 9px 5px;display:flex;flex-direction:column;gap:1px;min-width:150px}
.mc-1{display:flex;gap:6px;align-items:baseline;font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden}
.mc-1 .nm{font-family:var(--f-display);color:var(--red);font-size:12px;overflow:hidden;text-overflow:ellipsis;max-width:9em}
.wx{font-size:10px;font-weight:800;border:2px solid var(--ink);border-radius:99px;padding:0 5px;background:#fff7b0;line-height:1.3}
.wx[data-w="rain"]{background:#bfdbfe}.wx[data-w="cloud"]{background:#e5e7eb}
.mc-2{display:flex;gap:7px;align-items:baseline;white-space:nowrap}
.mc-2 b{font-family:var(--f-display);font-weight:400;font-size:17px;line-height:1.1;font-variant-numeric:tabular-nums}
.mc-2 b.neg{color:var(--red)}
.today{font-size:11px;font-weight:800;font-variant-numeric:tabular-nums}
.tr{position:absolute;top:calc(6px + var(--st));right:calc(6px + var(--sr));display:flex;gap:5px;align-items:flex-start}
.st-chip{padding:4px 8px;display:flex;gap:8px;font-size:10.5px;font-weight:800;color:var(--muted);white-space:nowrap;align-items:center;min-height:32px}
.st-chip b{font-family:var(--f-display);font-weight:400;color:var(--ink);font-size:13px;margin-left:2px}
.ib{min-width:34px;height:32px;border:2.5px solid var(--ink);border-radius:10px;background:var(--paper);font-weight:800;font-size:11.5px;cursor:pointer;box-shadow:2px 3px 0 var(--ink);padding:0 7px;white-space:nowrap}
.ib:active{transform:translateY(2px);box-shadow:none}
.ibs{display:block;font-size:8.5px;color:var(--muted);line-height:1;margin-bottom:1px}
.tc{position:absolute;top:calc(6px + var(--st));left:50%;transform:translateX(-50%);max-width:38%;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
.tc>*{pointer-events:auto}
.clock{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;align-items:center}
.clock .tm{font-family:var(--f-display);font-size:14px;background:var(--ink);color:var(--sun);border-radius:9px;padding:1px 8px;border:2px solid var(--ink)}
.clock .tm.prep{background:var(--sun);color:var(--ink)}
.clock .stt{font-size:11px;font-weight:800;background:#fff;border:2px solid var(--ink);border-radius:99px;padding:0 7px;white-space:nowrap}
.pill{display:inline-block;border:2px solid var(--ink);border-radius:99px;padding:0 7px;font-size:10.5px;font-weight:800;white-space:nowrap;background:#fff;line-height:1.45}
.pill.go,.pill.ev{background:var(--red);color:#fff}
.pill.cal{background:#bfe1ff}.pill.riv{background:#e9d5ff}.pill.reg{background:#111;color:#fff}
.hint{font-size:11px;font-weight:800;background:var(--paper-3);border:2px solid var(--ink);border-radius:9px;padding:2px 8px;text-align:center;max-width:100%}

/* つぶやき */
.tw{background:rgba(255,255,255,.93);border:2px solid var(--ink);border-radius:10px;padding:3px 7px;font-size:11px;font-weight:800;line-height:1.35;display:flex;gap:6px;align-items:flex-start;transition:opacity .5s,transform .3s;animation:twin .3s ease-out}
.tw i{flex:none;width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);margin-top:2px}
.tw b{font-family:var(--f-display);font-weight:400;font-size:10.5px;color:var(--blue);margin-right:3px}
.tw.out{opacity:0}
@keyframes twin{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}

/* 下の端 */
.zoom{position:absolute;right:calc(6px + var(--sr));bottom:calc(10px + var(--sb));display:flex;flex-direction:column;gap:5px}
.prep .zoom{bottom:calc(62px + var(--sb))}
.zoom button{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;font-family:var(--f-display);font-size:15px;cursor:pointer;box-shadow:0 3px 0 var(--ink);padding:0}
.zoom button#zFit{font-size:9px}
.zoom button:active{transform:translateY(2px);box-shadow:none}
.speed{position:absolute;left:calc(6px + var(--sl));bottom:calc(8px + var(--sb));display:flex;gap:5px}
.speed .ib.on{background:var(--sun)}
#dock{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(6px + var(--sb));display:flex;gap:6px;max-width:calc(100% - 100px)}
.btn{background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:4px 10px;min-height:42px;min-width:62px;font-family:var(--f-display);font-size:13px;cursor:pointer;box-shadow:0 4px 0 var(--ink);line-height:1.15;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--red);color:#fff}
.btn.primary .sub{color:#ffe4ea}
.btn.hot{background:var(--sun)}
.btn.danger{background:#ffe1e7;color:#b0102f}
.btn.ghost{background:var(--paper-2);color:var(--muted);font-family:var(--f-body);font-weight:800}
.btn.sm{min-height:36px;min-width:0;font-size:12px;padding:3px 9px;border-width:2.5px;box-shadow:0 3px 0 var(--ink)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn:focus-visible,.ib:focus-visible,.chip:focus-visible,.sbtn:focus-visible,.zoom button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.toolbar{padding:6px 8px;display:flex;gap:10px;align-items:center}
.toolbar .tt{font-size:12px;font-weight:800;line-height:1.35;min-width:min(210px,100%);flex:1 1 auto}
.P .toolbar{flex-wrap:wrap;justify-content:center}
.toolbar .tt b{font-family:var(--f-display);font-weight:400;color:var(--red)}
.toolbar .row{display:flex;gap:6px;flex:none;align-items:center}
.dirset{display:flex;gap:3px;align-items:center}.dirset .dl{font-size:11px;font-weight:800;margin-right:2px;white-space:nowrap}.btn.sm.dbtn{min-width:34px;padding:3px 0;font-size:13px}
.sub{color:var(--muted);font-size:11.5px;font-weight:800;line-height:1.45}
#toast{position:absolute;bottom:calc(16px + var(--sb));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border:2.5px solid #fff;border-radius:12px;padding:5px 12px;font-weight:800;font-size:12.5px;white-space:nowrap;max-width:80%;overflow:hidden;text-overflow:ellipsis;pointer-events:none;opacity:0;transition:opacity .2s;z-index:8}
#toast.show{opacity:1}
#upd{position:absolute;top:calc(44px + var(--st));left:50%;transform:translateX(-50%);z-index:9;background:var(--red);color:#fff;border:2.5px solid var(--ink);border-radius:99px;padding:4px 14px;font-weight:800;font-size:12px;box-shadow:2px 3px 0 var(--ink);white-space:nowrap;cursor:pointer}
.prep #toast{bottom:calc(var(--dockh,48px) + 14px + var(--sb))}

/* シート（横画面では右側の引き出し） */
#scrim{position:absolute;inset:0;background:rgba(22,18,31,.35);z-index:20}
.sheet{position:absolute;z-index:21;display:flex;flex-direction:column;background:var(--paper);border:3px solid var(--ink);box-shadow:-3px 4px 0 var(--ink)}
.L .sheet{right:calc(6px + var(--sr));top:calc(6px + var(--st));bottom:calc(6px + var(--sb));width:min(56%,520px);border-radius:16px}
.P .sheet{left:6px;right:6px;bottom:0;max-height:86%;border-radius:16px 16px 0 0;border-bottom:0;padding-bottom:var(--sb)}
.sheet-head{display:flex;align-items:center;gap:8px;padding:7px 10px 7px 12px;border-bottom:3px solid var(--ink);background:var(--sun);border-radius:13px 13px 0 0}
.sheet-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:15px;flex:1;text-wrap:balance}
.sheet-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:10px 12px 16px;display:flex;flex-direction:column;gap:9px;line-height:1.5;touch-action:pan-y}
.rot .sheet-body{touch-action:none}
.sheet-body>*{flex-shrink:0}
.lbl{font-family:var(--f-display);font-size:12.5px;letter-spacing:.04em}
.pos{color:var(--green)} .neg{color:var(--red)}
.box{background:var(--paper-2);border:2px solid var(--ink);border-radius:11px;padding:7px 10px;font-weight:800;font-size:12.5px}
.box.col{display:flex;flex-direction:column;gap:3px}
.box.neg{background:#ffe1e7}
.empty{color:var(--muted);font-weight:800;font-size:12.5px;padding:8px;border:2px dashed var(--muted);border-radius:11px}
.chips,.tabs{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#fff;border:2.5px solid var(--ink);border-radius:99px;padding:3px 11px;font-weight:800;font-size:12.5px;cursor:pointer;min-height:34px;white-space:nowrap}
.chip.cur{background:var(--ink);color:var(--sun)}
.chip.wide{width:100%;white-space:normal}
.chip:disabled{opacity:.35}
.setrow{display:flex;gap:5px;flex-wrap:wrap}
.sbtn{min-width:36px;height:36px;border-radius:10px;border:2.5px solid var(--ink);background:#fff;font-family:var(--f-display);font-size:14px;cursor:pointer;padding:0 6px}
.sbtn.wide{font-family:var(--f-body);font-weight:800;font-size:12px;flex:1;min-width:0}
.setrow.small .sbtn{min-width:30px;height:30px;font-size:13px}
.setrow.small .sbtn.wide{font-size:11.5px}
.sbtn.cur{color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.sbtn:disabled{opacity:.5}
.bulk .sbtn{color:#fff}
.c1.cur,.bulk .c1,.badge.c1{background:var(--c1)} .c2.cur,.bulk .c2,.badge.c2{background:var(--c2)} .c3.cur,.bulk .c3,.badge.c3{background:var(--c3)}
.c4.cur,.bulk .c4,.badge.c4{background:var(--c4)} .c5.cur,.bulk .c5,.badge.c5{background:var(--c5)} .c6.cur,.bulk .c6,.badge.c6{background:var(--c6)}
.n0.cur,.bulk .n0,.badge.n0{background:var(--c1)} .n1.cur,.bulk .n1,.badge.n1{background:var(--c2)} .n2.cur,.bulk .n2,.badge.n2{background:var(--c3)}
.n3.cur,.bulk .n3,.badge.n3{background:var(--c5)} .n4.cur,.bulk .n4,.badge.n4{background:var(--c6)}
.bulk{display:flex;flex-direction:column;gap:4px}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:6px;color:#fff;font-family:var(--f-display);font-size:12px;padding:0 5px;border:2px solid var(--ink)}
.mp-head{display:flex;gap:12px;align-items:center}
.mp-no{font-family:var(--f-display);font-size:30px;color:var(--red);line-height:1;text-align:center;min-width:58px;font-variant-numeric:tabular-nums}
.mp-no small{display:block;font-size:11px;color:var(--ink)}
.mp-t{min-width:0}
.mp-name{font-family:var(--f-display);font-size:16px;line-height:1.3}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.tag{border:2px solid var(--ink);border-radius:7px;padding:0 6px;font-size:10.5px;font-weight:800;background:#fff;white-space:nowrap}
.tag.kp{background:#bfdbfe}.tag.ks{background:#fbcfe8}.tag.smk{background:#ddd6fe}.tag.new{background:var(--red);color:#fff}.tag.dark{background:var(--ink);color:#fff}
.stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-variant-numeric:tabular-nums}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .wide2{grid-column:1/-1}
.item{display:flex;align-items:center;gap:10px;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:7px 9px}
.item .sw{width:30px;height:30px;border-radius:9px;flex:none;border:2.5px solid var(--ink)}
.item .sw.face{border-radius:50%}
.item .it{flex:1;min-width:0}
.item .nm{font-family:var(--f-display);font-size:13.5px;line-height:1.35}
.item .ds{font-size:11.5px;color:var(--muted);font-weight:800;line-height:1.45}
.item .col{display:flex;flex-direction:column;gap:5px;flex:none}
.item .btn.sm{font-size:12px;white-space:nowrap}
.locked{opacity:.5}
.lrow{background:#fff;border:2.5px solid var(--ink);border-radius:11px;padding:5px 8px;display:flex;flex-direction:column;gap:4px}
.lrow.tgt{background:#fff0f3;border-color:var(--red)}
.lrow .l1{display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.lrow .no{font-family:var(--f-display);color:var(--red);font-size:14px;min-width:28px}
.lrow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:800}
.lrow .rs{font-size:11px;font-weight:800;white-space:nowrap}
.rt{font-size:10px;font-weight:800;border:2px solid var(--ink);border-radius:6px;padding:0 4px;background:#ffd1db;white-space:nowrap}
.rt.lo{background:#bbf7d0}
.isl-h{font-family:var(--f-display);font-size:14px;margin-top:3px}
.hb{flex:1;min-width:40px;height:12px;border:2px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;position:relative}
.hb i{position:absolute;inset:0 auto 0 0;background:var(--blue)}.hb.low i{background:#9ca3af}.hb.high i{background:var(--red)}
.hrow{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-weight:800;font-size:12px;padding:2px 0}
.hrow.in{padding:0}
.hrow .no{font-family:var(--f-display);color:var(--red);font-size:14px;min-width:26px}
.hrow .nm{width:38%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.hrow .nm small{display:block;font-size:10px;color:var(--muted)}
.hrow .pc{width:38px;text-align:right}
.dv{white-space:nowrap;font-weight:800;font-size:12px;text-align:right;min-width:74px;font-variant-numeric:tabular-nums}
.rk{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:99px;background:var(--paper-2);border:2px solid var(--ink);font-family:var(--f-display);font-size:11px}
.rk.top{background:var(--sun)}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rcell{display:flex;flex-direction:column;gap:2px;font-size:11px;font-weight:800}
.rcell span{display:flex;gap:4px;align-items:center}.rcell em{font-style:normal;font-size:9.5px;color:#fff;background:var(--muted);border-radius:6px;padding:0 4px}
.rcell .field{padding:4px 6px;font-size:14px;width:100%}
.sw.big{width:30px;height:30px}
.verdict{font-family:var(--f-display);font-size:19px}
.verdict.good{color:var(--red)} .verdict.mid{color:var(--blue)} .verdict.bad{color:var(--ink)}
.meter{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-weight:800}
.mt-bar{position:relative;height:15px;border:2.5px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.mt-bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--c4),var(--red))}
.mt-bar .mk{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.mt-v{font-family:var(--f-display)}
.burstcard{position:relative;padding:18px 12px;text-align:center;isolation:isolate}
.burstcard::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--red);clip-path:polygon(50% 0,58% 18%,75% 6%,74% 26%,95% 22%,84% 40%,100% 50%,84% 60%,95% 78%,74% 74%,75% 94%,58% 82%,50% 100%,42% 82%,25% 94%,26% 74%,5% 78%,16% 60%,0 50%,16% 40%,5% 22%,26% 26%,25% 6%,42% 18%)}
.burstcard.bad::before{background:var(--ink)}
.burstcard.gold::before{background:var(--sun)}
.bc-main{font-family:var(--f-display);font-size:22px;color:#fff;text-shadow:2px 2px 0 var(--ink)}
.burstcard.gold .bc-main{color:var(--red)}
.bc-sub{font-weight:800;color:#fff;font-size:12.5px}
.burstcard.gold .bc-sub{color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;text-align:center}
.kpis div{background:#fff;border:2.5px solid var(--ink);border-radius:11px;padding:5px 4px}
.kpis b{display:block;font-family:var(--f-display);font-weight:400;font-size:19px;font-variant-numeric:tabular-nums}
.kpis span{font-size:10.5px;color:var(--muted);font-weight:800}
.segs{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;font-weight:800;color:var(--muted)}
.mt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-weight:800;font-size:12.5px}
.mt td{padding:3px 2px;border-bottom:2px dotted rgba(22,18,31,.18)}
.mt td:last-child{text-align:right}
.mt tr.total td{border-bottom:none;font-family:var(--f-display);font-weight:400;font-size:17px;padding-top:6px}
.voice{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:5px 10px;font-size:12.5px;font-weight:800;position:relative;margin-left:14px;display:flex;flex-wrap:wrap;gap:2px 8px}
.voice::before{content:"";position:absolute;left:-10px;top:8px;width:12px;height:12px;background:#fff;border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg)}
.voice.bad{background:#ffe8ec}.voice.bad::before{background:#ffe8ec}
.voice b{font-family:var(--f-display);font-weight:400}
.voice .cnt{color:var(--muted);white-space:nowrap;margin-left:auto}
.stampbox{display:flex;gap:14px;align-items:center;background:var(--paper-3);border:2.5px solid var(--ink);border-radius:13px;padding:9px 12px}
.stampbox.final{background:#fff}
.stamp{flex:none;min-width:60px;height:60px;padding:0 8px;border-radius:14px;border:4px solid currentColor;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;transform:rotate(-8deg);animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both}

function rebuildMaps(){

  for(const o of G.objs){occ.set(key(o.x,o.y),o);if(o.kind==='m'){const s=seatOf(o);seatMap.set(key(s.x,s.y),o)}}
  for(const d of G.doors){if(WB[d.type].noFront)continue;const f=frontOf(d);frontMap.set(key(f.x,f.y),d)}
}
function computeIslands(){
  const seen=new Set(),comps=[];
  const at=(x,y)=>{if(!inB(x,y))return null;const o=occ.get(key(x,y));return o&&o.kind==='m'?o:null};
  for(const m of machines()){
    if(seen.has(m.id))continue;
    const comp=[],st=[m];seen.add(m.id);
    while(st.length){const c=st.pop();comp.push(c);for(const[dx,dy]of DIRS){const n=at(c.x+dx,c.y+dy);if(n&&!seen.has(n.id)){seen.add(n.id);st.push(n)}}}
    comp.sort((a,b)=>a.y-b.y||a.x-b.x);comps.push(comp);
  }
  comps.sort((a,b)=>(a[0].y-b[0].y)||(a[0].x-b[0].x));
  let no=1;
  islands=comps.map((c,i)=>{
    const label=i<26?String.fromCharCode(65+i):'Z'+(i-25);
    const kinds=new Set(c.map(kindOf));
    const kind=kinds.size>1?'mix':[...kinds][0];
    c.forEach(m=>{while(no%10===4||no%10===9)no++;m.no=no++;m.island=label});
    return {label,ms:c,kind};
  });
}
function layoutChanged(){rebuildMaps();computeIslands();if(typeof markDirty==='function')markDirty()}
const islandOf=m=>(islands.find(i=>i.ms.includes(m))||{ms:[m],kind:kindOf(m)});
const islandMixed=m=>islandOf(m).kind==='mix';

function floodFrom(p,blocked){
  const seen=new Set([key(p.x,p.y)]),q=[p];
  while(q.length){const c=q.pop();for(const[dx,dy]of DIRS){const nx=c.x+dx,ny=c.y+dy;if(!inB(nx,ny))continue;const k=key(nx,ny);if(seen.has(k)||blocked.has(k))continue;seen.add(k);q.push({x:nx,y:ny})}}
  return seen;
}
const adjReach=(x,y,reach)=>DIRS.some(([dx,dy])=>inB(x+dx,y+dy)&&reach.has(key(x+dx,y+dy)));
function validate(objs,doors){
  const occM=new Map(),seatM=new Map(),frontM=new Map(),slots=new Set();
  for(const d of doors){
    const sk=d.side+d.pos;if(slots.has(sk))return 'その壁にはもう設備が付いています';slots.add(sk);
    if(WB[d.type].noFront)continue;
    const f=frontOf(d);
    if(!inB(f.x,f.y))return 'そこには付けられません';
    if(isEntrance(f.x,f.y))return '入口の前には付けられません';
    const fk=key(f.x,f.y);if(frontM.has(fk))return '扉の前が別の扉と重なります';frontM.set(fk,d);
  }
  for(const o of objs){
    if(!inB(o.x,o.y))return 'お店の外には置けません';
    if(isEntrance(o.x,o.y))return '入口には置けません';
    const k=key(o.x,o.y);
    if(occM.has(k))return 'もう物が置いてあります';
    if(frontM.has(k))return '扉の前には置けません';
    occM.set(k,o);
  }
  for(const o of objs){
    if(o.kind!=='m')continue;const s=seatOf(o);
    if(!inB(s.x,s.y))return '客席がお店の外になります';
    if(isEntrance(s.x,s.y))return '入口を客席にはできません';
    const k=key(s.x,s.y);
    if(occM.has(k))return '客席になる場所に物があります';
    if(seatM.has(k))return '客席が別の台と重なります';
    if(frontM.has(k))return '客席が扉の前になります';
    seatM.set(k,o);
  }
  const reach=floodFrom(doorPos(),new Set(occM.keys()));
  for(const d of doors){if(WB[d.type].noFront)continue;const f=frontOf(d);if(!reach.has(key(f.x,f.y)))return '扉の前まで歩いて行けません'}
  for(const o of objs){
    if(o.kind==='m'){const s=seatOf(o);if(!reach.has(key(s.x,s.y)))return '通路がふさがってしまいます'}
    else if(DB[o.type].func&&!adjReach(o.x,o.y,reach))return '通路がふさがってしまいます';
  }
  return null;
}
/* 壁ぎわのマスから扉の位置を決める */
function doorSlotFor(x,y,pref){
  const c=[];
  if(y===0)c.push({side:'t',pos:x});
  if(x===0)c.push({side:'l',pos:y});
  if(x===G.W-1)c.push({side:'r',pos:y});
  if(!c.length)return null;
  if(pref){const p=c.find(s=>s.side===pref);if(p)return p}
  return c.find(s=>!G.doors.some(d=>d.side===s.side&&d.pos===s.pos))||c[0];
}

function nthMonday(y,m,n){const d=new Date(y,m,1);const off=(8-d.getDay())%7;return 1+off+(n-1)*7}
function isHoliday(d){
  const y=d.getFullYear(),m=d.getMonth()+1,dd=d.getDate();
  if(['1-1','2-11','2-23','3-20','4-29','5-3','5-4','5-5','8-11','9-23','11-3','11-23'].includes(m+'-'+dd))return true;
  return (m===1&&dd===nthMonday(y,0,2))||(m===7&&dd===nthMonday(y,6,3))||(m===9&&dd===nthMonday(y,8,3))||(m===10&&dd===nthMonday(y,9,2));
}
function dayInfo(day){
  const d=dateOf(day),m=d.getMonth()+1,dd=d.getDate(),wd=d.getDay();
  const tags=[];let mult=1,elder=1,hi=1;
  const weekend=wd===0||wd===6,hol=isHoliday(d);
  let special=null;
  if((m===4&&dd>=29)||(m===5&&dd<=6))special='ゴールデンウィーク';
  else if(m===8&&dd>=13&&dd<=16)special='お盆';
  else if((m===12&&dd>=29)||(m===1&&dd<=3))special='年末年始';
  if(special){tags.push(special);mult*=1.45}
  else if(weekend||hol){tags.push(hol&&!weekend?'祝日':'土日');mult*=1.28*LOCS[G.loc].weekend}
  else if(wd===5)mult*=1.08;
  if(m%2===0){const p=new Date(d.getFullYear(),m-1,15);while(p.getDay()===0||p.getDay()===6)p.setDate(p.getDate()-1);if(p.getDate()===dd){tags.push('年金支給日');mult*=1.12;elder=2.2}}
  if(dd===25){tags.push('給料日');mult*=1.12;hi=1.25}
  if(dd%10===7)tags.push('7のつく日');
  return {weekend:weekend||hol||!!special,tags,mult,elder,hi,wd,date:dd};
}

function genLayout(W,H,n){
  const objs=[],doors=[];let placed=0,row=0;
  const L=Math.min(10,W-2);
  const pPool=MODELS.filter(m=>m.k==='p'&&m.rank<=3),sPool=MODELS.filter(m=>m.k==='s'&&m.rank<=3);
  for(let y=2;y+2<=H-2&&placed<n;y+=4,row++){
    const segStart=[];for(let x=1;x<=W-2;x++){if((x-1)%(L+1)===L)continue;segStart.push(x)}
    let segIdx=0,prev=-9,kind=row%2?'s':'p',model=pick(kind==='p'?pPool:sPool).id,rate=Math.random()<0.3?'lo':'hi';
    for(const x of segStart){
      if(x!==prev+1){segIdx++;kind=(row+segIdx)%2?'s':'p';model=pick(kind==='p'?pPool:sPool).id;rate=Math.random()<0.3?'lo':'hi'}
      prev=x;
      for(const [yy,dir] of [[y,2],[y+1,0]]){
        if(placed>=n)break;
        objs.push({kind:'m',type:model,x,y:yy,dir,rate,set:kind==='s'?1+Math.floor(Math.random()*3):undefined,nail:kind==='p'?-Math.floor(Math.random()*2):undefined,installDay:-60});
        placed++;
      }
    }
  }
  objs.push({kind:'d',type:'counter',x:W-2,y:H-1});
  objs.push({kind:'d',type:'vending',x:1,y:H-1});
  doors.push({type:'toilet',side:'t',pos:W-2});
  if(W>=14)doors.push({type:'toilet',side:'t',pos:1});
  return {objs,doors};
}

    const o=spec.offer;
    G.floor=o.floor;G.wall=o.wall;if(!G.ownedFloors.includes(o.floor))G.ownedFloors.push(o.floor);if(!G.ownedWalls.includes(o.wall))G.ownedWalls.push(o.wall);
    o.lay.objs.forEach(x=>addObj(Object.assign({},x)));
    o.lay.doors.forEach(d=>G.doors.push({id:S.nid++,type:d.type,side:d.side,pos:d.pos}));
    S.offers=S.offers.filter(x=>x!==o);
  }else{
    STARTER.forEach(it=>S.storage.push(Object.assign({},it,{gift:1})));
  }
  S.go={type:'grand',start:S.day,len:3,scores:[]};S.lastOpen=S.day;S.moved=(S.moved||0)+1;
  S.rep=Math.round(S.rep*0.85*10)/10;
  S.event={type:'none',target:null,ad:false};
  undoStack=[];layoutChanged();
  news(`${LOCS[loc].name}の新しいお店に移転しました（旧店舗は${man(sale)}で売却）`,'big');
  return {sale,price};
}
function expandStore(dir){
  const addW=dir==='w'?2:0,addH=dir==='h'?2:0;
  const nW=G.W+addW,nH=G.H+addH;
  if(nW>G.maxW||nH>G.maxH)return 'これ以上は広げられません';
  const cost=(nW*nH-G.W*G.H)*LOCS[G.loc].priceTile*1.2;
  if(S.money<cost)return 'お金が足りません';
  pushUndo();S.money-=cost;G.renoSpend+=cost;
  const dx=addW/2,dy=addH,oldW=G.W,oldH=G.H,oz=G.zone;
  G.objs.forEach(o=>{o.x+=dx;o.y+=dy});
  G.doors.forEach(d=>{if(d.side==='t')d.pos+=dx;else d.pos+=dy});
  G.W=nW;G.H=nH;G.zone=new Array(nW*nH).fill(0);
  for(let y=0;y<oldH;y++)for(let x=0;x<oldW;x++)G.zone[(y+dy)*nW+x+dx]=oz[y*oldW+x];
  layoutChanged();
  return null;
}

/* ---------- 銀行 ---------- */
const LOAN_RATE=0.0008;
const loanLimit=()=>Math.round((1500000*rankNo()+storeValue()*0.3)*skLoan()/100000)*100000;
function borrow(n){n=Math.min(n,loanLimit()-S.loan);if(n<=0)return 0;S.loan+=n;S.money+=n;return n}
function repay(n){n=Math.min(n,S.loan,Math.max(0,S.money));if(n<=0)return 0;S.loan-=n;S.money-=n;return n}

/* ===== rivals.js : ライバル店（タイプ・店長・新しい店の出店・偵察・引き抜き） ===== */
const capF=n=>Math.pow((n+10)/30,0.6);
const openRivals=()=>S.rivals.filter(r=>r.open);
const bossOf=r=>BOSS_BY[r.boss]||BOSSES[0];
const typeOf=r=>RIVAL_TYPES[r.type]||RIVAL_TYPES.honest;
const patLabel=p=>p.t==='tail'?`${p.v}のつく日`:`毎週${WD[p.v]}曜`;
const SCOUT_COST=3000;
const RIV_EV_LABEL={ev:'イベント',newm:'新台入替',pension:'年金デー',go:'オープン期間'};
function weighted(a,w){let r=Math.random()*w.reduce((x,y)=>x+y,0);for(let i=0;i<a.length;i++){r-=w[i];if(r<=0)return a[i]}return a[a.length-1]}

function newRival(o){
  const B=BOSS_BY[o.boss];
  return {id:S.nid++,name:o.shop||B.shop,col:B.col,type:B.type,boss:B.id,rep:o.rep,base:o.rep,size:o.size,health:o.health??rnd(60,90),pat:B.pat,
    open:true,openDay:S.day,goUntil:0,ev:false,evKind:null,closedDay:0,next:!!o.next,revenge:!!o.revenge,newmDay:S.day+rndi(5,12),scout:null,boosted:false};
}
function initRivals(){S.rivals=START_RIVALS.map(s=>newRival(s));S.rivalPlans=[];S.rivalLog=[];S.incidents=[]}
/* 古いセーブのライバル店に、タイプと店長を割りあてる */
function migrateRivals(){
  if(!Array.isArray(S.rivals))S.rivals=[];
  for(const r of S.rivals){
    if(r.boss&&BOSS_BY[r.boss])continue;
    const B=BOSSES.find(b=>b.shop===r.name&&!S.rivals.some(x=>x.boss===b.id))||BOSSES.find(b=>!S.rivals.some(x=>x.boss===b.id))||BOSSES[0];
    Object.assign(r,{boss:B.id,type:B.type,col:r.col||B.col,pat:r.pat||B.pat,newmDay:S.day+rndi(3,12),next:false,revenge:false,scout:null,boosted:false,evKind:r.ev?'ev':null,openDay:r.openDay||1});
    if(!r.open&&!S.rivalLog.some(l=>l.boss===B.id))S.rivalLog.push({boss:B.id,shop:r.name,type:B.type,open:1,day:r.closedDay||S.day});
  }
}

/* ---------- 毎日のイベント予定 ---------- */
function planRivals(){
  const d=dateOf(S.day),info=dayInfo(S.day);
  for(const r of openRivals()){
    const T=typeOf(r);
    const pat=(r.pat.t==='tail'&&d.getDate()%10===r.pat.v)||(r.pat.t==='wd'&&d.getDay()===r.pat.v);
    r.ev=pat||Math.random()<T.evP+(seasonInfo(S.day)?0.3:0);r.evKind=r.ev?'ev':null;
    if(r.type==='chain'&&S.day>=r.newmDay){r.newmDay=S.day+rndi(10,15);if(!r.ev)r.evKind='newm'}
    if(!r.evKind&&r.type==='oldie'&&info.tags.includes('年金支給日'))r.evKind='pension';
    if(S.day<=r.goUntil){r.ev=false;r.evKind='go'}
  }
}
function nextPatDay(r){
  for(let d=S.day+1;d<S.day+40;d++){const x=dateOf(d);if((r.pat.t==='tail'&&x.getDate()%10===r.pat.v)||(r.pat.t==='wd'&&x.getDay()===r.pat.v))return d}
  return null;
}

/* ---------- 客の取り合い ---------- */
const rivalBase=r=>(10+r.base)*capF(r.size);
function mySegRatio(seg){const ms=machines();return ms.length?ms.filter(m=>segOf(m)===seg).length/ms.length:0}
/* 相手の弱い客層の台をあなたの店が多く置いているほど、相手の客を奪いやすい */
function weakPen(r){const w=bossOf(r).weak;return clamp(1-0.12*(mySegRatio(w)/SEG_SHARE[w]-1),0.85,1.05)}
function rivalAttract(r,info){
  const T=typeOf(r);info=info||dayInfo(S.day);
  let a=(10+r.rep)*capF(r.size);
  if(r.ev)a*=T.evMult;else if(r.evKind==='newm')a*=1.35;else a*=T.plain;
  if(r.evKind==='pension')a*=1.35;
  if(S.day<=r.goUntil)a*=T.goMult;
  if(r.next)a*=1.2;
  return a*weakPen(r);
}
function rivalPayout(r){
  const T=typeOf(r);let p=T.pay+(r.health-50)/600;
  if(r.ev)p+=r.type==='hype'?0.03:0.06;
  if(S.day<=r.goUntil)p+=0.07;
  return clamp(p,0.8,1.05);
}
const rivalState=r=>!r.open?'閉店':r.health>60?'好調':r.health>30?'ふつう':r.health>12?'苦しい':'危ない';
function rivalSay(r){
  const B=bossOf(r);
  if(!r.open)return {ex:'sad',text:B.close[1]};
  if(S.day<=r.goUntil)return {ex:'happy',text:B.go};
  if(r.health<30)return {ex:'sad',text:B.worried[(S.day+r.id)%B.worried.length]};
  return {ex:B.ex,text:B.taunt[(S.day+r.id)%B.taunt.length]};
}

/* ---------- 1日の終わり：経営の体力と評判 ---------- */
function rivalsEndDay(shares,goodEvent){
  D.rivalTalks=D.rivalTalks||[];D.rivalClosures=D.rivalClosures||[];D.rivalHit=[];
  const op=openRivals();
  const totalRef=op.reduce((a,r)=>a+rivalBase(r),0)+36;
  for(const r of op){
    const T=typeOf(r),B=bossOf(r);
    const ref=rivalBase(r)/totalRef,sh=shares[r.id]||0;
    const hit=r.ev&&goodEvent?3:0;   /* 相手のイベント日に「激アツ」をぶつけた */
    let dh=((sh-ref)*22+rnd(-1.2,1.2))*T.tough+(r.health<60?0.25:0)-hit;
    if(r.next&&shares.me>sh)dh-=0.3;
    if(S.day<=r.goUntil)dh=Math.max(dh,0.5);
    r.health=clamp(r.health+dh,-5,100);
    r.rep=clamp(r.rep+(r.base-r.rep)*0.03+rnd(-0.8,0.8)-Math.max(0,(S.rep-r.rep)/60)*T.repSens,5,95);
    if(r.type==='hype'){
      if(S.trust>=60)r.rep=clamp(r.rep-0.12,5,95);
      if(r.ev&&Math.random()<0.4){r.rep=clamp(r.rep-1.2,5,95);if(Math.random()<0.35)news(`${r.name}のイベントが「ガセだった」とSNSで話題に`)}
    }
    if(hit){D.rivalHit.push(r.name);news(`${r.name}のイベント日に激アツをぶつけた！ お客さんがこっちに流れた`,'good')}
    if(r.health<=0&&S.day>20){
      if(r.type==='chain'&&!r.boosted){
        r.boosted=true;r.health=40;r.rep=clamp(r.rep+4,5,95);r.size+=10;
        news(`${r.name}に本部のテコ入れ。台を10台増やして巻き返しを狙っている`,'big');
        D.rivalTalks.push([{who:'boss:'+B.id,ex:'angry',text:`本部からテコ入れが入った。${r.name}は、ここからが本番だ`},{who:'me',text:'（さすが大手…一筋縄ではいかないか）'}]);
        continue;
      }
      closeRival(r);
    }
  }
}
function closeRival(r){
  r.open=false;r.closedDay=S.day;r.ev=false;r.evKind=null;
  S.rivalLog.push({boss:r.boss,shop:r.name,type:r.type,open:r.openDay||1,day:S.day});
  news(`${r.name}が閉店しました。居抜き物件として売りに出ています`,'big');
  S.offers.unshift(inukiFromRival(r));
  D.rivalClosed=r.name;D.rivalClosures.push({boss:r.boss,shop:r.name});
  if(S.story){const C=CHAPTERS[S.story.ch];if(C&&C.boss===r.boss)S.story.bossWin=true}
  for(const d of REG_DEFS){const st=S.regs[d.id];if(st.away&&st.away.rival===r.id){st.away=null;st.loy=clamp(st.loy+5,0,100);news(`${d.name}が戻ってきた`,'good')}}
}

/* ---------- 新しい店の出店 ---------- */
const rivalTarget=()=>rankNo()>=4&&machines().length>=60?4:3;
/* 新しい店の台数：あなたの店の大きさに合わせる（小さすぎず、大きすぎず） */
const rivalSizeFor=(B,rk)=>Math.round(RIVAL_TYPES[B.type].sizeF*Math.max(26+6*rk,machines().length*0.9)*(B.big||1)*rnd(0.88,1.1)/2)*2;
const rivalSizeCap=r=>typeOf(r).sizeF*Math.max(50,machines().length)*(bossOf(r).big||1)*1.15;
function scheduleRival(opt){
  opt=opt||{};
  const rk=rankNo(),busy=new Set([...openRivals().map(r=>r.boss),...S.rivalPlans.map(p=>p.boss)]),beaten=new Set(S.rivalLog.map(l=>l.boss));
  let B=opt.boss?BOSS_BY[opt.boss]:null,revenge=false;
  if(!B){
    const later=b=>S.story&&BOSS_CH[b.id]>S.story.ch;   /* 先の章のボスはまだ出さない */
    let pool=BOSSES.filter(b=>!busy.has(b.id)&&!beaten.has(b.id)&&b.minRank<=rk&&!later(b));
    if(!pool.length){pool=BOSSES.filter(b=>!busy.has(b.id)&&b.minRank<=rk&&!later(b));revenge=true}
    if(!pool.length)return null;
    B=weighted(pool,pool.map(b=>1+(b.type==='chain'?rk*0.4:0)+(b.minRank>=3?1.5:0)));
  }else revenge=beaten.has(B.id);
  const lc=S.rivals.filter(r=>!r.open).sort((a,b)=>b.closedDay-a.closedDay)[0];
  const next=opt.next??(rk>=3&&!S.rivals.some(r=>r.open&&r.next)&&!S.rivalPlans.some(p=>p.next)&&Math.random()<0.35);
  const site=next?'あなたの店の隣':(lc&&S.day-lc.closedDay<40&&!S.rivalPlans.some(p=>p.site===lc.name+'の跡地'))?lc.name+'の跡地':pick(RIVAL_SITES);
  const ann=S.day+(opt.annIn??rndi(4,8)),open=ann+(opt.openIn??rndi(9,14));
  const p={id:S.nid++,boss:B.id,shop:revenge?B.shop+' 新館':B.shop,ann,open,rumor:ann-3,next,site,revenge};
  S.rivalPlans.push(p);return p;
}
function maybePlanRival(){
  if(S.day<6)return;
  const lc=Math.max(0,...S.rivals.filter(r=>!r.open).map(r=>r.closedDay));
  if(lc&&S.day-lc<3)return;
  while(openRivals().length+S.rivalPlans.length<rivalTarget()){if(!scheduleRival())return}
}
function openPlannedRival(p){
  const B=BOSS_BY[p.boss],T=RIVAL_TYPES[B.type],rk=rankNo();
  const size=rivalSizeFor(B,rk);
  const rep=clamp(B.rep+2*(rk-1)+(p.revenge?5:0),20,85);
  const r=newRival({boss:B.id,shop:p.shop,rep,size,next:p.next,revenge:p.revenge,health:rnd(80,95)});
  r.goUntil=S.day+T.goDays-1;
  S.rivals.push(r);
  const closed=S.rivals.filter(x=>!x.open).sort((a,b)=>a.closedDay-b.closedDay);
  if(closed.length>6){const old=new Set(closed.slice(0,closed.length-6));S.rivals=S.rivals.filter(x=>!old.has(x))}
  return r;
}
const visiblePlans=()=>S.rivalPlans.filter(p=>S.day>=p.ann).sort((a,b)=>a.open-b.open);
const rumorPlans=()=>S.rivalPlans.filter(p=>S.day>=p.rumor&&S.day<p.ann);

/* ---------- 朝の出来事（出店・オープン・引き抜き） ---------- */
function rivalsDayStart(R){
  R.talks=R.talks||[];
  const closeM=(R.rivalClosures||[]).map(c=>{
    const B=BOSS_BY[c.boss];
    return {kind:'rivalClose',good:true,title:'ライバル閉店！',sub:`${c.shop}が閉店しました`,talk:[{who:'narr',text:`${c.shop}の看板が下ろされた。店長の${B.name}が、最後のあいさつに来た…`},{who:'boss:'+B.id,ex:'sad',text:B.close[0]},{who:'boss:'+B.id,ex:B.type==='hype'?'happy':'n',text:B.close[1]},{who:'me',text:pick(ME_REPLY.close)}]};
  });
  R.morning.unshift(...closeM);
  for(const t of R.rivalTalks||[])R.talks.push(t);
  for(const p of [...S.rivalPlans]){
    const B=BOSS_BY[p.boss],T=RIVAL_TYPES[B.type];
    if(S.day===p.rumor)news(`${p.site}で工事が始まった。新しいパチンコ店ができるらしい`);
    if(S.day===p.ann){
      news(`【新店告知】${p.shop}（${T.name}）が${dateStr(p.open)}にグランドオープン。場所は${p.site}`,'big');
      const lines=[{who:'narr',text:`${p.site}に「${p.shop}」がオープンするらしい。店長は${B.title}の${B.name}…`}];
      if(p.revenge)lines.push({who:'boss:'+B.id,ex:'angry',text:'…久しぶりだな。あの時の借りを、返しに来た'});
      B.intro.forEach((t,i)=>lines.push({who:'boss:'+B.id,ex:i?B.ex:'n',text:t}));
      if(p.next)lines.push({who:'boss:'+B.id,ex:'smug',text:'場所は君の店の真隣だ。お客さんは、比べてから選ぶ。楽しみだね'});
      lines.push({who:'me',text:pick(p.next?ME_REPLY.next:ME_REPLY.intro)});
      R.morning.push({kind:'rivalAnn',title:'新店オープン告知！',sub:`${p.shop}（${T.name}）${dateStr(p.open)}${p.next?'・あなたの店の隣！':''}`,talk:lines});
    }
    if(S.day>=p.open){
      const r=openPlannedRival(p);S.rivalPlans=S.rivalPlans.filter(x=>x!==p);
      news(`${r.name}がグランドオープン！ ${T.goDays}日間はお客さんを大きく取られそう`,'big');
      R.morning.push({kind:'rivalOpen',title:'ライバル店オープン！',sub:`${r.name}（${T.goDays}日間のオープン期間）`,talk:[{who:'boss:'+B.id,ex:'happy',text:B.go}]});
    }
  }
  planRivals();
  maybePlanRival();
  rivalActions(R);
}
function rivalActions(R){
  /* 常連さんが戻ってくる */
  for(const d of REG_DEFS){
    const st=S.regs[d.id];
    if(st.away&&S.day>st.away.until){news(`${d.name}が${st.away.name}から戻ってきた`,'good');st.away=null}
  }
  if(S.day<8||goActive())return;
  const op=openRivals();
  /* 店員の引き抜き */
  if(!S.incidents.length&&S.staff.length>=3){
    for(const r of op){
      const tgt=[...S.staff].sort((a,b)=>(b.lv*2+b.spd+b.srv)-(a.lv*2+a.spd+a.srv))[0];
      if(r.health<35||!tgt||Math.random()>=typeOf(r).poach*((PERS[tgt.pers]||PERS.majime).poach)*(1-0.2*sk('jinbo')))continue;
      if(tgt){S.incidents.push({id:S.nid++,kind:'poach',rival:r.id,staff:tgt.id,day:S.day});break}
    }
  }
  /* 常連さんの引き抜き（相手がイベント・新台・オープンの日） */
  for(const r of op){
    if(!(r.ev||r.evKind==='newm'||r.evKind==='go')||Math.random()>0.06)continue;
    const cand=REG_DEFS.filter(d=>{const st=S.regs[d.id];return st.met&&st.st!=='gone'&&!st.away&&st.loy<60});
    if(!cand.length)break;
    const d=pick(cand),st=S.regs[d.id];
    st.away={rival:r.id,name:r.name,until:S.day+rndi(5,9)};st.loy=clamp(st.loy-8,0,100);
    news(`${d.name}が${r.name}に通い始めたらしい…`,'bad');
    R.morning.push({kind:'regAway',title:'常連さんが浮気…',sub:`${d.name}が${r.name}へ`,talk:[{who:'reg:'+d.id,ex:'n',text:`${r.name}、${RIV_EV_LABEL[r.evKind]||'イベント'}だっていうから、しばらくあっちで打ってみるよ`},{who:'me',text:'（また戻ってきてもらえるように、店を磨かないと…）'}]});
    break;
  }
  /* 店長のひとこと・大手の増台 */
  for(const r of op){
    const B=bossOf(r),T=typeOf(r);
    if(Math.random()<0.04){const s=rivalSay(r);news(`${B.name}（${r.name}）「${s.text}」`)}
    if(r.type==='chain'&&S.day>30&&r.health>75&&r.size+10<=rivalSizeCap(r)&&Math.random()<0.008){const n=rndi(1,2)*10;r.size+=n;news(`${r.name}が${n}台増台。勢いがある`,'bad')}
  }
}

/* ---------- 偵察 ---------- */
function scoutSnapshot(r,lv){
  const fc=forecast(),noise=lv>=2?0.01:0.03;
  return {day:S.day,until:S.day+7,lv,pay:clamp(rivalPayout(r)+rnd(-noise,noise),0.75,1.08),vis:Math.round(LOCS[G.loc].town*fc.info.mult*(fc.shares[r.id]||0)),
    nextEv:nextPatDay(r),newm:r.type==='chain'?r.newmDay:null,health:Math.round(r.health)};
}
const scoutOn=r=>r.scout&&S.day<=r.scout.until;
function scoutByStaff(r){
  const cost=sk('data')>=3?0:SCOUT_COST;
  if(S.money<cost)return {err:'お金が足りません'};
  if(r.scout&&r.scout.day===S.day&&(sk('data')<3||r.scout.n>=2))return {err:'今日はもうこの店を偵察しました'};
  const s=pick(S.staff);if(!s)return {err:'偵察に行ける店員がいません'};
  S.money-=cost;
  const lv=scoutOn(r)?Math.max(1,r.scout.lv):1,n=r.scout&&r.scout.day===S.day?(r.scout.n||1)+1:1;
  r.scout=scoutSnapshot(r,lv);r.scout.n=n;
  const sc=r.scout,pct=Math.round(sc.pay*100);
  return {lines:[
    {who:'staff:'+s.id,ex:'happy',text:`${r.name}、見てきました！ 還元率はだいたい${pct}%くらいだと思います`},
    {who:'staff:'+s.id,ex:sc.vis>120?'shock':'n',text:`お客さんは1日${sc.vis}人くらい。${sc.nextEv?`次のイベントは${dateStr(sc.nextEv)}みたいです`:'イベントの予定はわかりませんでした'}${sc.newm?`。新台入替は${dateStr(sc.newm)}ごろ`:''}`},
    {who:'staff:'+s.id,ex:r.health<30?'smug':'n',text:r.health<30?'店員さんたち、元気がなかったです。経営、苦しいのかも':r.health>70?'すごく活気がありました。手ごわいです…':'まあまあの入りでした'},
  ]};
}
function scoutBySelf(r){
  if(S.selfScout===S.day)return {err:'自分で打ちに行けるのは1日1回です'};
  S.selfScout=S.day;
  r.scout=scoutSnapshot(r,2);
  const B=bossOf(r),sc=r.scout;
  const res=Math.round(((sc.pay-1)*40000+rnd(-30000,30000))/1000)*1000;
  S.money+=res;
  return {res,lines:[
    {who:'narr',text:`${r.name}で実際に打ってみた。収支は${sgn(res)}。`},
    {who:'boss:'+B.id,ex:B.ex,text:pick(B.scout)},

const raiseCost=s=>Math.round(s.wage*0.3/100)*100;
function resolvePoach(inc,choice){
  S.incidents=S.incidents.filter(x=>x.id!==inc.id);
  const s=S.staff.find(x=>x.id===inc.staff),r=S.rivals.find(x=>x.id===inc.rival);
  if(!s)return null;
  let stay=false;
  if(choice==='raise'){s.wage+=raiseCost(s);stay=true}
  else if(choice==='talk')stay=Math.random()<poachOdds(s);

function playerAttract(evMult){
  const ms=machines(),n=ms.length;

  const lineup=0.8+0.4*Math.min(1,avgPop/80);
  const decorF=0.9+0.2*decorRate();
  const regF=1+0.02*Object.values(S.regs).filter(r=>r.loy>=70&&r.st!=='gone').length;
  let a=(10+S.rep)*capF(n)*lineup*decorF*regF*evMult*(conceptOn()?1.04:1);
  if(S.mod&&S.day<=S.mod.until)a*=S.mod.mult;
  return a;
}
function segFactor(){const p=new Set(machines().map(segOf));return SEGS.reduce((a,s)=>a+(p.has(s)?SEG_SHARE[s]:0),0)}
function forecast(){
  const evm=eventMultToday(),aP=playerAttract(evm);
  const rs=openRivals().map(r=>({r,a:rivalAttract(r)}));
  const tot=aP+rs.reduce((a,x)=>a+x.a,0);
  const shares={me:aP/tot};rs.forEach(x=>shares[x.r.id]=x.a/tot);
  const info=dayInfo(S.day);
  const expected=LOCS[G.loc].town*info.mult*WEATHER[S.weather.today].mult*shares.me*(0.5+0.5*segFactor())*regVisitF(info);
  return {expected,shares,info,evm};
}
function pickSeg(info){
  const present=new Set(machines().map(segOf));
  const w=SEGS.map(s=>present.has(s)?SEG_SHARE[s]*(s.endsWith('lo')?info.elder*LOCS[G.loc].elder:info.hi)*conceptSeg(s):0);
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<4;i++){r-=w[i];if(r<=0)return SEGS[i]}
  return SEGS.find(s=>present.has(s));
}

function computeSmokeMaps(){

    if(near&&!cleaners.some(c=>Math.max(Math.abs(c.x-x),Math.abs(c.y-y))<=2))D.nearSmoke.add(key(x,y));
  }

  for(const d of G.doors)if(d.type==='smokeroom'){const f=frontOf(d);D.smokeSpots.set(key(f.x,f.y),{t:'room',d})}
  for(let y=0;y<G.H;y++)for(let x=0;x<G.W;x++){const k=key(x,y);if(zoneAt(x,y)&&!occ.has(k)&&!seatMap.has(k)&&!frontMap.has(k)&&!D.smokeSpots.has(k))D.smokeSpots.set(k,{t:'zone'})}

/* ---------- 経路 ---------- */
function bfsTo(a,goal){
  const W=G.W,H=G.H,sx=clamp(Math.round(a.x),0,W-1),sy=clamp(Math.round(a.y),0,H-1);
  const prev=new Int32Array(W*H).fill(-2),s=sy*W+sx,q=[s];prev[s]=-1;let h=0;
  while(h<q.length){
    const cur=q[h++],cx=cur%W,cy=(cur/W)|0;
    if(goal(cx,cy)){const path=[];let k=cur;while(k!==s){path.push({x:k%W,y:(k/W)|0});k=prev[k]}return path.reverse()}
    for(const[dx,dy]of DIRS){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const nk=ny*W+nx;if(prev[nk]!==-2||occ.has(nk))continue;prev[nk]=cur;q.push(nk)}
  }
  return null;
}
function moveAlong(a,dt){
  let dist=a.speed*dt;
  while(a.path.length&&dist>0){const p=a.path[0],dx=p.x-a.x,dy=p.y-a.y,l=Math.hypot(dx,dy);
    if(l<=dist){a.x=p.x;a.y=p.y;dist-=l;a.path.shift()}else{a.x+=dx/l*dist;a.y+=dy/l*dist;dist=0}}
  return a.path.length===0;
}
const adjGoal=(x0,y0)=>(x,y)=>Math.abs(x-x0)+Math.abs(y-y0)===1;

function addWhy(c,k,d){c.sat+=d;c.why[k]=(c.why[k]||0)+d}
function spawnCust(seg,opt={}){

    nextSmoke:smoker?rnd(40,80):1e9,full:false,hidden:false,born:clock};
  custs.push(c);D.visitors++;D.seg[seg]=(D.seg[seg]||0)+1;if(hunter)D.hunters++;if(elder)D.elders++;if(smoker)D.smokers++;
  return c;
}
function chooseMachine(c){
  const cand=machines().filter(m=>!m.res&&!m.broken&&!m.today.done&&segOf(m)===c.seg);
  if(!cand.length)return null;
  const ws=cand.map(m=>{
    const s=seatOf(m),z=zoneAt(s.x,s.y);let w;
    if(c.hunter){
      if(c.k==='s')w=5+(todayTargets.has(m)?40+60*S.trust/100:0)+(m.yest&&m.yest.out>m.yest.coin?(D.kiosk?40:15):0)+popEff(m)*0.1;
      else w=4+Math.pow(m.nail+3,2)*6+(todayTargets.has(m)?30:0)+popEff(m)*0.1;
      w=w*w;
    }else{
      w=popEff(m)*(todayTargets.has(m)?1.3:1)*rnd(0.6,1.4);
      if(c.k==='p')w*=1+0.15*m.nail;
    }
    if(c.smoker)w*=z?1.8:0.75;else w*=z?0.12:(D.nearSmoke.has(key(s.x,s.y))?0.7:1);
    if(islandMixed(m))w*=0.75;
    if(trash.has(key(s.x,s.y)))w*=0.7;
    return Math.max(0.01,w);
  });
  let r=Math.random()*ws.reduce((a,b)=>a+b,0);
  for(let i=0;i<cand.length;i++){r-=ws[i];if(r<=0)return cand[i]}

}
function seek(c){

  const s=seatOf(m),path=bfsTo(c,(x,y)=>x===s.x&&y===s.y);

function onSit(c){
  const m=c.m,s=seatOf(m),z=zoneAt(s.x,s.y),k=key(s.x,s.y);

}
function callStaff(c,type){c.st='call';c.callAt=clock;c.callType=type;c.m.call=true;c.assigned=false;D.calls.push(c);c.emote={ch:'!',t:6}}
function play(c,dt){
  const m=c.m,md=MB[m.type],cin=c.coin*dt;
  if(c.goto){gotoStep(c,dt);return}
  c.inv+=cin;c.t+=dt;S.money+=cin;D.coin+=cin;m.today.coin+=cin;m.today.mins+=dt;m.today.g=(m.today.g||0)+dt*(md.k==='s'?S_GPM:P_SPM*machR(m)/NAIL_R[2]);
  const hit=hitMean(m)*c.sc,p=c.coin*machR(m)/hit;
  if(Math.random()<1-Math.exp(-p*dt)){
    let pay=Math.max(100,Math.round(hit*payMult(md)/100)*100);
    /* コンプリート：1台の差玉が上限に届いたら、そこで払い出しを止めて今日は終了 */
    const cap=COMPLETE[md.k]*unitYen(m),diff=m.today.out-m.today.coin,done=diff+pay>=cap;
    if(done)pay=Math.max(0,Math.round(cap-diff));
    const ex=md.k==='s'?SLOT_EXCH:1;
    c.won+=pay;S.money-=pay*ex;D.out+=pay;D.exch+=pay*(1-ex);m.today.out+=pay;m.today.hits++;
    m.flash=1.6;c.emote={ch:'！',t:10};floatAt(m.x,m.y,'大当り','#ff2d55');sfx('hit');tweet(c,'hit',0.12,1);
    if(done){completeMachine(m,c);return}
    if(Math.random()<0.1){callStaff(c,'box');return}
  }
  if(Math.random()<dt/450){callStaff(c,'jam');return}
  if(Math.random()<dt/1800*(1+Math.min(2,Math.max(0,S.day-m.installDay)/90))){
    m.broken=true;m.flash=0;D.broken++;addWhy(c,'broken',-0.15);tweet(c,'broken',0.6,2);floatAt(m.x,m.y,'故障','#64748b');sfx('bad');quit(c);return;
  }
  const net=c.won-c.inv;
  if(c.smoker&&!c.zone&&c.t>=c.nextSmoke){startSmoke(c,true);return}

    return;
  }
  const path=bfsTo(c,(x,y)=>D.smokeSpots.has(key(x,y)));
  if(!path){addWhy(c,'noSmoke',-0.15);if(mid){c.nextSmoke=1e9}else nextPlan(c);return}
  if(mid){c.m.brk=true;c.m.occ=null}
  c.after=mid?'return':'plan';c.path=path;c.st='toSmoke';
}
function arriveSmoke(c){
  const spot=D.smokeSpots.get(key(Math.round(c.x),Math.round(c.y)));
  if(spot&&spot.t==='room'){c.door=spot.d;c.roomDur=5;tryEnter(c);return}
  c.st='smoking';c.wait=5;c.emote={ch:'~',t:5};
}
function afterRoomOrSmoke(c){
  if(c.after==='return'){
    c.nextSmoke=c.t+rnd(50,90);
    const s=seatOf(c.m),p=bfsTo(c,(x,y)=>x===s.x&&y===s.y);
    if(p){c.path=p;c.st='return'}else{c.m.brk=false;c.m.res=null;c.m=null;goExit(c)}
  }else nextPlan(c);
}
function goRoom(c,door,dur,after){
  const f=frontOf(door),p=bfsTo(c,(x,y)=>x===f.x&&y===f.y);
  if(!p)return false;
  c.path=p;c.st='toRoom';c.door=door;c.roomDur=dur;c.after=after;return true;
}
function tryEnter(c){
  const r=rooms.get(c.door.id);
  if(r&&r.inside<WB[c.door.type].cap){r.inside++;c.path=[insideOf(c.door)];c.st='intoRoom';c.door.anim=clock}
  else{c.st='roomQ';c.qStart=clock}
}
function quit(c){
  const m=c.m;if(m){m.occ=null;m.res=null;m.call=false;m.brk=false;
    const s=seatOf(m);if(Math.random()<0.22*WEATHER[S.weather.today].dirt&&!trash.has(key(s.x,s.y)))trash.set(key(s.x,s.y),{x:s.x,y:s.y});}
  if(c.goto){m&&(m.occ=null,m.res=null);c.m=null;if(!c.caught){D.gotoEsc+=c.loot;news(`ゴト師に${man(c.loot)}抜かれた…（防犯カメラで防げます）`,'bad')}goExit(c);return}
  const net=c.won-c.inv;c.net=net;
  c.sat+=0.08;
  if(net>=30000*c.sc)tweet(c,'bigwin',0.45,2,{v:man(net)});else if(net<-15000*c.sc)tweet(c,'lose',0.25,1,{v:man(-net)});
  if(net>0)addWhy(c,'win',0.4+Math.min(0.2,net/(150000*c.sc)));else addWhy(c,'lose',-Math.min(0.35,-net/(80000*c.sc)));
  if(net>=50000*c.sc&&m)D.bigWins.push({no:m.no,k:kindOf(m),lv:kindOf(m)==='s'?m.set:m.nail,net,seg:c.seg});
  c.emote={ch:net>0?'♪':'…',t:18};c.m=null;
  const plan=[];
  if(clock<LAST){
    if(Math.random()<0.25)plan.push('toilet');
    if(c.smoker&&!c.zone&&Math.random()<0.5)plan.push('smoke');
    if(Math.random()<0.35)plan.push('drink');
    if(net<-20000*c.sc&&Math.random()<0.4)plan.push('rest');
  }
  if(net>0)plan.push('counter');
  c.plan=plan;nextPlan(c);
}
function nearestDoorOfType(c,type){
  const ds=G.doors.filter(d=>d.type===type);if(!ds.length)return null;
  return ds.map(d=>({d,f:frontOf(d)})).sort((a,b)=>(Math.abs(a.f.x-c.x)+Math.abs(a.f.y-c.y))-(Math.abs(b.f.x-c.x)+Math.abs(b.f.y-c.y)))[0].d;
}
function nextPlan(c){
  while(c.plan.length){
    const a=c.plan.shift();
    if(clock>=LAST&&a!=='counter')continue;
    if(a==='toilet'){const d=nearestDoorOfType(c,'toilet');if(d&&goRoom(c,d,8,'plan'))return;addWhy(c,'noToilet',-0.2);tweet(c,'noToilet',0.3,1);continue}
    if(a==='smoke'){startSmoke(c,false);if(c.st==='toSmoke')return;continue}
    if(a==='counter'){
      const open=counters.filter(k=>k.staff);
      if(!open.length){addWhy(c,'noCounter',-0.5);c.emote={ch:'×',t:15};continue}
      const set=new Set(open.map(k=>key(k.o.x,k.o.y)));
      const p=bfsTo(c,(x,y)=>DIRS.some(([dx,dy])=>inB(x+dx,y+dy)&&set.has(key(x+dx,y+dy))));
      if(!p){addWhy(c,'noCounter',-0.5);continue}
      c.path=p;c.cur={a};c.st='walk';return;
    }
    const t=a==='drink'?'vending':'bench';
    const targets=G.objs.filter(o=>o.kind==='d'&&o.type===t);
    if(!targets.length)continue;
    const set=new Set(targets.map(o=>key(o.x,o.y)));
    const p=bfsTo(c,(x,y)=>DIRS.some(([dx,dy])=>inB(x+dx,y+dy)&&set.has(key(x+dx,y+dy))));
    if(!p)continue;
    c.path=p;c.cur={a};c.st='walk';return;
  }
  goExit(c);
}
function arriveAmenity(c){
  const a=c.cur.a;
  if(a==='counter'){
    const cx=Math.round(c.x),cy=Math.round(c.y);
    const k=counters.find(k=>k.staff&&Math.abs(k.o.x-cx)+Math.abs(k.o.y-cy)===1)||counters.find(k=>k.staff);
    if(!k){addWhy(c,'noCounter',-0.5);nextPlan(c);return}
    const dur=Math.max(1.2,(4-staffSrv(k.staff.s)*0.5)*(k.help?0.75:1));k.staff.done++;
    const start=Math.max(clock,k.busyUntil);k.busyUntil=start+dur;
    if(start-clock>6)addWhy(c,'counterWait',-0.1);
    c.wait=k.busyUntil-clock;c.st='wait';return;
  }
  c.wait=a==='drink'?3:12;c.st='wait';
}
function applyAmenity(c){
  const a=c.cur&&c.cur.a;
  if(a==='drink'){S.money+=150;D.drink+=150;c.sat+=0.03;floatAt(c.x,c.y,'+¥150','#16a34a')}
  else if(a==='rest'){addWhy(c,'rest',buffOn('tea')?0.12:0.06);c.emote={ch:'♨',t:8}}
  c.cur=null;
}
function goExit(c){
  const p=bfsTo(c,(x,y)=>isEntrance(x,y));
  if(p)c.path=p;else{const d=doorPos();c.x=d.x;c.y=d.y;c.path=[]}
  c.st='exit';
}
function finish(c){
  const i=custs.indexOf(c);if(i>=0)custs.splice(i,1);
  if(c.m){c.m.occ=null;c.m.res=null;c.m.call=false;c.m.brk=false}
  if(c.full||c.goto)return;
  const dirt=trash.size/Math.max(10,machines().length);
  if(dirt>0.2)addWhy(c,'dirty',-Math.min(0.15,dirt*0.2));
  const dr=decorRate();
  if(dr>0.5){addWhy(c,'decorGood',(dr-0.5)*0.4);tweet(c,'decor',0.05,0)}else if(dr<0.2)addWhy(c,'decorBad',(dr-0.2)*0.5);
  if(skSat())c.sat+=skSat();
  if(buffOn('greet')&&c.born<720)addWhy(c,'greet',0.04);
  D.satSum+=c.sat;D.satN++;
  for(const[k,v]of Object.entries(c.why)){const r=D.reasons[k]||(D.reasons[k]={n:0,sum:0});r.n++;r.sum+=v}
  if(c.reg){
    const st=S.regs[c.reg];st.visited=true;st.daySat=c.sat;
    let top=null,tv=0;for(const[k,v]of Object.entries(c.why))if(Math.abs(v)>tv){tv=Math.abs(v);top=k}
    st.top=top;
  }
}
function stepCust(c,dt){
  if(c.emote){c.emote.t-=dt;if(c.emote.t<=0)c.emote=null}
  switch(c.st){
    case 'enter':if(moveAlong(c,dt))seek(c);break;
    case 'toSeat':if(moveAlong(c,dt))onSit(c);break;
    case 'play':play(c,dt);break;
    case 'call':
      if(clock-c.callAt>14&&!c.twW){c.twW=1;tweet(c,'wait',0.5,2)}
      if(clock-c.callAt>45){addWhy(c,'waitStaff',-0.25);c.served=true;quit(c)}
      else if(clock>=LAST){quit(c)}
      break;
    case 'toSmoke':if(moveAlong(c,dt))arriveSmoke(c);break;
    case 'smoking':c.wait-=dt;if(c.wait<=0)afterRoomOrSmoke(c);break;
    case 'return':if(moveAlong(c,dt)){c.m.brk=false;c.m.occ=c.id;c.st='play'}break;
    case 'toRoom':if(moveAlong(c,dt))tryEnter(c);break;
    case 'roomQ':{
      const r=rooms.get(c.door.id);
      if(r&&r.inside<WB[c.door.type].cap){r.inside++;c.path=[insideOf(c.door)];c.st='intoRoom';c.door.anim=clock}
      else if(clock-c.qStart>6&&!c.qPen){c.qPen=true;addWhy(c,'toiletWait',buffOn('toilet')?-0.05:-0.12)}
      break;}
    case 'intoRoom':if(moveAlong(c,dt)){c.hidden=true;c.st='inRoom';c.wait=c.roomDur}break;
    case 'inRoom':c.wait-=dt;if(c.wait<=0){c.hidden=false;const r=rooms.get(c.door.id);if(r)r.inside--;c.door.anim=clock;c.path=[frontOf(c.door)];c.st='outRoom'}break;
    case 'outRoom':if(moveAlong(c,dt))afterRoomOrSmoke(c);break;
    case 'walk':if(moveAlong(c,dt))arriveAmenity(c);break;
    case 'wait':c.wait-=dt;if(c.wait<=0){applyAmenity(c);nextPlan(c)}break;
    case 'exit':if(moveAlong(c,dt)){c.path=[{x:c.x,y:G.H+0.9}];c.st='out'}break;
    case 'out':if(moveAlong(c,dt))finish(c);break;
  }
}

/* ---------- 店員 ---------- */
function freeAdj(o){
  const opts=DIRS.map(([dx,dy])=>({x:o.x+dx,y:o.y+dy})).filter(p=>inB(p.x,p.y)&&!occ.has(key(p.x,p.y))&&!isEntrance(p.x,p.y));
  return opts.find(p=>!seatMap.has(key(p.x,p.y))&&!frontMap.has(key(p.x,p.y)))||opts[0]||null;
}
function initStaffAgents(){
  const d=doorPos();
  staffA=S.staff.map((s,i)=>({s,role:s.role,x:clamp(d.x+((i%5)-2),0,G.W-1),y:Math.max(0,d.y-1-Math.floor(i/5)),path:[],st:'idle',task:null,t:0,idleT:rnd(2,15),speed:staffSpeed(s),ph:Math.random()*10,done:0,absentUntil:s.lateToday&&s.role!=='counter'?780:0,hidden:!!(s.lateToday&&s.role!=='counter')}));
  for(const a of staffA){const k=occ.get(key(a.x,a.y));if(k){a.x=d.x;a.y=d.y}}
  let ci=0;
  for(const a of staffA.filter(a=>a.role==='counter')){
    if(ci<counters.length){const k=counters[ci++];k.staff=a;const h=freeAdj(k.o);if(h){a.x=h.x;a.y=h.y}a.st='station';a.home=h}
    else if(counters.length){counters[(ci++)%counters.length].help++;a.st='station'}
  }
}
function stepStaff(a,dt){
  if(a.absentUntil){if(clock<a.absentUntil)return;a.absentUntil=0;a.hidden=false;const d=doorPos();a.x=d.x;a.y=d.y;a.path=[];a.st='idle'}
  if(a.role==='counter'){if(a.path.length)moveAlong(a,dt);return}
  if(a.st==='go'){if(moveAlong(a,dt)){
    if(a.role==='hall'&&a.fix){if(a.fix.broken){a.st='work';a.t=Math.max(3,7-staffSrv(a.s)*0.6)*(a.s.pers==='shokunin'?0.7:1)}else{a.fix.fixing=false;a.fix=null;a.st='idle'}}
    else if(a.role==='hall'){if(a.task&&a.task.st==='call'){a.st='work';a.t=Math.max(1,3-staffSrv(a.s)*0.35)*(1-0.1*sk('omote'))}else{a.st='idle';a.task=null}}
    else{if(a.task&&trash.has(a.task)){a.st='work';a.t=1.5}else{a.st='idle';a.task=null}}
  }return}
  if(a.st==='work'){a.t-=dt;if(a.t<=0){
    a.done++;
    if(a.role==='hall'&&a.fix){a.fix.broken=false;a.fix.fixing=false;floatAt(a.fix.x,a.fix.y,'修理OK','#16a34a');a.fix=null}
    else if(a.role==='hall'&&a.task&&a.task.st==='call'){
      const c=a.task,w=clock-c.callAt;
      if(w<8)addWhy(c,'quickStaff',0.04);else if(w<20)addWhy(c,'slowStaff',-0.04);else if(w<35)addWhy(c,'waitStaff',-0.1);else addWhy(c,'waitStaff',-0.18);
      c.st='play';c.m.call=false;c.emote=null;
    }else if(a.role==='clean'&&a.task)trash.delete(a.task);
    a.st='idle';a.task=null;
  }return}
  // idle
  if(a.role==='hall'){
    const pend=D.calls.filter(c=>c.st==='call'&&!c.assigned);
    if(pend.length){
      pend.sort((p,q)=>(Math.abs(p.x-a.x)+Math.abs(p.y-a.y))-(Math.abs(q.x-a.x)+Math.abs(q.y-a.y)));
      const c=pend[0],s=seatOf(c.m),p=bfsTo(a,(x,y)=>Math.abs(x-s.x)+Math.abs(y-s.y)<=1);
      if(p){c.assigned=true;a.task=c;a.path=p;a.st='go';return}
    }
    const br=machines().find(m=>m.broken&&!m.fixing);
    if(br){const p=bfsTo(a,(x,y)=>Math.abs(x-br.x)+Math.abs(y-br.y)===1);if(p){br.fixing=true;a.fix=br;a.path=p;a.st='go';return}}
    const g=custs.find(c=>c.goto&&c.st==='play'&&!c.caught&&Math.abs(c.x-a.x)+Math.abs(c.y-a.y)<=3);
    if(g&&Math.random()<0.05*dt*(1+staffSrv(a.s)*0.2)*skGoto())catchGoto(g,'staff');
  }else if(a.role==='clean'&&trash.size){
    const taken=new Set(staffA.filter(b=>b.role==='clean'&&b.task).map(b=>b.task));
    const p=bfsTo(a,(x,y)=>{const k=key(x,y);return trash.has(k)&&!taken.has(k)});
    if(p){const end=p.length?p[p.length-1]:{x:Math.round(a.x),y:Math.round(a.y)};a.task=key(end.x,end.y);a.path=p;a.st='go';return}
  }
  if(a.path.length){moveAlong(a,dt);return}
  a.idleT-=dt;
  if(a.idleT<=0){
    a.idleT=rnd(12,35);
    const ms=machines();if(!ms.length)return;
    const s=seatOf(pick(ms)),p=bfsTo(a,(x,y)=>Math.abs(x-s.x)+Math.abs(y-s.y)===1&&!seatMap.has(key(x,y)));
    if(p)a.path=p;
  }
}

/* ---------- 1フレームの更新 ---------- */
function update(dt){
  clock+=dt;
  /* 1時間ごとの稼働（毎時30分に数える） */
  const hr=Math.floor((clock-30)/60);
  if(hr!==D.lastHr&&clock>=OPEN+30&&clock<LAST){D.lastHr=hr;const pl=custs.filter(c=>c.m&&(c.st==='play'||c.st==='call')&&!c.goto);D.hourly.push({h:hr,p:pl.filter(c=>c.k==='p').length,s:pl.filter(c=>c.k==='s').length})}
  if(clock<LAST-20){
    if(queueLeft>0){queueAcc+=dt;while(queueAcc>=0.5&&queueLeft>0){queueAcc-=0.5;queueLeft--;const c=spawnCust(pickSeg(todayInfo),{hunter:Math.random()<0.75});tweet(c,'queue',0.06,1)}}
    while(regQueue.length&&regQueue[0].t<=clock){
      const {def}=regQueue.shift();
      spawnCust(def.seg,{reg:def.id,hunter:!!def.hunter,smoker:!!def.smoker,elder:!!def.elder,look:def.look,rich:def.rich});
      D.regsVisited.push(def.id);
    }
    if(D.gotoAt&&clock>=D.gotoAt){D.gotoAt=null;spawnGoto()}
    const h=clock/60,shape=h<11?1.4:h<13?0.8:h<17?0.9:h<20?1.35:0.7;
    spawnAcc+=lambdaBase*shape*dt;
    while(spawnAcc>=1){spawnAcc-=1;const c=spawnCust(pickSeg(todayInfo));if(S.weather.today==='rain')tweet(c,'rain',0.05,0);else tweet(c,'enter',0.02,0)}
  }
  for(const c of custs.slice())stepCust(c,dt);
  for(const a of staffA)stepStaff(a,dt);
  if(D.calls.length>40)D.calls=D.calls.filter(c=>c.st==='call');
  if(clock>=CLOSE&&custs.length===0)closeDay();
  else if(clock>=CLOSE+40){custs.slice().forEach(finish);closeDay()}
}

/* ---------- 閉店・日報 ---------- */
function closeDay(){
  if(S.phase!=='open')return;
  const ms=machines(),rent=rentOf(),wages=wagesTotal(),power=2500*ms.length;
  const brokenLeft=ms.filter(m=>m.broken).length,repairs=brokenLeft*15000,interest=Math.round(S.loan*LOAN_RATE*skRate()),goLab=goLabel(S.go);
  ms.forEach(m=>{m.broken=false;m.fixing=false});
  const gross=D.coin-D.out+D.exch,net=gross+D.drink-rent-wages-power-D.ad-repairs-interest;
  S.money-=rent+wages+power+repairs+interest;
  const rep0=S.rep,trust0=S.trust,avgSat=D.satN?D.satSum/D.satN:0;
  const payR=D.coin?D.out/D.coin:0.93,feel=clamp((payR-0.955)*30*(D.kiosk?1.5:1),-3.5,3.5);
  S.rep=clamp(S.rep+clamp(avgSat*10,-5,5)*(D.isGo?1.5:1)+feel+(30-S.rep)*0.02,0,100);
  let evr=null,gor=null,goodEvent=false;
  if(D.isGo){
    const dash=avgOf(ms.map(dashi)),satN=clamp((avgSat+0.3)/0.7,0,1),score=0.6*dash+0.4*satN;
    S.go.scores.push(score);
    gor={type:D.goType,idx:D.goIdx,len:S.go.len,score,dash,satN,mark:score>=0.7?'◎':score>=0.55?'○':score>=0.4?'△':'×'};
    if(S.go.scores.length>=S.go.len){
      const fin=avgOf(S.go.scores),[j,cls]=goJudge(fin),h=D.goType==='renewal'?0.5:D.goType==='anniv'?0.8:1;
      const eff={'大成功':[20,12,1.25,21],'成功':[8,5,1,0],'いまいち':[-15,-8,0.85,14],'大失敗':[-35,-18,0.65,45]}[j];
      S.trust=clamp(S.trust+eff[0]*h,0,100);S.rep=clamp(S.rep+eff[1]*h,0,100);
      if(eff[3])S.mod={mult:D.goType==='grand'?eff[2]:1+(eff[2]-1)*(D.goType==='anniv'?0.8:0.6),until:S.day+eff[3],label:j==='大成功'?`${goLab}大成功の評判`:`${goLab}での悪い評判`};
      gor.final={score:fin,judge:j,cls,trust:eff[0]*h,rep:eff[1]*h,mod:eff[3]?S.mod:null};
      S.goLog.push({day:S.day,type:D.goType,judge:j});
      goodEvent=cls==='good';
      S.go=null;
    }
  }else if(D.evType!=='none'){
    const tg=eventTargets({type:D.evType,target:S.event.target}),avg=avgOf(tg.map(dashi));
    const media=D.evType==='media',tube=media&&D.evTarget==='tube',season=D.evType==='season';
    const [j,cls]=judgeOf(avg,D.evType==='newm'?0.15:media?0.12:season?0.1:0);
    const mul=tube?1.6:media?1.2:season?1.3:1;
    if(season)news(cls==='good'?`${D.evLabel}は大盛況！「この店は出す」と評判に`:cls==='bad'?`${D.evLabel}なのに出ないと、お客さんががっかりしている…`:`${D.evLabel}はまずまずの入りだった`,cls==='good'?'good':cls==='bad'?'bad':'');
    const dT=Math.round({激アツ:10,まずまず:4,微妙:-4,ガセ:-12}[j]*mul);
    S.trust=clamp(S.trust+dT,0,100);if(j==='激アツ')S.rep+=2*mul;if(j==='ガセ')S.rep-=3*mul;
    if(media)news(tube?(cls==='good'?'配信動画が大バズリ！「神ホール」と紹介された':cls==='bad'?'配信で「ぼったくり店」と紹介されてしまった…':'配信で「ふつうの店」と紹介された'):(cls==='good'?'雑誌に「出る店」として載った！':cls==='bad'?'雑誌で「出さない店」と書かれた…':'雑誌に小さく載った'),cls==='good'?'good':cls==='bad'?'bad':'');
    evr={label:D.evLabel,n:tg.length,avg,judge:j,cls,dT,media:media||season};goodEvent=cls==='good';
  }
  // 常連
  const regVoices=[];
  for(const def of REG_DEFS){
    const st=S.regs[def.id];if(!st.planned)continue;
    if(st.visited){
      st.loy=clamp(st.loy+clamp(st.daySat*30,-15,12)+1,0,100);st.visits++;st.met=true;
      const lines=REG_LINES[st.top]||REG_LINES[st.daySat>=0?'win':'lose'];
      st.say=pick(lines);regVoices.push({name:def.name,say:st.say,good:st.daySat>=0});
      if(def.id==='taka'&&(D.isGo||D.evType!=='none')){
        const good=(gor&&gor.score>=0.55)||(evr&&evr.cls==='good'),bad=(gor&&gor.score<0.4)||(evr&&evr.cls==='bad');
        if(good){S.trust=clamp(S.trust+3,0,100);news('タカシがSNSで「この店は激アツ」と拡散！','good')}

let twQueue=[],twLast=0;

function tweet(c,kind,prob,prio,vars){
  if(!prefs.tweets||!c||Math.random()>prob)return;
  const list=TW[kind];if(!list)return;
  let text=pick(list);if(vars)for(const k in vars)text=text.replace('{'+k+'}',vars[k]);
  if(!c.handle)c.handle=c.reg?REG_BY[c.reg].name:pick(HANDLES);

  if(twQueue.length>8){twQueue.sort((a,b)=>b.prio-a.prio||b.t-a.t);twQueue.length=6}
}
function tweetTick(now){
  if(!twQueue.length||now-twLast<1300)return;
  twQueue.sort((a,b)=>b.prio-a.prio||b.t-a.t);
  const tw=twQueue.shift();twLast=now;
  if(now-tw.t>9000)return;

function camerasCovering(x,y){
  let n=0;
  for(const d of G.doors)if(d.type==='camera'){const f=frontOf(d);if(Math.max(Math.abs(f.x-x),Math.abs(f.y-y))<=5)n++}
  return n;
}

  const segs=[...new Set(machines().map(segOf))].filter(s=>s.endsWith('hi'));

  const c=spawnCust(pick(segs),{hunter:false,smoker:false,elder:false,look:{shirt:'#1f2937',hair:'#0b0b0b',skin:'#e9c7a5',shades:1}});
  c.goto=true;c.loot=0;c.maxT=rnd(90,160);c.budget=1e9;c.goal=1e9;D.visitors--;
}
function gotoStep(c,dt){
  const m=c.m;
  c.t+=dt;m.today.mins+=dt;
  const loss=1000*dt*skGotoLoss();S.money-=loss;D.goto+=loss;c.loot+=loss;m.today.out+=loss;
  if(Math.random()<0.2*dt){m.flash=1.2;floatAt(m.x,m.y,'?','#64748b')}
  const s=seatOf(m),p=(0.004+0.035*camerasCovering(s.x,s.y))*dt*skGoto();
  if(Math.random()<p){catchGoto(c,'camera');return}
  if(c.t>c.maxT||clock>=LAST)quit(c);
}
function catchGoto(c,by){

  c.caught=true;D.gotoCaught++;
  const m=c.m;if(m){m.occ=null;m.res=null;m.flash=0}c.m=null;

  news(`ゴト師を${by==='camera'?'防犯カメラで':'店員が'}発見！（被害${man(c.loot)}で済みました）`,'good');

}

/* ---------- 機種データベース（名前・出玉率・確率の変更をこの端末に保存） ---------- */
const MDB_KEY='pachinkasu-mdb1';
const MDB_DEF=Object.fromEntries(MODELS.map(m=>[m.id,{name:m.name,rates:m.rates?m.rates.slice():null,prob:m.prob??null}]));
let mdbEdits={};
const clampRate=v=>Math.round(clamp(v,SLOT_MIN,SLOT_MAX)*10)/10;
function mdbClean(o){
  const out={};if(!o||typeof o!=='object')return out;
  for(const[id,e]of Object.entries(o)){
    const md=MB[id],d=MDB_DEF[id];if(!md||!d||!e||typeof e!=='object')continue;const r={};
    if(typeof e.name==='string'&&e.name.trim()&&e.name.trim()!==d.name)r.name=e.name.trim().slice(0,30);
    if(md.k==='s'&&Array.isArray(e.rates)&&e.rates.length===6&&e.rates.every(v=>isFinite(+v))){const rt=e.rates.map(v=>clampRate(+v));if(rt.join()!==d.rates.join())r.rates=rt}
    if(md.k==='p'&&PROBS.includes(+e.prob)&&+e.prob!==d.prob)r.prob=+e.prob;
    if(Object.keys(r).length)out[id]=r;
  }
  return out;
}
function mdbApply(){for(const md of MODELS){const d=MDB_DEF[md.id],e=mdbEdits[md.id]||{};md.name=e.name||d.name;if(md.k==='s')md.rates=(e.rates||d.rates).slice();else md.prob=e.prob||d.prob}}
function mdbLoad(){try{const o=JSON.parse(localStorage.getItem(MDB_KEY)||'null');mdbEdits=mdbClean(o&&o.m)}catch(e){mdbEdits={}}mdbApply()}
function mdbSave(){try{localStorage.setItem(MDB_KEY,JSON.stringify({v:1,m:mdbEdits}))}catch(e){}}
function mdbSet(o){mdbEdits=mdbClean(o);mdbSave();mdbApply()}

/* 章のボスは、その章になるまで町に出てこない */
const BOSS_CH={gonda:2,hoshino:3,kurosaki:4};

const CHAPTERS=[null,

/* 店の大きさの目安（立地の人の多さ × 台数）。粗利ノルマはこれに比例させる */
const storeScale=()=>LOCS[G.loc].town*capF(eqMachines());

const storeAt=loc=>G.loc===loc||(S.branches||[]).some(b=>b.st&&b.st.loc===loc);

/* ---------- はじめる ---------- */
function storyInit(migrated){

  S.story.quota=makeQuota(null);
}
function monthRange(day){
  const d=dateOf(day),y=d.getFullYear(),m=d.getMonth(),first=day-(d.getDate()-1),len=new Date(y,m+1,0).getDate();
  return {y,m:m+1,first,last:first+len-1};
}
/* ノルマを決める。prev は先月のノルマ（なければ店の大きさから決める） */
function makeQuota(prev){
  const st=S.story,ch=Math.min(5,st.ch),mr=monthRange(S.day),sNow=storeScale(),n=Math.max(1,machines().length);
  const first=!prev;
  let dt;
  if(first)dt=500*sNow*0.9;
  else{
    const prevPer=prev.dt/prev.s0,perf=prev.n?(prev.g/prev.n)/(prev.sSum/prev.n):prevPer;
    let p=Math.max(perf,prevPer*0.9)*CH_GROW[ch];
    p=Math.min(p,prevPer*1.15);
    dt=p*sNow;
  }
  dt=Math.max(30000,Math.round(dt/1000)*1000);
  const util=Math.round((first?0.36:CH_UTIL[ch])*Math.min(1,Math.pow(30/n,0.25))*100)/100;
  const rep=first&&ch===1?35:CH_REP[ch];
  return {y:mr.y,m:mr.m,from:S.day,to:mr.last,dt,util,rep,s0:sNow,g:0,uSum:0,sSum:0,n:0,go:0,first};
}
/* オープン期間のうち、今月の残りに入る日数 */
function goDaysAhead(q){
  if(!S.go)return 0;
  let n=0;for(let d=Math.max(S.day,S.go.start);d<S.go.start+S.go.len;d++)if(d<=q.to)n++;
  return n;
}
/* 今月のノルマの状況 */
function quotaInfo(){
  const st=S.story;if(!st||!st.quota)return null;
  const q=st.quota,days=q.to-q.from+1,left=Math.max(0,q.to-S.day+1);
  const goKnown=q.go+goDaysAhead(q),count=Math.max(0,days-goKnown);
  const target=q.dt*count,pace=q.n?q.g/(q.dt*q.n):null,util=q.n?q.uSum/q.n:null;
  const proj=q.n?q.g+q.g/q.n*Math.max(0,count-q.n):null;
  return {q,days,left,count,target,pace,util,proj,okG:pace!=null&&pace>=1,okU:util!=null&&util>=q.util,okR:S.rep>=q.rep};
}

/* ---------- 全国ホールアワードの採点 ---------- */
function awardParts(){
  const a=S.story.award;if(!a||!a.n)return null;
  const beaten=S.rivalLog.length;
  return [
    {k:'稼働率',v:a.u/a.n,pt:25*clamp((a.u/a.n)/0.55,0,1),fmt:x=>Math.round(x*100)+'%'},
    {k:'評判',v:a.rep/a.n,pt:20*clamp((a.rep/a.n)/75,0,1),fmt:x=>Math.round(x)},
    {k:'信用',v:a.trust/a.n,pt:15*clamp((a.trust/a.n)/80,0,1),fmt:x=>Math.round(x)},
    {k:'町のシェア',v:a.sh/a.n,pt:20*clamp((a.sh/a.n)/0.45,0,1),fmt:x=>Math.round(x*100)+'%'},
    {k:'店舗数',v:storeCount(),pt:10*clamp(storeCount()/3,0,1),fmt:x=>x+'軒'},
    {k:'倒したライバル',v:beaten,pt:10*clamp(beaten/6,0,1),fmt:x=>x+'軒'},
  ];
}
function awardScore(){const p=awardParts();return p?Math.round(p.reduce((s,x)=>s+x.pt,0)):0}

/* ---------- 1日の終わり（閉店のあと、日付が変わる前） ---------- */
function storyEndDay(R){
  const st=S.story;if(!st||st.fired)return;
  const out=R.story={steps:[]};
  const q=st.quota;
  if(q&&S.day>=q.from&&S.day<=q.to){
    if(D.isGo)q.go++;
    else{q.g+=R.gross;q.uSum+=R.util;q.sSum+=storeScale();q.n++}
  }
  /* シェア1位・ボスとの勝負 */
  const sh=D.shares||{},me=sh.me||0,top=Object.keys(sh).every(k=>k==='me'||sh[k]<me);
  if(st.ch===2&&top)st.cnt.top++;
  if(st.ch===3&&top&&G.loc==='ekimae')st.cnt.ekiTop++;
  const chd=CHAPTERS[st.ch],br=bossRival();
  if(chd&&chd.boss&&br&&!st.bossWin&&!D.isGo&&me>(sh[br.id]||0)){
    st.cnt.beat++;
    if(st.cnt.beat>=chd.beat){st.bossWin=true;out.steps.push({talk:bossConcedeTalk(chd.boss,br)});news(`${br.name}の${BOSS_BY[chd.boss].name}が負けを認めた！`,'good')}
    else if(st.cnt.beat===Math.ceil(chd.beat/2)&&!st.seen['half'+st.ch]){st.seen['half'+st.ch]=1;out.steps.push({talk:bossHalfTalk(chd.boss)})}
  }
  /* 全国ホールアワードの審査 */
  if(st.ch===5&&st.award&&!st.awardWon){
    const a=st.award;a.n++;a.u+=R.util;a.rep+=S.rep;a.trust+=S.trust;a.sh+=R.share;
    if(a.n>=AWARD_DAYS){
      const score=awardScore(),win=score>=AWARD_PASS;
      out.steps.push({talk:awardTalk(score,win)});
      st.awardLog=(st.awardLog||[]).concat([{day:S.day,score,win}]);
      if(win){st.awardWon=true;S.ended={type:'story',day:S.day};out.ending=true;out.steps.push({talk:endingTalk()})}
      else{st.award=newAward();news(`全国ホールアワードは${score}点で${score>=65?'準大賞':'優秀賞'}。次の審査が始まった`,'')}
    }
  }
  /* 月末の査定 */
  if(q&&S.day>=q.to){
    const res=evaluateMonth();out.month=res;
    out.steps.push({talk:monthTalk(res)});
    if(res.fired){out.fired=true;return}
  }
  /* 章のクリア */
  if(st.ch<5&&chapterDone()){
    const done=st.ch,C=CHAPTERS[done];
    st.cleared.push({ch:done,day:S.day});
    out.steps.push({telop:[`${CH_NAME(done)} クリア！`,C.title,'good']});
    out.steps.push({talk:clearTalk(done)});
    grantReward(C.reward);
    news(`${CH_NAME(done)}「${C.title}」クリア！ ごほうび：${C.reward.text}`,'good');
    st.ch++;st.chStart=S.day+1;st.cnt={top:0,ekiTop:0,beat:0};st.bossWin=false;st.chStarted=false;
  }
}
/* 日付が変わったあと（朝） */
function storyDayStart(R){
  const st=S.story;if(!st||st.fired)return;
  const out=R.story||(R.story={steps:[]});
  if(!st.chStarted&&st.seen.prologue){out.steps.push(...chapterStartSteps());}
  if(st.quota&&S.day>st.quota.to){
    st.quota=makeQuota(st.quota);out.newMonth=true;
    out.steps.push({talk:quotaTalk(false)});
  }
}
/* 章のはじまり：ボスを呼び、タイトルと会話を出す */
function chapterStartSteps(){
  const st=S.story,ch=st.ch,C=CHAPTERS[ch];
  st.chStarted=true;
  if(ch===5&&!st.award)st.award=newAward();
  if(C.boss){
    const B=BOSS_BY[C.boss],open=S.rivals.some(r=>r.open&&r.boss===C.boss),planned=S.rivalPlans.some(p=>p.boss===C.boss);
    if(!open&&!planned)scheduleRival({boss:B.id,annIn:ch===1?1:rndi(2,4),openIn:rndi(9,12),next:ch===1});
  }
  return [{card:[CH_NAME(ch),C.title,C.desc]},{talk:chapterIntroTalk(ch)}];
}
const newAward=()=>({from:S.day,n:0,u:0,rep:0,trust:0,sh:0});

/* ---------- 月末の査定 ---------- */
function evaluateMonth(){
  const st=S.story,q=st.quota,target=q.dt*q.n,uAvg=q.n?q.uSum/q.n:0;
  const res={pl:monthPL(),y:q.y,m:q.m,g:Math.round(q.g),target:Math.round(target),dt:q.dt,n:q.n,go:q.go,util:uAvg,utilT:q.util,rep:S.rep,repT:q.rep,
    okG:q.n===0||q.g>=target,okU:q.n===0||uAvg>=q.util,okR:S.rep>=q.rep,owner:!st.bought,ch:st.ch,bonus:0,strikes:0};
  res.pass=res.okG&&(res.okU||res.okR);res.perfect=res.okG&&res.okU&&res.okR;
  if(res.pass){
    st.strikes=0;st.passes++;if(st.ch===1)st.chPass++;if(res.perfect)st.perfects++;
    res.bonus=Math.round(((res.perfect?300000:100000)*Math.min(4,st.ch)+(res.perfect?Math.max(0,q.g-target)*0.2:0))/10000)*10000;
    S.money+=res.bonus;
  }else if(!st.bought){
    st.strikes++;if(st.strikes>=3){st.fired=true;res.fired=true}
  }
  res.strikes=st.strikes;
  st.log.push({y:q.y,m:q.m,pass:res.pass,perfect:res.perfect,okG:res.okG,okU:res.okU,okR:res.okR,g:res.g,target:res.target});
  if(st.log.length>48)st.log.shift();
  news(`${q.m}月の査定：${res.perfect?'完全達成':res.pass?'合格':'不合格'}${res.bonus?`（ボーナス${man(res.bonus)}）`:''}`,res.pass?'good':'bad');
  return res;
}
function grantReward(rw){
  if(!rw)return;
  S.money+=rw.money||0;
  for(const it of rw.items||[])S.storage.push(Object.assign({},it,{gift:1}));
  if(rw.floor&&!G.ownedFloors.includes(rw.floor))G.ownedFloors.push(rw.floor);
}

/* ---------- 借金・買い取り ---------- */
function repayDebt(n){
  const st=S.story;n=Math.min(n,st.debt,Math.max(0,S.money));
  if(n<=0)return 0;
  st.debt-=n;S.money-=n;
  if(st.debt<=0)news('オーナーへの借金を完済した！','good');
  return n;
}
function buyStore(){
  const st=S.story;
  if(st.bought||st.ch<3)return 'まだ買い取れません';
  if(S.money<BUYOUT)return 'お金が足りません';
  S.money-=BUYOUT;st.bought=true;st.strikes=0;
  news(`お店をオーナーから${man(BUYOUT)}で買い取った。今日からあなたがオーナーです`,'big');
  return null;
}

/* ---------- 順番に出す（会話・章のタイトル・テロップ） ---------- */
function storyStep(s){

  if(s.telop)return telopStep(s.telop[0],s.telop[1],s.telop[2]);

let chapTimer=0;
function chapterCard(no,title,sub,done){

  el.hidden=false;el.classList.remove('go');void el.offsetWidth;el.classList.add('go');sfx('fanfare');

  const end=()=>{if(fin)return;fin=true;clearTimeout(chapTimer);el.hidden=true;el.onclick=null;if(done)done()};
  el.onclick=()=>{if(performance.now()-at>600)end()};

}
/* はじめての章の流れ（プロローグ → 第1章 → ノルマ） */

const missionReward=()=>10000*(1+rankNo());
function makeMissions(){
  const can=Object.entries(MISSIONS).filter(([k,d])=>!d.can||d.can());
  const by=g=>can.filter(([k,d])=>d.grp===g);
  const out=[],used=new Set();
  const take=list=>{const l=list.filter(([k])=>!used.has(k));if(!l.length)return;const [k,d]=pick(l);used.add(k);out.push(Object.assign({k,st:null},d.make?d.make():{}))};
  take(by('num'));take(by('svc'));take(Math.random()<0.5?by('x'):can);
  while(out.length<3&&used.size<can.length)take(can);
  S.missions={day:S.day,list:out,rerolled:false,res:null};
}
function ensureMissions(){if(!S.missions||S.missions.day!==S.day)makeMissions()}
function rerollMission(i){
  const ms=S.missions;if(!ms||ms.rerolled||S.phase!=='prep')return false;
  const used=new Set(ms.list.map(m=>m.k));
  const can=Object.entries(MISSIONS).filter(([k,d])=>!used.has(k)&&(!d.can||d.can()));
  if(!can.length)return false;
  const [k,d]=pick(can);ms.list[i]=Object.assign({k,st:null},d.make?d.make():{});ms.rerolled=true;return true;
}
const mDef=m=>MISSIONS[m.k];
const mLabel=m=>mDef(m).label(m);
const mShort=m=>mDef(m).short(m);
function mLive(m){
  if(S.phase!=='open'||!D)return null;
  const d=mDef(m);return d.live?d.live(m):null;
}
/* 閉店のときに判定してごほうびを出す */
function judgeMissions(R){
  const ms=S.missions;if(!ms||ms.day!==S.day){R.missions=null;return}
  let n=0;const each=missionReward();
  for(const m of ms.list){let ok=false;try{ok=!!mDef(m).fin(m,R)}catch(e){ok=false}m.st=ok?'ok':'ng';if(ok)n++}
  let money=n*each,bonus=0;
  if(n===3){bonus=Math.round(each*1.5);S.trust=clamp(S.trust+1,0,100);S.missStreak=(S.missStreak||0)+1;
    if(S.missStreak%7===0)news(`朝礼の目標を${S.missStreak}日連続で全部達成！`,'good')}
  else S.missStreak=0;
  S.money+=money+bonus;
  ms.res={n,money,bonus};
  R.missions={list:ms.list.map(m=>({label:mLabel(m),ok:m.st==='ok'})),n,money,bonus,streak:S.missStreak||0};
  if(S.mon)S.mon.mis+=n,S.mon.misT+=3;
}

/* ---------- 月末決算（月ごとの集計） ---------- */
function newMon(day){const d=dateOf(day);return {y:d.getFullYear(),m:d.getMonth()+1,days:0,coin:0,out:0,exch:0,drink:0,rent:0,wages:0,power:0,ad:0,repairs:0,interest:0,goto:0,net:0,visitors:0,full:0,uSum:0,best:null,worst:null,red:0,ev:0,hot:0,gase:0,mis:0,misT:0,mach:{},netDays:[],shares:{}}}
function monAcc(R){
  const d=dateOf(R.day);
  if(!S.mon||S.mon.y!==d.getFullYear()||S.mon.m!==d.getMonth()+1)S.mon=newMon(R.day);
  const M=S.mon;
  M.days++;for(const k of ['coin','out','exch','drink','rent','wages','power','ad','repairs','interest','goto','net','visitors','full'])M[k]+=R[k]||0;
  M.uSum+=R.util;
  if(!M.best||R.net>M.best.net)M.best={day:R.day,net:Math.round(R.net)};
  if(!M.worst||R.net<M.worst.net)M.worst={day:R.day,net:Math.round(R.net)};
  if(R.net<0)M.red++;
  M.netDays.push(Math.round(R.net));
  if(R.ev){M.ev++;if(R.ev.judge==='激アツ')M.hot++;if(R.ev.judge==='ガセ')M.gase++}
  for(const m of machines()){if(!m.yest)continue;const e=M.mach[m.id]||(M.mach[m.id]={no:m.no,type:m.type,store:0,mins:0,days:0});e.no=m.no;e.type=m.type;e.store+=m.yest.coin-m.yest.out;e.mins+=m.yest.mins;e.days++}
  const sh=D.shares||{};M.shares.me=(M.shares.me||0)+(sh.me||0);
  for(const r of openRivals()){const k=String(r.id);M.shares[k]=(M.shares[k]||0)+(sh[r.id]||0)}
}
/* 月の決算書を作る（査定と同じタイミング） */
function monthPL(){
  const M=S.mon;if(!M||!M.days)return null;
  const gross=M.coin-M.out+M.exch;
  const mach=Object.values(M.mach);
  const byType={};for(const e of mach){const t=byType[e.type]||(byType[e.type]={type:e.type,store:0,mins:0,days:0,n:0});t.store+=e.store;t.mins+=e.mins;t.days+=e.days;t.n++}
  const types=Object.values(byType).map(t=>Object.assign(t,{util:t.days?t.mins/(t.days*(LAST-OPEN)):0}));
  const earner=types.slice().sort((a,b)=>b.store-a.store)[0]||null;
  const popular=types.slice().sort((a,b)=>b.util-a.util)[0]||null;
  const giver=mach.slice().sort((a,b)=>a.store-b.store)[0]||null;
  const rivals=Object.entries(M.shares).filter(([k])=>k!=='me').map(([k,v])=>{const r=S.rivals.find(x=>String(x.id)===k);return r?{name:r.name,col:r.col,boss:r.boss,share:v/M.days}:null}).filter(Boolean).sort((a,b)=>b.share-a.share);
  const prev=S.monPrev||null;
  const div=S.regFx&&S.regFx.kanedaInv&&M.net>0?Math.round(M.net*0.05/1000)*1000:0;
  if(div){S.money-=div;M.net-=div}
  const pl={y:M.y,m:M.m,days:M.days,coin:M.coin,out:M.out,exch:M.exch,drink:M.drink,gross,rent:M.rent,wages:M.wages,power:M.power,ad:M.ad,repairs:M.repairs,interest:M.interest,goto:M.goto,net:M.net,
    visitors:M.visitors,full:M.full,util:M.uSum/M.days,best:M.best,worst:M.worst,red:M.red,ev:M.ev,hot:M.hot,gase:M.gase,mis:M.mis,misT:M.misT,netDays:M.netDays.slice(),
    share:(M.shares.me||0)/M.days,rivals,earner:earner&&{name:MB[earner.type].name,store:earner.store,n:earner.n},popular:popular&&{name:MB[popular.type].name,util:popular.util,n:popular.n},
    giver:giver&&giver.store<0?{no:giver.no,name:MB[giver.type].name,cust:-giver.store}:null,prevNet:prev?prev.net:null,prevVis:prev?prev.visitors:null,div};
  S.monPrev={net:pl.net,visitors:pl.visitors};
  return pl;
}

/* ---------- 町のホールアワード（毎年12月31日） ----------
   総合（町のシェア）・稼働王（1台あたりのお客さんの数）・還元王（出玉率）・接客王（評判）の4部門 */
const AWARD_CATS=[
  {k:'share',name:'総合大賞',desc:'町のシェアがいちばん大きい店',prize:3000000,fmt:v=>Math.round(v*100)+'%'},
  {k:'vpm',name:'稼働王',desc:'1台あたりのお客さんがいちばん多い店',prize:1000000,fmt:v=>v.toFixed(1)+'人/台'},
  {k:'pay',name:'還元王',desc:'出玉率がいちばん高い店',prize:1000000,fmt:v=>Math.round(v*1000)/10+'%'},
  {k:'rep',name:'接客王',desc:'評判がいちばん高い店',prize:1000000,fmt:v=>Math.round(v)},
];
function yrAcc(R){
  const y=dateOf(R.day).getFullYear();
  if(!S.yr||S.yr.y!==y)S.yr={y,me:{n:0,share:0,vpm:0,pay:0,rep:0},riv:{}};
  const Y=S.yr,me=Y.me,n=Math.max(1,machines().length),info=dayInfo(R.day);
  me.n++;me.share+=R.share;me.vpm+=R.visitors/n;me.pay+=R.payR;me.rep+=S.rep;
  for(const r of openRivals()){
    const e=Y.riv[r.id]||(Y.riv[r.id]={name:r.name,boss:r.boss,col:r.col,n:0,share:0,vpm:0,pay:0,rep:0});
    const sh=(D.shares&&D.shares[r.id])||0,vis=LOCS[G.loc].town*info.mult*sh;
    e.name=r.name;e.n++;e.share+=sh;e.vpm+=vis/Math.max(10,r.size);e.pay+=rivalPayout(r);e.rep+=r.rep;
  }
}
function holdAwards(){
  const Y=S.yr;if(!Y||!Y.me.n)return null;
  const avg=e=>({share:e.share/e.n,vpm:e.vpm/e.n,pay:e.pay/e.n,rep:e.rep/e.n});
  const rows=[{name:S.name,me:true,...avg(Y.me)}];
  for(const e of Object.values(Y.riv))if(e.n>=30)rows.push({name:e.name,boss:e.boss,col:e.col,...avg(e)});
  const cats=AWARD_CATS.map(c=>{const sorted=rows.slice().sort((a,b)=>b[c.k]-a[c.k]);return {k:c.k,name:c.name,desc:c.desc,prize:c.prize,fmt:c.fmt,win:sorted[0],place:sorted.findIndex(r=>r.me)+1,me:sorted.find(r=>r.me),list:sorted.slice(0,4)}});
  let prize=0;const wins=[];
  for(const c of cats)if(c.win.me){prize+=c.prize;wins.push(c.name)}
  S.money+=prize;
  if(wins.length){S.rep=clamp(S.rep+2*wins.length,0,100);S.trust=clamp(S.trust+2*wins.length,0,100)}
  const res={y:Y.y,cats,prize,wins,n:rows.length};
  S.awards=(S.awards||[]).concat([{y:Y.y,wins,places:cats.map(c=>c.place)}]);
  news(`${Y.y}年 町のホールアワード：${wins.length?wins.join('・')+'を受賞！':'受賞ならず'}`,wins.length?'good':'');
  return res;
}
function awardTownTalk(res){
  const L=[{who:'mc',ex:'happy',text:`${res.y}年も残りわずか！ 町のホールアワードの発表です！`}];
  for(const c of res.cats){
    L.push({who:'mc',ex:'n',text:`${c.name}は……「${c.win.name}」！（${c.fmt(c.win[c.k])}）`});
    if(c.win.me)L.push({who:'me',ex:'happy',text:pick(['やった……！','ありがとうございます！','お客さんのおかげです！'])});

  }
  if(res.wins.length)L.push({who:'owner',ex:'happy',text:res.wins.length>=3?'ほとんど総なめじゃないか……！ 大したもんだよ':'よくやったね。来年はもっと取りな'});

/* ---------- 季節のイベント（GW・お盆・年末・正月） ---------- */
function seasonInfo(day){
  const d=dateOf(day),m=d.getMonth()+1,dd=d.getDate();
  if((m===4&&dd>=29)||(m===5&&dd<=6))return {key:'gw',name:'GW大感謝祭'};
  if(m===8&&dd>=13&&dd<=16)return {key:'bon',name:'お盆特別営業'};
  if(m===12&&dd>=29)return {key:'nenmatsu',name:'年末大感謝祭'};
  if(m===1&&dd<=3)return {key:'shinshun',name:'新春初打ち'};
  return null;
}
