<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="釘と設定、イベントと店づくりで客を呼ぶ、ドット絵のパチンコ屋経営ゲーム">
<meta name="theme-color" content="#2d2459">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="パチンコ繁盛記">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>[hidden]{display:none!important}</style>
<script>window.APP_MODE=true;window.APP_VERSION='202610080944';</script>
<title>パチンコ繁盛記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: the whole screen is the hall floor (landscape). Small sticker chips sit in the corners; commands appear at the bottom only while preparing. One bright look by design. */
:root{
  --sun:#ffd23f; --sun-2:#ffc21a; --ink:#16121f; --paper:#ffffff; --paper-2:#f2efff; --paper-3:#fff4cc;
  --red:#ff2d55; --blue:#2f6bff; --green:#14a35a; --purple:#7c3aed; --muted:#6b6880; --night:#2d2459;
  --c1:#8b8fa8; --c2:#3b82f6; --c3:#22c55e; --c4:#eab308; --c5:#f97316; --c6:#ff2d55;
  --f-display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Noto Sans JP",sans-serif;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --sl:0px; --sr:0px; --st:0px; --sb:0px;
  color-scheme:light;
}
html{height:100%;background:var(--night)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--f-body);font-weight:500;font-size:13px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
#probe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#root{position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:hidden;transform-origin:0 0;background:var(--night)}
#cv{position:absolute;left:0;top:0;display:block;touch-action:none;image-rendering:pixelated;image-rendering:crisp-edges}
.ui{position:absolute;inset:0;pointer-events:none;z-index:5}
.ui>*{pointer-events:auto}
.chipc{background:var(--paper);border:2.5px solid var(--ink);border-radius:12px;box-shadow:2px 3px 0 var(--ink)}

/* 上の端 */
.tl{position:absolute;top:calc(6px + var(--st));left:calc(6px + var(--sl));display:flex;flex-direction:column;gap:5px;max-width:42%}
.money-chip{padding:4px 9px 5px;display:flex;flex-direction:column;gap:1px;min-width:150px}
.mc-1{display:flex;gap:6px;align-items:baseline;font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden}
.mc-1 .nm{font-family:var(--f-display);color:var(--red);font-size:12px;overflow:hidden;text-overflow:ellipsis;max-width:9em}
.wx{font-size:10px;font-weight:800;border:2px solid var(--ink);border-radius:99px;padding:0 5px;background:#fff7b0;line-height:1.3}
.wx[data-w="rain"]{background:#bfdbfe}.wx[data-w="cloud"]{background:#e5e7eb}
.mc-2{display:flex;gap:7px;align-items:baseline;white-space:nowrap}
.mc-2 b{font-family:var(--f-display);font-weight:400;font-size:17px;line-height:1.1;font-variant-numeric:tabular-nums}
.mc-2 b.neg{color:var(--red)}
.today{font-size:11px;font-weight:800;font-variant-numeric:tabular-nums}
.tr{position:absolute;top:calc(6px + var(--st));right:calc(6px + var(--sr));display:flex;gap:5px;align-items:flex-start}
.st-chip{padding:4px 8px;display:flex;gap:8px;font-size:10.5px;font-weight:800;color:var(--muted);white-space:nowrap;align-items:center;min-height:32px}
.st-chip b{font-family:var(--f-display);font-weight:400;color:var(--ink);font-size:13px;margin-left:2px}
.ib{min-width:34px;height:32px;border:2.5px solid var(--ink);border-radius:10px;background:var(--paper);font-weight:800;font-size:11.5px;cursor:pointer;box-shadow:2px 3px 0 var(--ink);padding:0 7px;white-space:nowrap}
.ib:active{transform:translateY(2px);box-shadow:none}
.ibs{display:block;font-size:8.5px;color:var(--muted);line-height:1;margin-bottom:1px}
.tc{position:absolute;top:calc(6px + var(--st));left:50%;transform:translateX(-50%);max-width:38%;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
.tc>*{pointer-events:auto}
.clock{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;align-items:center}
.clock .tm{font-family:var(--f-display);font-size:14px;background:var(--ink);color:var(--sun);border-radius:9px;padding:1px 8px;border:2px solid var(--ink)}
.clock .tm.prep{background:var(--sun);color:var(--ink)}
.clock .stt{font-size:11px;font-weight:800;background:#fff;border:2px solid var(--ink);border-radius:99px;padding:0 7px;white-space:nowrap}
.pill{display:inline-block;border:2px solid var(--ink);border-radius:99px;padding:0 7px;font-size:10.5px;font-weight:800;white-space:nowrap;background:#fff;line-height:1.45}
.pill.go,.pill.ev{background:var(--red);color:#fff}
.pill.cal{background:#bfe1ff}.pill.riv{background:#e9d5ff}.pill.reg{background:#111;color:#fff}
.hint{font-size:11px;font-weight:800;background:var(--paper-3);border:2px solid var(--ink);border-radius:9px;padding:2px 8px;text-align:center;max-width:100%}

/* つぶやき */
.feed{position:absolute;left:calc(6px + var(--sl));bottom:calc(52px + var(--sb));width:min(250px,32%);display:flex;flex-direction:column;justify-content:flex-end;gap:4px;pointer-events:none}
.tw{background:rgba(255,255,255,.93);border:2px solid var(--ink);border-radius:10px;padding:3px 7px;font-size:11px;font-weight:800;line-height:1.35;display:flex;gap:6px;align-items:flex-start;transition:opacity .5s,transform .3s;animation:twin .3s ease-out}
.tw i{flex:none;width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);margin-top:2px}
.tw b{font-family:var(--f-display);font-weight:400;font-size:10.5px;color:var(--blue);margin-right:3px}
.tw.out{opacity:0}
@keyframes twin{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}

/* 下の端 */
.zoom{position:absolute;right:calc(6px + var(--sr));bottom:calc(10px + var(--sb));display:flex;flex-direction:column;gap:5px}
.prep .zoom{bottom:calc(62px + var(--sb))}
.zoom button{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;font-family:var(--f-display);font-size:15px;cursor:pointer;box-shadow:0 3px 0 var(--ink);padding:0}
.zoom button#zFit{font-size:9px}
.zoom button:active{transform:translateY(2px);box-shadow:none}
.speed{position:absolute;left:calc(6px + var(--sl));bottom:calc(8px + var(--sb));display:flex;gap:5px}
.speed .ib.on{background:var(--sun)}
#dock{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(6px + var(--sb));display:flex;gap:6px;max-width:calc(100% - 100px)}
.btn{background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:4px 10px;min-height:42px;min-width:62px;font-family:var(--f-display);font-size:13px;cursor:pointer;box-shadow:0 4px 0 var(--ink);line-height:1.15;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--red);color:#fff}
.btn.hot{background:var(--sun)}
.btn.danger{background:#ffe1e7;color:#b0102f}
.btn.ghost{background:var(--paper-2);color:var(--muted);font-family:var(--f-body);font-weight:800}
.btn.sm{min-height:36px;min-width:0;font-size:12px;padding:3px 9px;border-width:2.5px;box-shadow:0 3px 0 var(--ink)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn:focus-visible,.ib:focus-visible,.chip:focus-visible,.sbtn:focus-visible,.zoom button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.toolbar{padding:6px 8px;display:flex;gap:10px;align-items:center}
.toolbar .tt{font-size:12px;font-weight:800;line-height:1.35;min-width:0}
.toolbar .tt b{font-family:var(--f-display);font-weight:400;color:var(--red)}
.toolbar .row{display:flex;gap:6px;flex:none}
.sub{color:var(--muted);font-size:11.5px;font-weight:800;line-height:1.45}
#toast{position:absolute;bottom:calc(16px + var(--sb));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border:2.5px solid #fff;border-radius:12px;padding:5px 12px;font-weight:800;font-size:12.5px;white-space:nowrap;max-width:80%;overflow:hidden;text-overflow:ellipsis;pointer-events:none;opacity:0;transition:opacity .2s;z-index:8}
#toast.show{opacity:1}
.prep #toast{bottom:calc(62px + var(--sb))}

/* シート（横画面では右側の引き出し） */
#scrim{position:absolute;inset:0;background:rgba(22,18,31,.35);z-index:20}
.sheet{position:absolute;z-index:21;display:flex;flex-direction:column;background:var(--paper);border:3px solid var(--ink);box-shadow:-3px 4px 0 var(--ink)}
.L .sheet{right:calc(6px + var(--sr));top:calc(6px + var(--st));bottom:calc(6px + var(--sb));width:min(56%,520px);border-radius:16px}
.P .sheet{left:6px;right:6px;bottom:0;max-height:86%;border-radius:16px 16px 0 0;border-bottom:0;padding-bottom:var(--sb)}
.sheet-head{display:flex;align-items:center;gap:8px;padding:7px 10px 7px 12px;border-bottom:3px solid var(--ink);background:var(--sun);border-radius:13px 13px 0 0}
.sheet-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:15px;flex:1;text-wrap:balance}
.sheet-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:10px 12px 16px;display:flex;flex-direction:column;gap:9px;line-height:1.5;touch-action:pan-y}
.rot .sheet-body{touch-action:none}
.sheet-body>*{flex-shrink:0}
.lbl{font-family:var(--f-display);font-size:12.5px;letter-spacing:.04em}
.pos{color:var(--green)} .neg{color:var(--red)}
.box{background:var(--paper-2);border:2px solid var(--ink);border-radius:11px;padding:7px 10px;font-weight:800;font-size:12.5px}
.box.col{display:flex;flex-direction:column;gap:3px}
.box.neg{background:#ffe1e7}
.empty{color:var(--muted);font-weight:800;font-size:12.5px;padding:8px;border:2px dashed var(--muted);border-radius:11px}
.chips,.tabs{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#fff;border:2.5px solid var(--ink);border-radius:99px;padding:3px 11px;font-weight:800;font-size:12.5px;cursor:pointer;min-height:34px;white-space:nowrap}
.chip.cur{background:var(--ink);color:var(--sun)}
.chip.wide{width:100%;white-space:normal}
.chip:disabled{opacity:.35}
.setrow{display:flex;gap:5px;flex-wrap:wrap}
.sbtn{min-width:36px;height:36px;border-radius:10px;border:2.5px solid var(--ink);background:#fff;font-family:var(--f-display);font-size:14px;cursor:pointer;padding:0 6px}
.sbtn.wide{font-family:var(--f-body);font-weight:800;font-size:12px;flex:1;min-width:0}
.setrow.small .sbtn{min-width:30px;height:30px;font-size:13px}
.setrow.small .sbtn.wide{font-size:11.5px}
.sbtn.cur{color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.sbtn:disabled{opacity:.5}
.bulk .sbtn{color:#fff}
.c1.cur,.bulk .c1,.badge.c1{background:var(--c1)} .c2.cur,.bulk .c2,.badge.c2{background:var(--c2)} .c3.cur,.bulk .c3,.badge.c3{background:var(--c3)}
.c4.cur,.bulk .c4,.badge.c4{background:var(--c4)} .c5.cur,.bulk .c5,.badge.c5{background:var(--c5)} .c6.cur,.bulk .c6,.badge.c6{background:var(--c6)}
.n0.cur,.bulk .n0,.badge.n0{background:var(--c1)} .n1.cur,.bulk .n1,.badge.n1{background:var(--c2)} .n2.cur,.bulk .n2,.badge.n2{background:var(--c3)}
.n3.cur,.bulk .n3,.badge.n3{background:var(--c5)} .n4.cur,.bulk .n4,.badge.n4{background:var(--c6)}
.bulk{display:flex;flex-direction:column;gap:4px}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:6px;color:#fff;font-family:var(--f-display);font-size:12px;padding:0 5px;border:2px solid var(--ink)}
.mp-head{display:flex;gap:12px;align-items:center}
.mp-no{font-family:var(--f-display);font-size:30px;color:var(--red);line-height:1;text-align:center;min-width:58px;font-variant-numeric:tabular-nums}
.mp-no small{display:block;font-size:11px;color:var(--ink)}
.mp-t{min-width:0}
.mp-name{font-family:var(--f-display);font-size:16px;line-height:1.3}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.tag{border:2px solid var(--ink);border-radius:7px;padding:0 6px;font-size:10.5px;font-weight:800;background:#fff;white-space:nowrap}
.tag.kp{background:#bfdbfe}.tag.ks{background:#fbcfe8}.tag.smk{background:#ddd6fe}.tag.new{background:var(--red);color:#fff}.tag.dark{background:var(--ink);color:#fff}
.stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-variant-numeric:tabular-nums}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .wide2{grid-column:1/-1}
.item{display:flex;align-items:center;gap:10px;background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:7px 9px}
.item .sw{width:30px;height:30px;border-radius:9px;flex:none;border:2.5px solid var(--ink)}
.item .sw.face{border-radius:50%}
.item .it{flex:1;min-width:0}
.item .nm{font-family:var(--f-display);font-size:13.5px;line-height:1.35}
.item .ds{font-size:11.5px;color:var(--muted);font-weight:800;line-height:1.45}
.item .col{display:flex;flex-direction:column;gap:5px;flex:none}
.item .btn.sm{font-size:12px;white-space:nowrap}
.locked{opacity:.5}
.lrow{background:#fff;border:2.5px solid var(--ink);border-radius:11px;padding:5px 8px;display:flex;flex-direction:column;gap:4px}
.lrow.tgt{background:#fff0f3;border-color:var(--red)}
.lrow .l1{display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.lrow .no{font-family:var(--f-display);color:var(--red);font-size:14px;min-width:28px}
.lrow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:800}
.lrow .rs{font-size:11px;font-weight:800;white-space:nowrap}
.rt{font-size:10px;font-weight:800;border:2px solid var(--ink);border-radius:6px;padding:0 4px;background:#ffd1db;white-space:nowrap}
.rt.lo{background:#bbf7d0}
.isl-h{font-family:var(--f-display);font-size:14px;margin-top:3px}
.verdict{font-family:var(--f-display);font-size:19px}
.verdict.good{color:var(--red)} .verdict.mid{color:var(--blue)} .verdict.bad{color:var(--ink)}
.meter{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-weight:800}
.mt-bar{position:relative;height:15px;border:2.5px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.mt-bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--c4),var(--red))}
.mt-bar .mk{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.mt-v{font-family:var(--f-display)}
.burstcard{position:relative;padding:18px 12px;text-align:center;isolation:isolate}
.burstcard::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--red);clip-path:polygon(50% 0,58% 18%,75% 6%,74% 26%,95% 22%,84% 40%,100% 50%,84% 60%,95% 78%,74% 74%,75% 94%,58% 82%,50% 100%,42% 82%,25% 94%,26% 74%,5% 78%,16% 60%,0 50%,16% 40%,5% 22%,26% 26%,25% 6%,42% 18%)}
.burstcard.bad::before{background:var(--ink)}
.burstcard.gold::before{background:var(--sun)}
.bc-main{font-family:var(--f-display);font-size:22px;color:#fff;text-shadow:2px 2px 0 var(--ink)}
.burstcard.gold .bc-main{color:var(--red)}
.bc-sub{font-weight:800;color:#fff;font-size:12.5px}
.burstcard.gold .bc-sub{color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;text-align:center}
.kpis div{background:#fff;border:2.5px solid var(--ink);border-radius:11px;padding:5px 4px}
.kpis b{display:block;font-family:var(--f-display);font-weight:400;font-size:19px;font-variant-numeric:tabular-nums}
.kpis span{font-size:10.5px;color:var(--muted);font-weight:800}
.segs{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;font-weight:800;color:var(--muted)}
.mt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-weight:800;font-size:12.5px}
.mt td{padding:3px 2px;border-bottom:2px dotted rgba(22,18,31,.18)}
.mt td:last-child{text-align:right}
.mt tr.total td{border-bottom:none;font-family:var(--f-display);font-weight:400;font-size:17px;padding-top:6px}
.voice{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:5px 10px;font-size:12.5px;font-weight:800;position:relative;margin-left:14px;display:flex;flex-wrap:wrap;gap:2px 8px}
.voice::before{content:"";position:absolute;left:-10px;top:8px;width:12px;height:12px;background:#fff;border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg)}
.voice.bad{background:#ffe8ec}.voice.bad::before{background:#ffe8ec}
.voice b{font-family:var(--f-display);font-weight:400}
.voice .cnt{color:var(--muted);white-space:nowrap;margin-left:auto}
.stampbox{display:flex;gap:14px;align-items:center;background:var(--paper-3);border:2.5px solid var(--ink);border-radius:13px;padding:9px 12px}
.stampbox.final{background:#fff}
.stamp{flex:none;min-width:60px;height:60px;padding:0 8px;border-radius:14px;border:4px solid currentColor;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;transform:rotate(-8deg);animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both}
.stamp.big{font-size:21px;min-width:80px;height:68px}
.stamp.good{color:var(--red)} .stamp.mid{color:var(--blue)} .stamp.bad{color:var(--ink)}
@keyframes stamp{0%{transform:rotate(-8deg) scale(2.2);opacity:0}100%{transform:rotate(-8deg) scale(1);opacity:1}}
.big{font-family:var(--f-display);font-size:22px;line-height:1.1}
.rankup{background:var(--sun);border:3px solid var(--ink);border-radius:13px;padding:8px 12px;font-family:var(--f-display);text-align:center;box-shadow:3px 3px 0 var(--ink)}
.rankup span{font-family:var(--f-body);font-weight:800;font-size:11.5px}
.tmr{background:#e0f2fe}
.rv{background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:7px 10px;display:flex;flex-direction:column;gap:4px}
.rv.closed{opacity:.5}
.rv-h{display:flex;align-items:center;gap:8px;font-family:var(--f-display)}
.rv-h b{font-weight:400;flex:1}
.rv .sw{width:18px;height:18px;border-radius:5px;border:2px solid var(--ink)}
.ds{font-size:11.5px;color:var(--muted);font-weight:800}
.bar2{height:10px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;background:#fff}
.bar2 i{display:block;height:100%}
.chart{display:flex;align-items:flex-end;gap:4px;height:80px;border-bottom:2.5px solid var(--ink);padding:0 2px;margin-bottom:14px}
.chart .cb{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.chart .cb i{display:block;width:100%;border:2px solid var(--ink);border-radius:4px 4px 0 0}
.chart .cb i.p{background:var(--c3)} .chart .cb i.n{background:var(--red)}
.chart .cb span{font-size:9px;font-weight:800;color:var(--muted);position:absolute;bottom:-15px}
.news{font-size:12px;font-weight:800;display:flex;gap:8px}
.news span{color:var(--muted);white-space:nowrap}
.news.good{color:var(--green)} .news.bad{color:var(--red)} .news.big{color:var(--purple)}
.goal{display:flex;gap:8px;align-items:center;background:#fff;border:2.5px solid var(--ink);border-radius:11px;padding:6px 9px;font-weight:800;font-size:12.5px}

/* ---------- 配置・島 ---------- */
function rebuildMaps(){
  occ=new Map();seatMap=new Map();frontMap=new Map();
  for(const o of G.objs){occ.set(key(o.x,o.y),o);if(o.kind==='m'){const s=seatOf(o);seatMap.set(key(s.x,s.y),o)}}
  for(const d of G.doors){if(WB[d.type].noFront)continue;const f=frontOf(d);frontMap.set(key(f.x,f.y),d)}
}
function computeIslands(){
  const seen=new Set(),comps=[];
  const at=(x,y)=>{if(!inB(x,y))return null;const o=occ.get(key(x,y));return o&&o.kind==='m'?o:null};
  for(const m of machines()){
    if(seen.has(m.id))continue;
    const comp=[],st=[m];seen.add(m.id);
    while(st.length){const c=st.pop();comp.push(c);for(const[dx,dy]of DIRS){const n=at(c.x+dx,c.y+dy);if(n&&!seen.has(n.id)){seen.add(n.id);st.push(n)}}}
    comp.sort((a,b)=>a.y-b.y||a.x-b.x);comps.push(comp);
  }
  comps.sort((a,b)=>(a[0].y-b[0].y)||(a[0].x-b[0].x));
  let no=1;
  islands=comps.map((c,i)=>{
    const label=i<26?String.fromCharCode(65+i):'Z'+(i-25);
    const kinds=new Set(c.map(kindOf));
    const kind=kinds.size>1?'mix':[...kinds][0];
    c.forEach(m=>{while(no%10===4||no%10===9)no++;m.no=no++;m.island=label});
    return {label,ms:c,kind};
  });
}
function layoutChanged(){rebuildMaps();computeIslands();if(typeof markDirty==='function')markDirty()}
const islandOf=m=>(islands.find(i=>i.ms.includes(m))||{ms:[m],kind:kindOf(m)});
const islandMixed=m=>islandOf(m).kind==='mix';

function floodFrom(p,blocked){
  const seen=new Set([key(p.x,p.y)]),q=[p];
  while(q.length){const c=q.pop();for(const[dx,dy]of DIRS){const nx=c.x+dx,ny=c.y+dy;if(!inB(nx,ny))continue;const k=key(nx,ny);if(seen.has(k)||blocked.has(k))continue;seen.add(k);q.push({x:nx,y:ny})}}
  return seen;
}
const adjReach=(x,y,reach)=>DIRS.some(([dx,dy])=>inB(x+dx,y+dy)&&reach.has(key(x+dx,y+dy)));
function validate(objs,doors){
  const occM=new Map(),seatM=new Map(),frontM=new Map(),slots=new Set();
  for(const d of doors){
    const sk=d.side+d.pos;if(slots.has(sk))return 'その壁にはもう設備が付いています';slots.add(sk);
    if(WB[d.type].noFront)continue;
    const f=frontOf(d);
    if(!inB(f.x,f.y))return 'そこには付けられません';
    if(isEntrance(f.x,f.y))return '入口の前には付けられません';
    const fk=key(f.x,f.y);if(frontM.has(fk))return '扉の前が別の扉と重なります';frontM.set(fk,d);
  }
  for(const o of objs){
    if(!inB(o.x,o.y))return 'お店の外には置けません';
    if(isEntrance(o.x,o.y))return '入口には置けません';
    const k=key(o.x,o.y);
    if(occM.has(k))return 'もう物が置いてあります';
    if(frontM.has(k))return '扉の前には置けません';
    occM.set(k,o);
  }
  for(const o of objs){
    if(o.kind!=='m')continue;const s=seatOf(o);
    if(!inB(s.x,s.y))return '客席がお店の外になります';
    if(isEntrance(s.x,s.y))return '入口を客席にはできません';
    const k=key(s.x,s.y);
    if(occM.has(k))return '客席になる場所に物があります';
    if(seatM.has(k))return '客席が別の台と重なります';
    if(frontM.has(k))return '客席が扉の前になります';
    seatM.set(k,o);
  }
  const reach=floodFrom(doorPos(),new Set(occM.keys()));
  for(const d of doors){if(WB[d.type].noFront)continue;const f=frontOf(d);if(!reach.has(key(f.x,f.y)))return '扉の前まで歩いて行けません'}
  for(const o of objs){
    if(o.kind==='m'){const s=seatOf(o);if(!reach.has(key(s.x,s.y)))return '通路がふさがってしまいます'}
    else if(DB[o.type].func&&!adjReach(o.x,o.y,reach))return '通路がふさがってしまいます';
  }
  return null;
}
/* 壁ぎわのマスから扉の位置を決める */
function doorSlotFor(x,y,pref){
  const c=[];
  if(y===0)c.push({side:'t',pos:x});
  if(x===0)c.push({side:'l',pos:y});
  if(x===G.W-1)c.push({side:'r',pos:y});
  if(!c.length)return null;
  if(pref){const p=c.find(s=>s.side===pref);if(p)return p}
  return c.find(s=>!G.doors.some(d=>d.side===s.side&&d.pos===s.pos))||c[0];
}

function nthMonday(y,m,n){const d=new Date(y,m,1);const off=(8-d.getDay())%7;return 1+off+(n-1)*7}
function isHoliday(d){
  const y=d.getFullYear(),m=d.getMonth()+1,dd=d.getDate();
  if(['1-1','2-11','2-23','3-20','4-29','5-3','5-4','5-5','8-11','9-23','11-3','11-23'].includes(m+'-'+dd))return true;
  return (m===1&&dd===nthMonday(y,0,2))||(m===7&&dd===nthMonday(y,6,3))||(m===9&&dd===nthMonday(y,8,3))||(m===10&&dd===nthMonday(y,9,2));
}
function dayInfo(day){
  const d=dateOf(day),m=d.getMonth()+1,dd=d.getDate(),wd=d.getDay();
  const tags=[];let mult=1,elder=1,hi=1;

  if((m===4&&dd>=29)||(m===5&&dd<=6))special='ゴールデンウィーク';
  else if(m===8&&dd>=13&&dd<=16)special='お盆';

  for(let y=2;y+2<=H-2&&placed<n;y+=4,row++){
    const segStart=[];for(let x=1;x<=W-2;x++){if((x-1)%(L+1)===L)continue;segStart.push(x)}
    let segIdx=0,prev=-9,kind=row%2?'s':'p',model=pick(kind==='p'?pPool:sPool).id,rate=Math.random()<0.3?'lo':'hi';
    for(const x of segStart){

      prev=x;

        if(placed>=n)break;
        objs.push({kind:'m',type:model,x,y:yy,dir,rate,set:kind==='s'?1+Math.floor(Math.random()*3):undefined,nail:kind==='p'?-Math.floor(Math.random()*2):undefined,installDay:-60});

function segFactor(){const p=new Set(machines().map(segOf));return SEGS.reduce((a,s)=>a+(p.has(s)?SEG_SHARE[s]:0),0)}

  const info=dayInfo(S.day);

  return {expected,shares,info,evm};
}
function pickSeg(info){

}

    if(near&&!cleaners.some(c=>Math.max(Math.abs(c.x-x),Math.abs(c.y-y))<=2))D.nearSmoke.add(key(x,y));
  }
  for(const o of G.objs)if(o.kind==='d'&&o.type==='booth')for(const[dx,dy]of DIRS){const x=o.x+dx,y=o.y+dy;if(inB(x,y)&&!occ.has(key(x,y)))D.smokeSpots.set(key(x,y),{t:'booth'})}
  for(const d of G.doors)if(d.type==='smokeroom'){const f=frontOf(d);D.smokeSpots.set(key(f.x,f.y),{t:'room',d})}
  for(let y=0;y<G.H;y++)for(let x=0;x<G.W;x++){const k=key(x,y);if(zoneAt(x,y)&&!occ.has(k)&&!seatMap.has(k)&&!frontMap.has(k)&&!D.smokeSpots.has(k))D.smokeSpots.set(k,{t:'zone'})}
}

/* ---------- 経路 ---------- */
function bfsTo(a,goal){
  const W=G.W,H=G.H,sx=clamp(Math.round(a.x),0,W-1),sy=clamp(Math.round(a.y),0,H-1);
  const prev=new Int32Array(W*H).fill(-2),s=sy*W+sx,q=[s];prev[s]=-1;let h=0;
  while(h<q.length){
    const cur=q[h++],cx=cur%W,cy=(cur/W)|0;
    if(goal(cx,cy)){const path=[];let k=cur;while(k!==s){path.push({x:k%W,y:(k/W)|0});k=prev[k]}return path.reverse()}
    for(const[dx,dy]of DIRS){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const nk=ny*W+nx;if(prev[nk]!==-2||occ.has(nk))continue;prev[nk]=cur;q.push(nk)}
  }
  return null;
}
function moveAlong(a,dt){
  let dist=a.speed*dt;
  while(a.path.length&&dist>0){const p=a.path[0],dx=p.x-a.x,dy=p.y-a.y,l=Math.hypot(dx,dy);
    if(l<=dist){a.x=p.x;a.y=p.y;dist-=l;a.path.shift()}else{a.x+=dx/l*dist;a.y+=dy/l*dist;dist=0}}
  return a.path.length===0;
}
const adjGoal=(x0,y0)=>(x,y)=>Math.abs(x-x0)+Math.abs(y-y0)===1;

/* ---------- 客 ---------- */
function addWhy(c,k,d){c.sat+=d;c.why[k]=(c.why[k]||0)+d}
function spawnCust(seg,opt={}){
  const [k,rate]=seg.split('-'),coin=RATE[k][rate].coin,sc=coin/400,lo=rate==='lo';
  const elder=opt.elder??(Math.random()<(lo?0.55:0.12));
  const hunter=opt.hunter??(Math.random()<hunterFrac*(lo?0.4:1));
  const smoker=opt.smoker??(Math.random()<(lo?0.2:0.36));
  const d=doorPos();
  const look=opt.look?Object.assign({},opt.look):{shirt:pick(SHIRTS),hair:elder?pick(['#e5e5e5','#bdbdbd','#9ca3af']):pick(HAIRS),skin:pick(SKINS),cap:hunter?'#1c1c24':null};
  const c={id:++cid,seg,k,rate,coin,sc,elder,hunter,smoker,reg:opt.reg||null,look,
    x:d.x,y:G.H+0.8,path:[{x:d.x,y:d.y}],st:'enter',m:null,speed:elder?0.2:0.3,
    budget:(hunter?rnd(30000,80000):rnd(8000,40000))*sc*(opt.rich?2.5:1),goal:(hunter?rnd(40000,120000):rnd(10000,50000))*sc,
    maxT:hunter?rnd(240,700):lo?rnd(120,360):rnd(60,240),inv:0,won:0,t:0,sat:0,why:{},plan:[],cur:null,wait:0,emote:null,ph:Math.random()*10,
    nextSmoke:smoker?rnd(40,80):1e9,full:false,hidden:false};
  custs.push(c);D.visitors++;D.seg[seg]=(D.seg[seg]||0)+1;if(hunter)D.hunters++;
  return c;
}
function chooseMachine(c){
  const cand=machines().filter(m=>!m.res&&!m.broken&&segOf(m)===c.seg);
  if(!cand.length)return null;
  const ws=cand.map(m=>{
    const s=seatOf(m),z=zoneAt(s.x,s.y);let w;
    if(c.hunter){
      if(c.k==='s')w=5+(todayTargets.has(m)?40+60*S.trust/100:0)+(m.yest&&m.yest.out>m.yest.coin?(D.kiosk?40:15):0)+popEff(m)*0.1;
      else w=4+Math.pow(m.nail+3,2)*6+(todayTargets.has(m)?30:0)+popEff(m)*0.1;
      w=w*w;
    }else{
      w=popEff(m)*(todayTargets.has(m)?1.3:1)*rnd(0.6,1.4);
      if(c.k==='p')w*=1+0.15*m.nail;
    }
    if(c.smoker)w*=z?1.8:0.75;else w*=z?0.12:(D.nearSmoke.has(key(s.x,s.y))?0.7:1);
    if(islandMixed(m))w*=0.75;
    if(trash.has(key(s.x,s.y)))w*=0.7;
    return Math.max(0.01,w);
  });
  let r=Math.random()*ws.reduce((a,b)=>a+b,0);
  for(let i=0;i<cand.length;i++){r-=ws[i];if(r<=0)return cand[i]}
  return cand[cand.length-1];
}
function seek(c){
  if(clock>=LAST){goExit(c);return}
  if(!machines().some(m=>segOf(m)===c.seg)){addWhy(c,'noSeg',-0.2);c.emote={ch:'？',t:25};goExit(c);return}
  const m=chooseMachine(c);
  if(!m){c.full=true;c.emote={ch:'？',t:25};D.full++;if(c.reg)S.regs[c.reg].unmet=true;tweet(c,'full',0.15,1);goExit(c);return}
  const s=seatOf(m),path=bfsTo(c,(x,y)=>x===s.x&&y===s.y);
  if(!path){goExit(c);return}
  m.res=c.id;c.m=m;c.path=path;c.st='toSeat';
}
function onSit(c){
  const m=c.m,s=seatOf(m),z=zoneAt(s.x,s.y),k=key(s.x,s.y);
  c.zone=z;
  if(c.smoker){if(z)addWhy(c,'smokeOk',0.08)}
  else if(z)addWhy(c,'smokeIn',c.elder?-0.38:-0.3);
  else if(D.nearSmoke.has(k))addWhy(c,'smokeDrift',-0.1);
  if(islandMixed(m))addWhy(c,'mix',-0.1);
  if(trash.has(k)){addWhy(c,'dirty',-0.05);trash.delete(k)}
  if(c.k==='p'){
    if(m.nail<=-1){addWhy(c,'nailBad',m.nail===-2?-0.18:-0.08);c.maxT*=m.nail===-2?0.5:0.75}
    else if(m.nail>=1)addWhy(c,'nailGood',m.nail===2?0.12:0.06);
  }
  m.occ=c.id;c.st='play';
  if(c.goto)return;

  else if(c.why.smokeIn)tweet(c,'smokeIn',0.5,2);
  else if(c.why.nailGood&&m.nail===2)tweet(c,'nailGood',0.35,1);
  else if(c.why.nailBad)tweet(c,'nailBad',0.35,1);
  else if(c.why.mix)tweet(c,'mix',0.25,1);
  else if(c.why.smokeDrift)tweet(c,'smokeDrift',0.3,1);
  else if(c.why.smokeOk)tweet(c,'smokeOk',0.2,1);
  else if(m.installDay>=S.day-1&&m.installDay>0)tweet(c,'newm',0.3,1);
  else if(c.hunter&&D.kiosk&&m.yest&&m.yest.out>m.yest.coin)tweet(c,'data',0.3,1);
}
function callStaff(c,type){c.st='call';c.callAt=clock;c.callType=type;c.m.call=true;c.assigned=false;D.calls.push(c);c.emote={ch:'!',t:6}}
function play(c,dt){
  const m=c.m,md=MB[m.type],cin=c.coin*dt;
  if(c.goto){gotoStep(c,dt);return}
  c.inv+=cin;c.t+=dt;S.money+=cin;D.coin+=cin;m.today.coin+=cin;m.today.mins+=dt;
  const hit=md.hit*c.sc,p=c.coin*machR(m)/hit;
  if(Math.random()<1-Math.exp(-p*dt)){
    const pay=Math.round(hit*rnd(0.4,1.6)/100)*100;
    c.won+=pay;S.money-=pay;D.out+=pay;m.today.out+=pay;m.today.hits++;
    m.flash=1.6;c.emote={ch:'！',t:10};floatAt(m.x,m.y,'大当り','#ff2d55');sfx('hit');tweet(c,'hit',0.12,1);
    if(Math.random()<0.1){callStaff(c,'box');return}
  }
  if(Math.random()<dt/450){callStaff(c,'jam');return}
  if(Math.random()<dt/1800*(1+Math.min(2,Math.max(0,S.day-m.installDay)/90))){
    m.broken=true;m.flash=0;D.broken++;addWhy(c,'broken',-0.15);tweet(c,'broken',0.6,2);floatAt(m.x,m.y,'故障','#64748b');sfx('bad');quit(c);return;
  }
  const net=c.won-c.inv;
  if(c.smoker&&!c.zone&&c.t>=c.nextSmoke){startSmoke(c,true);return}
  if(net<-c.budget||c.t>c.maxT||clock>=LAST||(net>c.goal&&Math.random()<0.03*dt))quit(c);
}
function startSmoke(c,mid){
  if(!D.smokeSpots.size){
    addWhy(c,'noSmoke',mid?-0.2:-0.1);tweet(c,'noSmoke',0.3,1);
    if(mid){c.maxT*=0.6;c.nextSmoke=1e9}else nextPlan(c);
    return;
  }
  const path=bfsTo(c,(x,y)=>D.smokeSpots.has(key(x,y)));
  if(!path){addWhy(c,'noSmoke',-0.15);if(mid){c.nextSmoke=1e9}else nextPlan(c);return}
  if(mid){c.m.brk=true;c.m.occ=null}
  c.after=mid?'return':'plan';c.path=path;c.st='toSmoke';
}
function arriveSmoke(c){
  const spot=D.smokeSpots.get(key(Math.round(c.x),Math.round(c.y)));
  if(spot&&spot.t==='room'){c.door=spot.d;c.roomDur=5;tryEnter(c);return}
  c.st='smoking';c.wait=5;c.emote={ch:'~',t:5};
}
function afterRoomOrSmoke(c){
  if(c.after==='return'){
    c.nextSmoke=c.t+rnd(50,90);
    const s=seatOf(c.m),p=bfsTo(c,(x,y)=>x===s.x&&y===s.y);
    if(p){c.path=p;c.st='return'}else{c.m.brk=false;c.m.res=null;c.m=null;goExit(c)}
  }else nextPlan(c);
}
function goRoom(c,door,dur,after){
  const f=frontOf(door),p=bfsTo(c,(x,y)=>x===f.x&&y===f.y);
  if(!p)return false;
  c.path=p;c.st='toRoom';c.door=door;c.roomDur=dur;c.after=after;return true;
}
function tryEnter(c){
  const r=rooms.get(c.door.id);
  if(r&&r.inside<WB[c.door.type].cap){r.inside++;c.path=[insideOf(c.door)];c.st='intoRoom';c.door.anim=clock}
  else{c.st='roomQ';c.qStart=clock}
}
function quit(c){
  const m=c.m;if(m){m.occ=null;m.res=null;m.call=false;m.brk=false;
    const s=seatOf(m);if(Math.random()<0.22*WEATHER[S.weather.today].dirt&&!trash.has(key(s.x,s.y)))trash.set(key(s.x,s.y),{x:s.x,y:s.y});}
  if(c.goto){m&&(m.occ=null,m.res=null);c.m=null;if(!c.caught){D.gotoEsc+=c.loot;news(`ゴト師に${man(c.loot)}抜かれた…（防犯カメラで防げます）`,'bad')}goExit(c);return}
  const net=c.won-c.inv;c.net=net;
  c.sat+=0.08;
  if(net>=30000*c.sc)tweet(c,'bigwin',0.45,2,{v:man(net)});else if(net<-15000*c.sc)tweet(c,'lose',0.25,1,{v:man(-net)});
  if(net>0)addWhy(c,'win',0.4+Math.min(0.2,net/(150000*c.sc)));else addWhy(c,'lose',-Math.min(0.35,-net/(80000*c.sc)));
  if(net>=50000*c.sc&&m)D.bigWins.push({no:m.no,k:kindOf(m),lv:kindOf(m)==='s'?m.set:m.nail,net,seg:c.seg});
  c.emote={ch:net>0?'♪':'…',t:18};c.m=null;
  const plan=[];
  if(clock<LAST){
    if(Math.random()<0.25)plan.push('toilet');
    if(c.smoker&&!c.zone&&Math.random()<0.5)plan.push('smoke');
    if(Math.random()<0.35)plan.push('drink');
    if(net<-20000*c.sc&&Math.random()<0.4)plan.push('rest');
  }
  if(net>0)plan.push('counter');
  c.plan=plan;nextPlan(c);
}
function nearestDoorOfType(c,type){
  const ds=G.doors.filter(d=>d.type===type);if(!ds.length)return null;
  return ds.map(d=>({d,f:frontOf(d)})).sort((a,b)=>(Math.abs(a.f.x-c.x)+Math.abs(a.f.y-c.y))-(Math.abs(b.f.x-c.x)+Math.abs(b.f.y-c.y)))[0].d;
}
function nextPlan(c){
  while(c.plan.length){
    const a=c.plan.shift();
    if(clock>=LAST&&a!=='counter')continue;
    if(a==='toilet'){const d=nearestDoorOfType(c,'toilet');if(d&&goRoom(c,d,8,'plan'))return;addWhy(c,'noToilet',-0.2);tweet(c,'noToilet',0.3,1);continue}
    if(a==='smoke'){startSmoke(c,false);if(c.st==='toSmoke')return;continue}
    if(a==='counter'){
      const open=counters.filter(k=>k.staff);
      if(!open.length){addWhy(c,'noCounter',-0.5);c.emote={ch:'×',t:15};continue}
      const set=new Set(open.map(k=>key(k.o.x,k.o.y)));
      const p=bfsTo(c,(x,y)=>DIRS.some(([dx,dy])=>inB(x+dx,y+dy)&&set.has(key(x+dx,y+dy))));
      if(!p){addWhy(c,'noCounter',-0.5);continue}
      c.path=p;c.cur={a};c.st='walk';return;
    }
    const t=a==='drink'?'vending':'bench';
    const targets=G.objs.filter(o=>o.kind==='d'&&o.type===t);
    if(!targets.length)continue;
    const set=new Set(targets.map(o=>key(o.x,o.y)));
    const p=bfsTo(c,(x,y)=>DIRS.some(([dx,dy])=>inB(x+dx,y+dy)&&set.has(key(x+dx,y+dy))));
    if(!p)continue;
    c.path=p;c.cur={a};c.st='walk';return;
  }
  goExit(c);
}
function arriveAmenity(c){
  const a=c.cur.a;
  if(a==='counter'){
    const cx=Math.round(c.x),cy=Math.round(c.y);
    const k=counters.find(k=>k.staff&&Math.abs(k.o.x-cx)+Math.abs(k.o.y-cy)===1)||counters.find(k=>k.staff);
    if(!k){addWhy(c,'noCounter',-0.5);nextPlan(c);return}
    const dur=Math.max(1.2,(4-k.staff.s.srv*0.5)*(k.help?0.75:1));
    const start=Math.max(clock,k.busyUntil);k.busyUntil=start+dur;
    if(start-clock>6)addWhy(c,'counterWait',-0.1);
    c.wait=k.busyUntil-clock;c.st='wait';return;
  }
  c.wait=a==='drink'?3:12;c.st='wait';
}
function applyAmenity(c){
  const a=c.cur&&c.cur.a;
  if(a==='drink'){S.money+=150;D.drink+=150;c.sat+=0.03;floatAt(c.x,c.y,'+¥150','#16a34a')}
  else if(a==='rest'){addWhy(c,'rest',0.06);c.emote={ch:'♨',t:8}}
  c.cur=null;
}
function goExit(c){
  const p=bfsTo(c,(x,y)=>isEntrance(x,y));
  if(p)c.path=p;else{const d=doorPos();c.x=d.x;c.y=d.y;c.path=[]}
  c.st='exit';
}
function finish(c){
  const i=custs.indexOf(c);if(i>=0)custs.splice(i,1);
  if(c.m){c.m.occ=null;c.m.res=null;c.m.call=false;c.m.brk=false}
  if(c.full||c.goto)return;
  const dirt=trash.size/Math.max(10,machines().length);
  if(dirt>0.2)addWhy(c,'dirty',-Math.min(0.15,dirt*0.2));
  const dr=decorRate();
  if(dr>0.5){addWhy(c,'decorGood',(dr-0.5)*0.4);tweet(c,'decor',0.05,0)}else if(dr<0.2)addWhy(c,'decorBad',(dr-0.2)*0.5);
  D.satSum+=c.sat;D.satN++;
  for(const[k,v]of Object.entries(c.why)){const r=D.reasons[k]||(D.reasons[k]={n:0,sum:0});r.n++;r.sum+=v}
  if(c.reg){
    const st=S.regs[c.reg];st.visited=true;st.daySat=c.sat;
    let top=null,tv=0;for(const[k,v]of Object.entries(c.why))if(Math.abs(v)>tv){tv=Math.abs(v);top=k}
    st.top=top;
  }
}
function stepCust(c,dt){
  if(c.emote){c.emote.t-=dt;if(c.emote.t<=0)c.emote=null}
  switch(c.st){
    case 'enter':if(moveAlong(c,dt))seek(c);break;
    case 'toSeat':if(moveAlong(c,dt))onSit(c);break;
    case 'play':play(c,dt);break;
    case 'call':
      if(clock-c.callAt>14&&!c.twW){c.twW=1;tweet(c,'wait',0.5,2)}
      if(clock-c.callAt>45){addWhy(c,'waitStaff',-0.25);c.served=true;quit(c)}
      else if(clock>=LAST){quit(c)}
      break;
    case 'toSmoke':if(moveAlong(c,dt))arriveSmoke(c);break;
    case 'smoking':c.wait-=dt;if(c.wait<=0)afterRoomOrSmoke(c);break;
    case 'return':if(moveAlong(c,dt)){c.m.brk=false;c.m.occ=c.id;c.st='play'}break;
    case 'toRoom':if(moveAlong(c,dt))tryEnter(c);break;
    case 'roomQ':{
      const r=rooms.get(c.door.id);
      if(r&&r.inside<WB[c.door.type].cap){r.inside++;c.path=[insideOf(c.door)];c.st='intoRoom';c.door.anim=clock}
      else if(clock-c.qStart>6&&!c.qPen){c.qPen=true;addWhy(c,'toiletWait',-0.12)}
      break;}
    case 'intoRoom':if(moveAlong(c,dt)){c.hidden=true;c.st='inRoom';c.wait=c.roomDur}break;
    case 'inRoom':c.wait-=dt;if(c.wait<=0){c.hidden=false;const r=rooms.get(c.door.id);if(r)r.inside--;c.door.anim=clock;c.path=[frontOf(c.door)];c.st='outRoom'}break;
    case 'outRoom':if(moveAlong(c,dt))afterRoomOrSmoke(c);break;
    case 'walk':if(moveAlong(c,dt))arriveAmenity(c);break;
    case 'wait':c.wait-=dt;if(c.wait<=0){applyAmenity(c);nextPlan(c)}break;
    case 'exit':if(moveAlong(c,dt)){c.path=[{x:c.x,y:G.H+0.9}];c.st='out'}break;
    case 'out':if(moveAlong(c,dt))finish(c);break;
  }
}

/* ---------- 店員 ---------- */
function freeAdj(o){
  const opts=DIRS.map(([dx,dy])=>({x:o.x+dx,y:o.y+dy})).filter(p=>inB(p.x,p.y)&&!occ.has(key(p.x,p.y))&&!isEntrance(p.x,p.y));
  return opts.find(p=>!seatMap.has(key(p.x,p.y))&&!frontMap.has(key(p.x,p.y)))||opts[0]||null;
}
function initStaffAgents(){
  const d=doorPos();
  staffA=S.staff.map((s,i)=>({s,role:s.role,x:clamp(d.x+((i%5)-2),0,G.W-1),y:Math.max(0,d.y-1-Math.floor(i/5)),path:[],st:'idle',task:null,t:0,idleT:rnd(2,15),speed:0.7+s.spd*0.08,ph:Math.random()*10}));
  for(const a of staffA){const k=occ.get(key(a.x,a.y));if(k){a.x=d.x;a.y=d.y}}
  let ci=0;
  for(const a of staffA.filter(a=>a.role==='counter')){
    if(ci<counters.length){const k=counters[ci++];k.staff=a;const h=freeAdj(k.o);if(h){a.x=h.x;a.y=h.y}a.st='station';a.home=h}
    else if(counters.length){counters[(ci++)%counters.length].help++;a.st='station'}
  }
}
function stepStaff(a,dt){
  if(a.role==='counter'){if(a.path.length)moveAlong(a,dt);return}
  if(a.st==='go'){if(moveAlong(a,dt)){
    if(a.role==='hall'&&a.fix){if(a.fix.broken){a.st='work';a.t=Math.max(3,7-a.s.srv*0.6)}else{a.fix.fixing=false;a.fix=null;a.st='idle'}}
    else if(a.role==='hall'){if(a.task&&a.task.st==='call'){a.st='work';a.t=Math.max(1,3-a.s.srv*0.35)}else{a.st='idle';a.task=null}}
    else{if(a.task&&trash.has(a.task)){a.st='work';a.t=1.5}else{a.st='idle';a.task=null}}
  }return}
  if(a.st==='work'){a.t-=dt;if(a.t<=0){
    if(a.role==='hall'&&a.fix){a.fix.broken=false;a.fix.fixing=false;floatAt(a.fix.x,a.fix.y,'修理OK','#16a34a');a.fix=null}
    else if(a.role==='hall'&&a.task&&a.task.st==='call'){
      const c=a.task,w=clock-c.callAt;
      if(w<8)addWhy(c,'quickStaff',0.04);else if(w<20)addWhy(c,'slowStaff',-0.04);else if(w<35)addWhy(c,'waitStaff',-0.1);else addWhy(c,'waitStaff',-0.18);
      c.st='play';c.m.call=false;c.emote=null;
    }else if(a.role==='clean'&&a.task)trash.delete(a.task);
    a.st='idle';a.task=null;
  }return}
  // idle
  if(a.role==='hall'){
    const pend=D.calls.filter(c=>c.st==='call'&&!c.assigned);
    if(pend.length){
      pend.sort((p,q)=>(Math.abs(p.x-a.x)+Math.abs(p.y-a.y))-(Math.abs(q.x-a.x)+Math.abs(q.y-a.y)));
      const c=pend[0],s=seatOf(c.m),p=bfsTo(a,(x,y)=>Math.abs(x-s.x)+Math.abs(y-s.y)<=1);
      if(p){c.assigned=true;a.task=c;a.path=p;a.st='go';return}
    }
    const br=machines().find(m=>m.broken&&!m.fixing);
    if(br){const p=bfsTo(a,(x,y)=>Math.abs(x-br.x)+Math.abs(y-br.y)===1);if(p){br.fixing=true;a.fix=br;a.path=p;a.st='go';return}}
    const g=custs.find(c=>c.goto&&c.st==='play'&&!c.caught&&Math.abs(c.x-a.x)+Math.abs(c.y-a.y)<=3);
    if(g&&Math.random()<0.05*dt*(1+a.s.srv*0.2))catchGoto(g,'staff');
  }else if(a.role==='clean'&&trash.size){
    const taken=new Set(staffA.filter(b=>b.role==='clean'&&b.task).map(b=>b.task));
    const p=bfsTo(a,(x,y)=>{const k=key(x,y);return trash.has(k)&&!taken.has(k)});
    if(p){const end=p.length?p[p.length-1]:{x:Math.round(a.x),y:Math.round(a.y)};a.task=key(end.x,end.y);a.path=p;a.st='go';return}
  }
  if(a.path.length){moveAlong(a,dt);return}
  a.idleT-=dt;
  if(a.idleT<=0){
    a.idleT=rnd(12,35);
    const ms=machines();if(!ms.length)return;
    const s=seatOf(pick(ms)),p=bfsTo(a,(x,y)=>Math.abs(x-s.x)+Math.abs(y-s.y)===1&&!seatMap.has(key(x,y)));
    if(p)a.path=p;
  }
}

/* ---------- 1フレームの更新 ---------- */
function update(dt){
  clock+=dt;
  if(clock<LAST-20){
    if(queueLeft>0){queueAcc+=dt;while(queueAcc>=0.5&&queueLeft>0){queueAcc-=0.5;queueLeft--;const c=spawnCust(pickSeg(todayInfo),{hunter:Math.random()<0.75});tweet(c,'queue',0.06,1)}}
    while(regQueue.length&&regQueue[0].t<=clock){
      const {def}=regQueue.shift();
      spawnCust(def.seg,{reg:def.id,hunter:!!def.hunter,smoker:!!def.smoker,elder:!!def.elder,look:def.look,rich:def.rich});
      D.regsVisited.push(def.id);
    }
    if(D.gotoAt&&clock>=D.gotoAt){D.gotoAt=null;spawnGoto()}
    const h=clock/60,shape=h<11?1.4:h<13?0.8:h<17?0.9:h<20?1.35:0.7;
    spawnAcc+=lambdaBase*shape*dt;
    while(spawnAcc>=1){spawnAcc-=1;const c=spawnCust(pickSeg(todayInfo));if(S.weather.today==='rain')tweet(c,'rain',0.05,0);else tweet(c,'enter',0.02,0)}
  }
  for(const c of custs.slice())stepCust(c,dt);
  for(const a of staffA)stepStaff(a,dt);
  if(D.calls.length>40)D.calls=D.calls.filter(c=>c.st==='call');
  if(clock>=CLOSE&&custs.length===0)closeDay();
  else if(clock>=CLOSE+40){custs.slice().forEach(finish);closeDay()}
}

    evr={label:D.evLabel,n:tg.length,avg,judge:j,cls,dT,media};goodEvent=cls==='good';

  const R={day:S.day,date:dateLong(S.day),visitors:D.visitors,full:D.full,hunters:D.hunters,seg:D.seg,coin:D.coin,out:D.out,gross,drink:D.drink,rent,wages,power,ad:D.ad,net,
    rep0,rep1:S.rep,trust0,trust1:S.trust,ev:evr,go:gor,best:byGive[0],worst:byGive[byGive.length-1],voices,regVoices,share:D.shares.me,rivalNews,rivalClosed:D.rivalClosed,
    rankUp:rk1>rk0?RANKS[rk1].n:null,rankNo:rk1+1,money:S.money,avgSat,payR,feel,repairs,interest,brokenN:D.broken,goto:D.goto,gotoCaught:D.gotoCaught,gotoEsc:D.gotoEsc};
  S.hist.push({day:S.day,net:Math.round(net),visitors:D.visitors,rep:S.rep,share:D.shares.me});if(S.hist.length>90)S.hist.shift();
  S.negDays=S.money<0?(S.negDays||0)+1:0;
  dayEndFeatures(R);

  S.weather.today=S.weather.tomorrow;S.weather.tomorrow=rollWeather(S.day+1);

  custs=[];staffA=[];undoStack=[];openSnap=null;

}

  let text=pick(list);if(vars)for(const k in vars)text=text.replace('{'+k+'}',vars[k]);

function camerasCovering(x,y){
  let n=0;
  for(const d of G.doors)if(d.type==='camera'){const f=frontOf(d);if(Math.max(Math.abs(f.x-x),Math.abs(f.y-y))<=5)n++}
  return n;
}
function spawnGoto(){
  const segs=[...new Set(machines().map(segOf))].filter(s=>s.endsWith('hi'));
  if(!segs.length)return;
  const c=spawnCust(pick(segs),{hunter:false,smoker:false,elder:false,look:{shirt:'#1f2937',hair:'#0b0b0b',skin:'#e9c7a5',shades:1}});
  c.goto=true;c.loot=0;c.maxT=rnd(90,160);c.budget=1e9;c.goal=1e9;D.visitors--;
}
function gotoStep(c,dt){
  const m=c.m;
  c.t+=dt;m.today.mins+=dt;
  const loss=1000*dt;S.money-=loss;D.goto+=loss;c.loot+=loss;m.today.out+=loss;
  if(Math.random()<0.2*dt){m.flash=1.2;floatAt(m.x,m.y,'?','#64748b')}
  const s=seatOf(m),p=(0.004+0.035*camerasCovering(s.x,s.y))*dt;
  if(Math.random()<p){catchGoto(c,'camera');return}
  if(c.t>c.maxT||clock>=LAST)quit(c);
}
function catchGoto(c,by){
  if(c.caught)return;
  c.caught=true;D.gotoCaught++;
  const m=c.m;if(m){m.occ=null;m.res=null;m.flash=0}c.m=null;
  c.emote={ch:'!',t:30};c.speed=0.55;
  floatAt(c.x,c.y,'ゴト発見！','#ff2d55');sfx('bad');
  news(`ゴト師を${by==='camera'?'防犯カメラで':'店員が'}発見！（被害${man(c.loot)}で済みました）`,'good');
  S.trust=clamp(S.trust+1,0,100);
  const w=custs.filter(x=>!x.goto&&x.st==='play');if(w.length)tweet(pick(w),'goto',1,3);
  goExit(c);

/* ===== render.js : カメラと描画 ===== */
const cv=$('#cv'),ctx=cv.getContext('2d');
const cam={s:3,x:0,y:0,fit:true};
let dpr=1,floats=[],dirty=true;
let DPR_CAP=2;
let VIEW={w:0,h:0},INSET={t:44,b:10,l:8,r:8};
function markDirty(){dirty=true}
const worldW=()=>G.W*TS+OX*2, worldH=()=>OY+G.H*TS+BOT;
function resizeCanvas(){
  const w=VIEW.w,h=VIEW.h;if(!w||!h)return;
  const wasFit=cam.fit;
  dpr=Math.min(DPR_CAP,window.devicePixelRatio||1);
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  cv.style.width=w+'px';cv.style.height=h+'px';
  if(wasFit)fitCam();else clampCam();
}
function availRect(){return {x:INSET.l*dpr,y:INSET.t*dpr,w:Math.max(50,cv.width-(INSET.l+INSET.r)*dpr),h:Math.max(50,cv.height-(INSET.t+INSET.b)*dpr)}}
const fitScale=()=>{const a=availRect();return Math.min(a.w/worldW(),a.h/worldH())};
const maxScale=()=>Math.max(fitScale()*3.2,7*dpr);
function fitCam(){cam.fit=true;const a=availRect();cam.s=fitScale();cam.x=worldW()/2-(a.x+a.w/2)/cam.s;cam.y=worldH()/2-(a.y+a.h/2)/cam.s}
function clampCam(){
  const a=availRect(),vw=cv.width/cam.s,vh=cv.height/cam.s,ww=worldW(),wh=worldH();
  const fx=worldW()/2-(a.x+a.w/2)/cam.s,fy=worldH()/2-(a.y+a.h/2)/cam.s;
  cam.x=a.w/cam.s>=ww?fx:clamp(cam.x,-a.x/cam.s-16,ww-vw+(cv.width-a.x-a.w)/cam.s+16);
  cam.y=a.h/cam.s>=wh?fy:clamp(cam.y,-a.y/cam.s-16,wh-vh+(cv.height-a.y-a.h)/cam.s+16);
}
function zoomAt(f,sx,sy){
  const ns=clamp(cam.s*f,fitScale()*0.6,maxScale());
  if(Math.abs(ns-cam.s)<1e-6)return;
  cam.fit=false;
  sx=sx??cv.width/2;sy=sy??cv.height/2;
  const wx=cam.x+sx/cam.s,wy=cam.y+sy/cam.s;
  cam.s=ns;cam.x=wx-sx/ns;cam.y=wy-sy/ns;clampCam();
}
function localToWorld(lx,ly){return {x:cam.x+lx*dpr/cam.s,y:cam.y+ly*dpr/cam.s}}
function hitTest(wx,wy){
  const tx=Math.floor((wx-OX)/TS),ty=Math.floor((wy-OY)/TS);
  if(wy>=OY-18&&wy<OY&&tx>=0&&tx<G.W)return {wall:'t',pos:tx};

let AC=null,SFXG=null,BGMG=null,COMP=null,lastHit=0;
function audio(){
  try{
    if(!AC){
      const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;
      AC=new A();
      COMP=AC.createDynamicsCompressor();COMP.threshold.value=-16;COMP.ratio.value=6;
      const lim=AC.createDynamicsCompressor();lim.threshold.value=-3;lim.ratio.value=20;
      COMP.connect(lim);lim.connect(AC.destination);
      SFXG=AC.createGain();SFXG.gain.value=prefs.sfx?0.5:0;SFXG.connect(COMP);
      BGMG=AC.createGain();BGMG.gain.value=prefs.bgm?0.2:0;BGMG.connect(COMP);
    }
    if(AC.state==='suspended')AC.resume();
  }catch(e){return null}
  return AC;
}
function setVolumes(){if(!AC)return;const t=AC.currentTime;SFXG.gain.setTargetAtTime(prefs.sfx?0.5:0,t,0.05);BGMG.gain.setTargetAtTime(prefs.bgm?0.2:0,t,0.1)}
function tone(f,d,{type='square',v=0.1,at=0,to=null,dest=null}={}){
  const a=AC;if(!a)return;const t=a.currentTime+at,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(dest||SFXG);o.start(t);o.stop(t+d+0.03);
}
let noiseBuf=null;
function noise(d,{v=0.1,at=0,hp=1000,dest=null,bp=null}={}){
  const a=AC;if(!a)return;
  if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate*0.5,a.sampleRate);const ch=noiseBuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1}
  const t=a.currentTime+at,s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=noiseBuf;f.type=bp?'bandpass':'highpass';f.frequency.value=bp||hp;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  s.connect(f);f.connect(g);g.connect(dest||SFXG);s.start(t);s.stop(t+d+0.02);
}

const NOTE={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
function nf(n){const m=n.match(/^([A-G][#b]?)(\d)$/);if(!m)return 0;return 440*Math.pow(2,(NOTE[m[1]]+(+m[2]+1)*12-69)/12)}
function parseLine(s){return s.trim().split(/\s+/)}
const TRACKS={
  prep:{bpm:132,lead:'square',lv:0.055,arp:false,
    L:'G5 - B5 - D6 - B5 G5 A5 - F#5 - D5 - . A5 B5 - G5 - E5 - G5 B5 C6 - B5 - A5 - G5 - G5 B5 D6 - E6 D6 B5 - A5 - D6 - F#5 - A5 - G5 - E5 - C6 - B5 A5 G5 - - - D5 E5 F#5 -',

    C:['C','G','Am','F','C','G','F','G'],stab:'..x...x...x...x.',drum:'k.hhs.hhk.hhs.hk'},
  event:{bpm:164,lead:'square',lv:0.055,arp:true,
    L:'D6 - A5 - F#5 A5 D6 E6 C#6 - A5 - E5 A5 C#6 E6 D6 - B5 - F#5 B5 D6 F#6 G6 - D6 - B5 - G5 - A5 A5 D6 - A5 A5 E6 - F#6 - E6 - C#6 - A5 - B5 - D6 - G6 - F#6 E6 E6 - C#6 - A5 B5 C#6 E6',
    C:['D','A','Bm','G','D','A','G','A'],stab:'x..x..x.x..x..x.',drum:'k.hhs.hkk.hhs.hs'},
  grand:{bpm:172,lead:'square',lv:0.06,arp:true,dbl:true,
    L:'F5 - A5 - C6 - F6 - E6 - C6 - G5 - C6 - D6 - A5 - F5 - A5 D6 D6 - Bb5 - F5 - Bb5 D6 F6 - E6 F6 G6 - F6 - E6 - D6 C6 - G5 - - D6 - F6 - Bb5 - D6 - C6 - E6 - G6 - - -',
    C:['F','C','Dm','Bb','F','C','Bb','C'],stab:'x.x...x.x.x...x.',drum:'kkh.s.hkk.h.s.hs'},
};
const CHQ={'':[0,4,7],m:[0,3,7],'7':[0,4,7,10]};
function chordFreqs(name,oct){const m=name.match(/^([A-G][#b]?)(m|7)?$/);const root=NOTE[m[1]];return CHQ[m[2]||''].map(i=>440*Math.pow(2,(root+i+(oct+1)*12-69)/12))}
function rootFreq(name,oct,add){const m=name.match(/^([A-G][#b]?)/);return 440*Math.pow(2,(NOTE[m[1]]+(add||0)+(oct+1)*12-69)/12)}
for(const t of Object.values(TRACKS)){t.Lt=parseLine(t.L)}
let bgm={cur:null,step:0,next:0,gain:null,timer:null};
function playBgm(name){
  if(!TRACKS[name])return;
  if(bgm.cur===name&&bgm.gain)return;
  bgm.want=name;
  if(!prefs.bgm||!audio())return;
  const t=AC.currentTime;
  if(bgm.gain){const g=bgm.gain;g.gain.setTargetAtTime(0.0001,t,0.25);setTimeout(()=>{try{g.disconnect()}catch(e){}},1500)}
  const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.setTargetAtTime(1,t+0.05,0.3);g.connect(BGMG);
  bgm.gain=g;bgm.cur=name;bgm.step=0;bgm.next=AC.currentTime+0.1;
  if(!bgm.timer)bgm.timer=setInterval(bgmTick,30);
}
function stopBgm(){if(bgm.gain&&AC){bgm.gain.gain.setTargetAtTime(0.0001,AC.currentTime,0.2)}bgm.cur=null;bgm.gain=null}
function bgmTick(){
  if(!AC||!bgm.cur||!bgm.gain||AC.state!=='running')return;
  const tr=TRACKS[bgm.cur],dt=60/tr.bpm/4,dest=bgm.gain,bars=tr.C.length;
  while(bgm.next<AC.currentTime+0.15){
    const st=bgm.step,at=Math.max(0,bgm.next-AC.currentTime),s16=st%16,bar=Math.floor(st/16)%bars,ch=tr.C[bar];
    if(s16%2===0){
      const i=(bar*8+s16/2)%tr.Lt.length,n=tr.Lt[i];
      if(n!=='-'&&n!=='.'){let len=1;while(tr.Lt[(i+len)%tr.Lt.length]==='-'&&len<8)len++;
        const f=nf(n);tone(f,dt*2*len*0.9,{type:tr.lead,v:tr.lv,at,dest});if(tr.dbl)tone(f/2,dt*2*len*0.9,{type:'sawtooth',v:tr.lv*0.35,at,dest})}
      const bp=[0,null,12,null,7,null,12,7][s16/2];
      if(bp!==null)tone(rootFreq(ch,2,bp),dt*1.7,{type:'triangle',v:0.15,at,dest});
    }
    if(tr.stab[s16]==='x')for(const f of chordFreqs(ch,4))tone(f,dt*0.9,{type:'square',v:0.018,at,dest});
    if(tr.arp){const cf=chordFreqs(ch,5);tone(cf[st%cf.length],dt*0.8,{type:'triangle',v:0.022,at,dest})}
    const d=tr.drum[s16];
    if(d==='k')tone(150,0.12,{type:'sine',v:0.3,at,to:45,dest});
    else if(d==='s'){noise(0.1,{v:0.12,at,bp:1800,dest});noise(0.05,{v:0.05,at,hp:6000,dest})}
    else if(d==='h')noise(0.03,{v:0.045,at,hp:7500,dest});
    bgm.step++;bgm.next+=dt;
  }
}

let ROT=0;
function readSafe(){const cs=getComputedStyle($('#probe'));return {t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0}}
function applyLayout(){
  const vw=window.innerWidth,vh=window.innerHeight,portrait=vh>vw,root=$('#root'),sa=readSafe();
  ROT=prefs.rot==='off'||!portrait?0:prefs.rot==='flip'?-90:90;
  let w=vw,h=vh,ins;
  if(ROT){w=vh;h=vw;root.style.transform=ROT===90?'rotate(90deg) translateY(-100%)':'rotate(-90deg) translateX(-100%)';
    ins=ROT===90?{l:sa.t,r:sa.b,t:0,b:0}:{l:sa.b,r:sa.t,t:0,b:0}}
  else{root.style.transform='none';ins={l:sa.l,r:sa.r,t:sa.t,b:sa.b}}
  root.style.width=w+'px';root.style.height=h+'px';
  const st=document.documentElement.style;st.setProperty('--sl',ins.l+'px');st.setProperty('--sr',ins.r+'px');st.setProperty('--st',ins.t+'px');st.setProperty('--sb',ins.b+'px');
  const land=w>=h;document.documentElement.classList.toggle('L',land);document.documentElement.classList.toggle('P',!land);document.documentElement.classList.toggle('rot',!!ROT);
  VIEW={w,h};
  const prep=S&&S.phase!=='open';
  INSET=land?{t:44+ins.t,b:(prep?56:10)+ins.b,l:8+ins.l,r:8+ins.r}:{t:150+ins.t,b:(prep?108:56)+ins.b,l:6,r:6};
  resizeCanvas();

function toLocal(cx,cy){if(ROT===90)return {x:cy,y:window.innerWidth-cx};if(ROT===-90)return {x:window.innerHeight-cy,y:cx};return {x:cx,y:cy}}
function toLocalD(dx,dy){if(ROT===90)return {x:dy,y:-dx};if(ROT===-90)return {x:-dy,y:dx};return {x:dx,y:dy}}
/* 回転中はシートを指でスクロール */
(function(){
  const b=$('#sheetBody');let st=null,vel=0,raf=0;
  b.addEventListener('pointerdown',e=>{if(!ROT)return;cancelAnimationFrame(raf);st={x:e.clientX,y:e.clientY,moved:false,t:performance.now()};vel=0});
  b.addEventListener('pointermove',e=>{if(!ROT||!st)return;const d=toLocalD(e.clientX-st.x,e.clientY-st.y);
    if(!st.moved&&Math.abs(d.y)>6)st.moved=true;
    if(st.moved){b.scrollTop-=d.y;const now=performance.now();vel=d.y/Math.max(1,now-st.t);st.t=now;st.x=e.clientX;st.y=e.clientY}});
  const end=()=>{if(!st)return;const moved=st.moved;st=null;if(moved){b._drag=performance.now();let v=vel*16;const step=()=>{if(Math.abs(v)<0.5)return;b.scrollTop-=v;v*=0.93;raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)}};
  b.addEventListener('pointerup',end);b.addEventListener('pointercancel',end);
  b.addEventListener('click',e=>{if(b._drag&&performance.now()-b._drag<80){e.stopPropagation();e.preventDefault()}},true);
})();

const itemName=it=>it.kind==='m'?MB[it.type].name:it.kind==='d'?DB[it.type].name:WB[it.type].name;
const itemPrice=it=>it.kind==='m'?MB[it.type].price:it.kind==='d'?DB[it.type].price:WB[it.type].price;
function startBuild(kind,type,store){buildItem={kind,type,store:!!store};buildDir=0;tool='build';moveSel=null;closeSheet();renderDock();toast(kind==='w'?'壁か、壁ぎわのマスをタップ':'置きたいマスをタップ')}
function tryPlace(hit){
  const it=buildItem,price=it.store?0:itemPrice(it);
  let sIdx=-1;
  if(it.store){sIdx=S.storage.findIndex(s=>s.kind===it.kind&&s.type===it.type);if(sIdx<0){tool='view';renderDock();return}}
  if(S.money<price){toast('お金が足りません');sfx('bad');return}
  if(it.kind==='w'){
    const slot=hit.wall?{side:hit.wall,pos:hit.pos}:doorSlotFor(hit.x,hit.y);
    if(!slot){toastAt('壁か、壁ぎわのマスをタップしてください',hit.x,hit.y);sfx('bad');return}
    const d={type:it.type,side:slot.side,pos:slot.pos},why=validate(G.objs,[...G.doors,d]);
    if(why){toast(why);sfx('bad');return}
    pushUndo();S.money-=price;G.renoSpend+=price;d.id=S.nid++;G.doors.push(d);
    if(sIdx>=0)S.storage.splice(sIdx,1);
    const f=frontOf(d);floatAt(f.x,f.y,price?'-'+yen(price):'設置','#ffcf3a');
  }else{
    if(hit.wall){toast('床のマスをタップしてください');sfx('bad');return}
    let o;
    if(it.kind==='m'){
      const src=sIdx>=0?S.storage[sIdx]:{};
      o=newMachine(it.type,hit.x,hit.y,buildDir,{rate:src.rate||'hi',set:src.set,nail:src.nail,installDay:src.installDay??S.day});
      if(MB[it.type].k==='s'&&!o.set)o.set=1;
    }else o={kind:'d',type:it.type,x:hit.x,y:hit.y};
    const why=validate([...G.objs,o],G.doors);
    if(why){toastAt(why,hit.x,hit.y);sfx('bad');return}
    pushUndo();S.money-=price;G.renoSpend+=price;
    if(sIdx>=0)S.storage.splice(sIdx,1);
    addObj(o);floatAt(hit.x,hit.y,price?'-'+yen(price):'設置','#ffcf3a');
  }
  layoutChanged();sfx('place');save();
  if(it.store&&!S.storage.some(s=>s.kind===it.kind&&s.type===it.type)){tool='view';buildItem=null;toast('倉庫の分を置き終わりました')}
  refreshAll();
}
const sellPrice=o=>Math.round(itemPrice(o.side?{kind:'w',type:o.type}:o)*0.5/1000)*1000;
function removeThing(o,mode){
  pushUndo();
  if(o.side){G.doors=G.doors.filter(d=>d!==o);if(mode==='store')toStorage({kind:'w',type:o.type});else S.money+=sellPrice(o)}
  else{G.objs=G.objs.filter(x=>x!==o);if(mode==='store')toStorage(o);else S.money+=sellPrice(o)}
  if(moveSel===o)moveSel=null;
  const p=o.side?frontOf(o):o;

  layoutChanged();sfx('cash');save();refreshAll();
}
function rotateM(m){
  for(let k=1;k<=3;k++){
    const nd=(m.dir+k)%4,cand=G.objs.map(o=>o===m?{...o,dir:nd}:o);
    if(!validate(cand,G.doors)){pushUndo();m.dir=nd;layoutChanged();save();sfx('place');return true}
  }
  toast('向きを変えられるすき間がありません');sfx('bad');return false;
}
function moveTap(hit){
  const door=hit.wall?G.doors.find(d=>d.side===hit.wall&&d.pos===hit.pos):frontMap.get(key(hit.x,hit.y));
  let o=hit.wall?null:occ.get(key(hit.x,hit.y));
  if(!moveSel){
    if(!o&&!hit.wall)o=seatMap.get(key(hit.x,hit.y));
    const t=o||door;if(t){moveSel=t;sfx('tap');renderDock()}return;
  }
  if(moveSel.side){
    if(door===moveSel){moveSel=null;renderDock();return}
    if(o){moveSel=o;renderDock();return}
    const slot=hit.wall?{side:hit.wall,pos:hit.pos}:doorSlotFor(hit.x,hit.y);
    if(!slot){toast('壁か、壁ぎわのマスをタップしてください');sfx('bad');return}
    const cand=G.doors.map(d=>d===moveSel?{...d,side:slot.side,pos:slot.pos}:d),why=validate(G.objs,cand);
    if(why){toast(why);sfx('bad');return}
    pushUndo();moveSel.side=slot.side;moveSel.pos=slot.pos;layoutChanged();sfx('place');save();refreshAll();return;
  }
  if(hit.wall){if(door){moveSel=door;renderDock()}return}
  const group=moveIsland&&moveSel.kind==='m'?islandOf(moveSel).ms:[moveSel],gset=new Set(group);
  if(o===moveSel){moveSel=null;renderDock();return}
  if(o&&!gset.has(o)){moveSel=o;sfx('tap');renderDock();return}
  const dx=hit.x-moveSel.x,dy=hit.y-moveSel.y;
  const cand=G.objs.map(ob=>gset.has(ob)?{...ob,x:ob.x+dx,y:ob.y+dy}:ob),why=validate(cand,G.doors);
  if(why){toastAt(why,hit.x,hit.y);sfx('bad');return}
  pushUndo();group.forEach(ob=>{ob.x+=dx;ob.y+=dy});layoutChanged();sfx('place');save();refreshAll();
}
function zoneTap(hit){
  if(hit.wall)return;
  const tiles=[];
  if(zoneIsland){
    const o=occ.get(key(hit.x,hit.y))||seatMap.get(key(hit.x,hit.y));
    if(o&&o.kind==='m'){for(const m of islandOf(o).ms){tiles.push({x:m.x,y:m.y});tiles.push(seatOf(m))}}
    else{toast('台をタップしてください');return}
  }else tiles.push({x:hit.x,y:hit.y});
  pushUndo();tiles.forEach(t=>{if(inB(t.x,t.y))G.zone[key(t.x,t.y)]=zoneBrush});
  sfx('tap');save();
}

    h+=`<div class="lbl">壁</div>`+WALLS.map(x=>{const own=G.ownedWalls.includes(x.id),cur=G.wall===x.id;return row(`linear-gradient(90deg,${x.c} 50%,${x.d} 50%)`,x.name,`内装＋${x.appeal}`,cur?'<span class="sub">使用中</span>':`<button class="btn sm" data-act="wall" data-id="${x.id}" type="button">${own?'使う':yen(x.price)}</button>`)}).join('');

    h+=gs.map(g=>{const it=S.storage[g.idx[0]],gift=g.idx.some(i=>S.storage[i].gift);return row(it.kind==='m'?MB[it.type].c:SWATCH[it.type],`${esc(storageName(it))} ×${g.idx.length}`,`${it.kind==='m'?KIND_NAME[MB[it.type].k]+'の台':it.kind==='w'?'壁に付ける設備':'床に置く設備'}${gift?'・新築プレゼント':''}`,`<div class="col"><button class="btn sm" data-act="store-place" data-k="${it.kind}" data-id="${it.type}" type="button">置く</button><button class="btn sm ghost" data-act="store-sell" data-k="${it.kind}" data-id="${it.type}" type="button">売る ${yen(storageValue(it))}</button></div>`)}).join('');

    const cw=(G.W+2)*G.H-G.W*G.H,ch=G.W*(G.H+2)-G.W*G.H;
    h+=row('#a855f7','横に2マス広げる',`${G.W+2}×${G.H}マスに。家賃が増えます`,G.W+2>G.maxW?'<span class="sub">上限</span>':`<button class="btn sm" data-act="expand" data-v="w" type="button">${yen(cw*pt)}</button>`);
    h+=row('#a855f7','奥に2マス広げる',`${G.W}×${G.H+2}マスに。家賃が増えます`,G.H+2>G.maxH?'<span class="sub">上限</span>':`<button class="btn sm" data-act="expand" data-v="h" type="button">${yen(ch*pt)}</button>`);
    h+=`<div class="sub">もっと大きな店は「経営 → 物件」から。今の台や設備は倉庫に入れて持っていけます。</div>`;

/* ---------- 設定一覧 ---------- */
function scopeMachines(sc){
  const ms=machines();
  if(sc==='all')return ms;if(sc==='p'||sc==='s')return ms.filter(m=>kindOf(m)===sc);
  if(sc==='ev')return eventTargets();
  return (islands.find(i=>i.label===sc)||{ms:[]}).ms;
}
function listSheet(scope){
  scope=scope||'all';const prep=S.phase==='prep',ms=machines();
  const tg=new Set(S.event.type!=='none'?eventTargets():[]);

  if(prep){

    h+=`<div class="lbl">まとめて変える範囲</div>`+tabs(sc,scope,'ls-scope');

    if(hasP)h+=`<div class="bulk"><span class="lbl">パチンコ釘</span><div class="setrow small">${[-2,-1,0,1,2].map(v=>`<button class="sbtn n${v+2} wide" data-act="ls-bulk-p" data-v="${v}" type="button">${NAIL_SHORT[v+2]}</button>`).join('')}</div></div>`;
    h+=`<div class="chips"><button class="chip" data-act="ls-rate" data-v="hi" type="button">高レートにする</button><button class="chip" data-act="ls-rate" data-v="lo" type="button">低レートにする</button><button class="chip" data-act="ls-rand" type="button">低めにばらばら</button></div>`;
  }
  for(const isl of islands){

    for(const m of isl.ms){
      const t=S.phase==='open'?m.today:m.yest,lab=S.phase==='open'?'今日':'昨日';

  if(ev.type==='island')h+=`<div class="lbl">どの島？</div><div class="chips">${islands.map(i=>`<button class="chip ${ev.target===i.label?'cur':''}" data-act="ev-target" data-v="${i.label}" type="button">${i.label}島（${i.ms.length}台）</button>`).join('')}</div>`;

  if(ev.type==='model'){const ids=[...new Set(ms.map(m=>m.type))];h+=`<div class="lbl">どの機種？</div><div class="chips">${ids.map(id=>`<button class="chip ${ev.target===id?'cur':''}" data-act="ev-target" data-v="${id}" type="button">${esc(MB[id].name)}（${ms.filter(m=>m.type===id).length}台）</button>`).join('')}</div>`}
  if(ev.type==='media'){
    h+=`<div class="lbl">どこに取材してもらう？</div><div class="chips">${[['mag',`パチンコ雑誌（${man(MEDIA_COST.mag)}）`,1],['tube',`人気配信者（${man(MEDIA_COST.tube)}）`,3]].map(([k,l,r])=>`<button class="chip ${ev.target===k?'cur':''}" data-act="ev-target" data-v="${k}" ${rankNo()<r?'disabled':''} type="button">${l}${rankNo()<r?`（ランク${r}）`:''}</button>`).join('')}</div>`;

    h+=`<div class="box col"><div>取材では<b>お店全体の出し具合</b>が見られます。いま <b>${Math.round(avg*100)}%</b></div><div>このままだと… <span class="verdict ${cls}">${j}</span></div><div>客足の見込み <b>×${eventMultToday().toFixed(2)}</b>・設定狙いの客が多く来ます</div><div class="sub">${ev.target==='tube'?'配信は影響が大きく、良くも悪くも評判が大きく動きます':'雑誌はほどほどの影響です'}</div></div>
<div class="actions"><button class="btn sm" data-act="ev-fill-all" data-v="hi" type="button">全台を高めに</button><button class="btn sm" data-act="go-list" type="button">設定一覧を開く</button></div>`;

    const tgs=eventTargets();

      h+=`<div class="box col"><div>対象 <b>${tgs.length}台</b> ・ 出し具合 <b>${Math.round(avg*100)}%</b></div>

<div class="sub">${cls==='good'?'約束どおり。信用が上がります':cls==='mid'&&j==='まずまず'?'少し信用が上がります':'信用が下がります。対象台の設定や釘を上げましょう'}</div>

${recentEvents()?'<div class="sub neg">最近イベントが続いているので効果が下がっています</div>':''}

  return [`${dateLong(S.day)}のイベント`,h];
}

  }

  h+=`<table class="mt money"><tr><td>貸し玉・メダルの売上</td><td>${yen(R.coin)}</td></tr><tr><td>払い出し（客の勝ち分）</td><td class="neg">-${yen(R.out)}</td></tr><tr><td>自販機</td><td>${yen(R.drink)}</td></tr><tr><td>家賃</td><td class="neg">-${yen(R.rent)}</td></tr><tr><td>店員の給料</td><td class="neg">-${yen(R.wages)}</td></tr><tr><td>電気代</td><td class="neg">-${yen(R.power)}</td></tr>${R.ad?`<tr><td>告知・取材費</td><td class="neg">-${yen(R.ad)}</td></tr>`:''}${R.repairs?`<tr><td>夜間の修理費（${R.repairs/15000}台）</td><td class="neg">-${yen(R.repairs)}</td></tr>`:''}${R.interest?`<tr><td>借入の利息</td><td class="neg">-${yen(R.interest)}</td></tr>`:''}${R.goto?`<tr><td>ゴト被害</td><td class="neg">-${yen(R.goto)}</td></tr>`:''}<tr class="total"><td>今日の利益</td><td class="${R.net>=0?'pos':'neg'}">${sgn(R.net)}</td></tr></table>`;
  const dr=R.rep1-R.rep0,fl=R.feel>=1?['よく出る店','pos']:R.feel<=-1?['出ない店','neg']:['ふつう',''];
  h+=`<div class="box">出玉率 <b>${Math.round(R.payR*100)}%</b>　お客さんの体感：<b class="${fl[1]}">${fl[0]}</b></div>`;
  h+=`<div class="box">評判 <b>${Math.round(R.rep0)} → ${Math.round(R.rep1)}</b> <span class="${dr>=0?'pos':'neg'}">(${dr>=0?'+':''}${dr.toFixed(1)})</span>　信用 <b>${R.trust1}</b>　資金 <b class="${R.money<0?'neg':''}">${yen(R.money)}</b></div>`;
  if(R.money<0)h+=`<div class="box neg">資金がマイナスです。7日続くと倒産します。台や設備を売るか、設定を見直しましょう。</div>`;
  if(R.best&&R.best.yest){const g=m=>m.yest.out-m.yest.coin,lv=m=>kindOf(m)==='s'?`設定${m.set}`:`釘${NAIL_SHORT[m.nail+2]}`;h+=`<div class="box stats"><span>いちばん出た台：<b>${R.best.no}番</b>（${lv(R.best)}・客${sgn(g(R.best))}）</span><span>いちばん吸った台：<b>${R.worst.no}番</b>（${lv(R.worst)}・客${sgn(g(R.worst))}）</span></div>`}
  if(R.regVoices.length)h+=`<div class="lbl">常連さんの声</div>`+R.regVoices.map(v=>`<div class="voice ${v.good?'':'bad'}"><b>${esc(v.name)}</b>「${esc(v.say)}」</div>`).join('');
  if(R.voices.length)h+=`<div class="lbl">お客さんの声</div>`+R.voices.map(v=>`<div class="voice ${v.good?'':'bad'}">${esc(WHY[v.k].t)}<span class="cnt">${v.n}人</span></div>`).join('');
  if(R.rivalNews.length)h+=`<div class="sub">今日は${R.rivalNews.map(esc).join('・')}もイベントでした</div>`;

  if(R.goals&&R.goals.length)h+=R.goals.map(g=>`<div class="rankup">目標達成「${esc(g.name)}」<br><span>ボーナス ${man(g.reward)}</span></div>`).join('');
  if(R.year)h+=`<div class="box col"><div class="lbl">${R.year.year-1}年度 年間ランキング</div>${R.year.rows.map((r,i)=>`<div>${i+1}位 ${r.me?'<b>':''}${esc(r.name)}${r.me?'</b>':''}（シェア${Math.round(r.share*100)}%）</div>`).join('')}${R.year.bonus?`<div class="pos">賞金 ${man(R.year.bonus)}</div>`:''}</div>`;
  if(R.morning&&R.morning.length)h+=R.morning.map(m=>`<div class="box neg">${esc(m.title)}：${esc(m.sub)}</div>`).join('');
  if(R.rankUp)h+=`<div class="rankup">ランクアップ！ ランク${R.rankNo}「${esc(R.rankUp)}」<br><span>新しい台・設備・物件が解放されました</span></div>`;
  const t=R.tomorrow;
  h+=`<div class="box tmr"><b>明日 ${dateLong(R.day+1)}</b>　${WEATHER[t.weather].name}${t.info.tags.length?'・'+t.info.tags.join('・'):''}${t.go?'・オープン期間':''}${t.rivals.length?`<br><span class="neg">${t.rivals.map(esc).join('・')}がイベント予定</span>`:''}</div>`;
  h+=`<button class="btn primary" data-act="close" type="button">明日の準備へ</button>`;
  return [`${R.date}の日報`,h];
}
function onDayClosed(R){
  closeSheet();tool='view';moveSel=null;releaseWake();
  sfx('close');playBgm('prep');refreshAll();openSheet('report',R);
  setTimeout(()=>{
    if(R.go&&R.go.final){R.go.final.cls==='bad'?(sfx('gagan'),telop(R.go.final.judge,'オープン期間の評価','bad')):(sfx('fanfare'),telop(R.go.final.judge,'オープン期間の評価','good'))}
    else if(R.ev){R.ev.cls==='bad'?sfx('gagan'):sfx('stamp')}
    else if(R.go)sfx('stamp');
    if(R.rankUp){setTimeout(()=>{sfx('fanfare');telop('ランクアップ！',R.rankUp,'good')},R.go&&R.go.final?2000:300)}
    if(R.rivalClosed){setTimeout(()=>telop('ライバル閉店！',R.rivalClosed+'が閉店しました','good'),R.rankUp?4200:2200)}
  },350);
  applyLayout();
  pendingEnding=R.ending||null;pendingMorning=R.morning||[];
}

<ul><li><b>釘はお客さんに見えます。</b>締めた台はすぐ見切られ、開けた台にはパチプロが集まります。</li><li><b>設定は見えません。</b>スロット客はイベントや前日の出方で台を選びます。</li><li><b>レート</b>：4円/1円パチ、20円/5円スロ。低レートは売上が1/4ですが、年配や学生のお客さんが来てくれます。</li><li>同じ島にパチンコとスロットを混ぜると、音がうるさいと不満が出ます。</li></ul>`],
  ev:['イベント',`<ul><li><b>島の全台系</b>：その島の全台を出すという約束。</li><li><b>末尾の日</b>：台番号の最後の数字が同じ台を出す約束。台番号は4と9を飛ばして自動で振られます。</li><li><b>機種イベント</b>：その機種の全台を出す約束。</li><li><b>新台入替</b>：新しい台を3台以上入れると打てます。</li><li><b>リニューアルオープン</b>：改装に100万円以上使い、前のオープンから21日たつと打てます。</li></ul>
<h3>判定</h3><p>対象台の出し具合が80%以上で「激アツ」、40%未満で「ガセ」。信用が上下します。信用が高いほど、イベントの日に朝から行列ができます。</p>
<h3>オープン期間の判定</h3><p>グランドオープン（3日）とリニューアル（2日）は、全台の出し具合と満足度で毎日採点されます。期間の平均が悪いと、信用と評判が大きく下がり、しばらく客付きが悪くなります。</p>
<h3>客足の波</h3><p>土日・祝日・ゴールデンウィーク・お盆・年末年始は客が多く、年金支給日（偶数月15日）は1円パチの年配客、給料日（25日）は高レートの客が増えます。雨の日は少し増えますが、床が汚れやすくなります。</p>`],
  shop:['店づくり',`<ul><li><b>島</b>：くっついて並んだ台のかたまり。自動でA島・B島…と名前がつきます。</li><li>台は「客席の向き」を決めて置きます。通路がふさがる置き方はできません。</li><li><b>トイレと喫煙室は壁に付きます</b>。マスを使わず、お客さんは扉から出入りします。</li><li><b>たばこゾーン</b>：床を「喫煙OK」に塗れます。たばこを吸う客は喫煙OK席を喜び、吸わない客は嫌がります。喫煙OKの隣の禁煙席は「煙が流れてくる」と不満になります。空気清浄機で防げます。</li><li>禁煙席のたばこ客は、途中で喫煙所（ブース・喫煙室・喫煙OKの通路）へ吸いに行きます。どこにもないと不満です。</li><li>内装の★が多いほど満足度と客足が上がります。</li><li>「片付け」で売るか倉庫にしまえます。倉庫の物は無料で置き直せます。</li></ul>`],
  people:['店員と常連',`<ul><li><b>ホール係</b>：呼び出しランプに対応します。台12台につき1人が目安。足りないとお客さんが待たされて不満になります。</li><li><b>カウンター係</b>：景品カウンター1つに1人必要。いないと勝ったお客さんが交換できません。</li><li><b>清掃係</b>：床のゴミを片付けます。汚い店は満足度が下がります。</li><li>店員は「速さ」と「接客」が高いほど優秀です。研修でレベルを上げられます。</li></ul>
<h3>名物常連客</h3><p>頭に★がついているのは名前つきの常連さんです。好きなことと苦手なことがあり、満足するほど通ってくれます。不満が続くと来なくなります。</p>`],
  biz:['物件とライバル',`<ul><li>町には<b>ライバル店</b>があり、お客さんを取り合っています。評判・台数・イベントでシェアが決まります。</li><li>ライバル店がイベントの日は、お客さんを取られやすくなります。</li><li>シェアを奪われ続けたライバル店は閉店し、<b>居抜き物件</b>として売りに出ることがあります。</li><li><b>物件</b>：今の店を広げるほか、居抜き物件や、更地に新築（マス数で値段が決まる）で移転できます。新築には設備のプレゼントがつきます。</li><li>移転すると今の店は売却され、台と設備は倉庫に入ります。新しい店はグランドオープンから。</li><li>毎日の経費は家賃・店員の給料・電気代です。資金のマイナスが7日続くと倒産します。</li><li><b>銀行</b>（経営 → 銀行）でお金を借りられます。利息は毎日かかります。</li></ul>`],
  more:['規制・取材・トラブル',`<h3>規制</h3><p>ときどき国の規制が発表され、対象の機種は期限までに撤去されます（期限を過ぎると自動で撤去・下取りなし）。代わりに「新基準」の新しい機種が買えるようになります。</p>
<h3>取材イベント</h3><p>雑誌や人気配信者に取材してもらうと、たくさんのお客さんが来ます。お店全体の出し具合が見られ、良ければ大きく信用が上がり、悪ければ大きく下がります。</p>
<h3>データ公開機</h3><p>台の成績を公開すると設定狙いの客が増え、出し方の評判が大きく動きます。</p>
<h3>台の故障</h3><p>古い台ほど故障しやすく、ホール係が直します。閉店までに直らなかった台は夜間に修理費がかかります。</p>
<h3>ゴト師</h3><p>不正な道具で玉を抜く客です。サングラスが目印。壁に付ける防犯カメラと、近くを見回るホール係が見つけます。</p>
<h3>目標とエンディング</h3><p>経営 → 目標 で、達成するとボーナスがもらえる目標が見られます。2029年3月31日までにランク5「伝説のホール」になればエンディング。毎年3月31日には年間ランキングも発表されます。</p>`],
};

    case 'o-move':{const t=sheetData.m||sheetData;closeSheet();tool='move';moveIsland=false;moveSel=t;renderDock();toast(t.side?'新しい壁の場所をタップ':'移動先のマスをタップ');break}

        else if(a==='ls-rate'){m.rate=v;n++}

    case 'go-list':openSheet('list','all');break;
    case 'ev-type':{const t=b.dataset.t,ev=S.event;ev.type=t;ev.target=null;
      if(t==='island'&&islands[0])ev.target=islands[0].label;

      sfx('tap');save();refreshAll();break}

    case 'st-fire':{const s=findStaff(id);if(s){S.staff=S.staff.filter(x=>x!==s);sfx('tap');toast(`${s.name}さんがやめました`);save();refreshAll()}break}
    case 'st-train':{const s=findStaff(id);if(!s)break;const c=trainCost(s);if(S.money<c){toast('お金が足りません');sfx('bad');break}

    case 'nb-loc':sheetData={tab:'prop',nb:Object.assign({},sheetData&&sheetData.nb||{loc:'jutaku',size:0},{loc:v})};renderSheet();break;
    case 'nb-size':sheetData={tab:'prop',nb:Object.assign({},sheetData&&sheetData.nb||{loc:'jutaku',size:0},{size:Number(v)})};renderSheet();break;

    case 'g-tab':sheetData=v;renderSheet();$('#sheetBody').scrollTop=0;break;
    case 'menu-guide':openSheet('guide','start');break;

const pdist=()=>{const p=[...ptrs.values()];return Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)};
const pmid=()=>{const p=[...ptrs.values()],l=toLocal((p[0].x+p[1].x)/2,(p[0].y+p[1].y)/2);return {x:l.x*dpr,y:l.y*dpr}};
cv.addEventListener('pointerdown',e=>{
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY});
  if(ptrs.size===1)gest={t:'tap'};else if(ptrs.size===2)gest={t:'pinch',d0:pdist()};
});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const d=toLocalD(e.clientX-p.x,e.clientY-p.y);p.x=e.clientX;p.y=e.clientY;
  if(!gest)return;
  if(gest.t==='tap'&&Math.hypot(p.x-p.sx,p.y-p.sy)>8)gest.t='pan';
  if(gest.t==='pan'&&ptrs.size===1){cam.fit=false;cam.x-=d.x*dpr/cam.s;cam.y-=d.y*dpr/cam.s;clampCam()}
  if(gest.t==='pinch'&&ptrs.size===2){const dd=pdist(),m=pmid();if(gest.d0>0){zoomAt(dd/gest.d0,m.x,m.y)}gest.d0=dd}
});
function endPtr(e){
  const p=ptrs.get(e.pointerId);
  if(p&&gest&&gest.t==='tap'&&ptrs.size===1){audio();const l=toLocal(e.clientX,e.clientY),w=localToWorld(l.x,l.y),hit=hitTest(w.x,w.y);if(hit)onTap(hit,w)}
  ptrs.delete(e.pointerId);if(!ptrs.size)gest=null;else if(gest&&gest.t==='pinch')gest={t:'pan'};
}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);if(!ptrs.size)gest=null});
cv.addEventListener('wheel',e=>{e.preventDefault();const l=toLocal(e.clientX,e.clientY);zoomAt(e.deltaY<0?1.15:1/1.15,l.x*dpr,l.y*dpr)},{passive:false});
function thingAt(hit){
  if(hit.wall)return G.doors.find(d=>d.side===hit.wall&&d.pos===hit.pos)||null;
  const k=key(hit.x,hit.y);return occ.get(k)||seatMap.get(k)||frontMap.get(k)||null;
}
function openThing(t){
  panelSel=t;
  if(t.side)openSheet('door',t);else if(t.kind==='m')openSheet('machine',{m:t});else openSheet('decor',t);
}
function onTap(hit,w){
  if(S.phase==='open'){
    const wx=(w.x-OX)/TS-0.5,wy=(w.y-OY)/TS-0.4;
    const c=custs.find(c=>c.reg&&!c.hidden&&Math.abs(c.x-wx)<0.6&&Math.abs(c.y-wy)<0.8);
    if(c){const def=REG_BY[c.reg];toast(`${def.name}（${SEG_NAME[c.seg]}派）`);return}
    const t=thingAt(hit);if(t)openThing(t);return;
  }
  if(S.phase!=='prep')return;
  if(tool==='build'){tryPlace(hit);return}
  if(tool==='move'){moveTap(hit);return}
  if(tool==='zone'){zoneTap(hit);return}
  if(tool==='remove'){const t=hit.wall?thingAt(hit):(occ.get(key(hit.x,hit.y))||frontMap.get(key(hit.x,hit.y)));if(t)removeThing(t,removeMode);else toast('そこには何もありません');return}
  const t=thingAt(hit);if(t){sfx('tap');openThing(t)}
}

/* ---------- タイトル ---------- */
function showTitle(){$('#title').hidden=false;$('#tName').value=S.name}
$('#tTransfer').addEventListener('click',()=>{audio();$('#title').hidden=true;openSheet('transfer','title')});
$('#tStart').addEventListener('click',()=>{
  audio();const n=($('#tName').value||'').trim().slice(0,10)||'パーラー満天';
  S.name=n;$('#title').hidden=true;save();refreshAll();sfx('fanfare');playBgm('prep');
  openSheet('guide','start');prefs.guideSeen=true;savePrefs();
});
async function requestWake(){try{if('wakeLock' in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
let wakeLock=null;
function releaseWake(){try{wakeLock&&wakeLock.release();wakeLock=null}catch(e){}}

/* ===== main.js : ループと起動 ===== */
let lastT=performance.now(),hudT=0;const PERF={u:0,r:0,n:0};
function loop(now){
  const dtR=Math.min(0.1,Math.max(0,(now-lastT)/1000));lastT=now;
  try{
    const t0=performance.now();
    if(S.phase==='open'&&!prefs.paused&&!document.hidden){
      let g=dtR*MIN_PER_SEC*prefs.speed;
      while(g>0&&S.phase==='open'){const s=Math.min(1.5,g);update(s);g-=s}
      hudT+=dtR;
      if(hudT>0.25&&S.phase==='open'){hudT=0;refreshHud();renderStatus();if(sheetKind==='machine'||sheetKind==='list'||sheetKind==='door')renderSheet()}
    }
    for(const o of G.objs)if(o.flash>0)o.flash-=dtR;
    for(const f of floats)f.t+=dtR;
    if(S.phase==='open')tweetTick(now);
    floats=floats.filter(f=>f.t<f.life);
    const t1=performance.now();
    render(now);
    const t2=performance.now();PERF.u+=t1-t0;PERF.r+=t2-t1;PERF.n++;
  }catch(e){console.error(e)}
  requestAnimationFrame(loop);
}
function boot(data){
  loadPrefs();
  let ok=false,src=data&&data.save;
  if(!src){try{src=localStorage.getItem(SAVE_KEY)}catch(e){src=null}}
  if(src){try{ok=load(src)}catch(e){console.error(e);ok=false}}
  if(!ok){newGame('パーラー満天');showTitle()}
  applyLayout();fitCam();refreshAll();
  let rzT=0;const onRz=()=>{clearTimeout(rzT);rzT=setTimeout(()=>{cam.fit=true;applyLayout()},80)};
  window.addEventListener('resize',onRz);window.addEventListener('orientationchange',onRz);
  requestAnimationFrame(loop);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(markDirty).catch(()=>{});
  const unlock=()=>{audio();if(!bgm.cur)playBgm(bgm.want||'prep');window.removeEventListener('pointerdown',unlock,true)};
  window.addEventListener('pointerdown',unlock,true);
}
try{window.claude?.hot?.snapshot?.(()=>({save:S?(S.phase==='open'?openSnap:ser()):null}))}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
window.__dbg={eventTargets,machines,hireStaff,makeCandidate,needStaff,staffOf,forecast,decorRate,addObj,newMachine,validate,layoutChanged,openRivals,dayInfo,get G(){return G},get islands(){return islands}};
window.__perf=PERF;
window.__game={get S(){return S},get custs(){return custs},get D(){return D},get staffA(){return staffA},get cam(){return cam},startDay,closeSheet,openSheet,ff:n=>{for(let i=0;i<n&&S.phase==='open';i++)update(1)}};

})();
